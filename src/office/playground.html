<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src office-playground://local 'unsafe-inline' 'unsafe-eval'; style-src office-playground://local 'unsafe-inline'; img-src office-playground://local data: blob:; connect-src office-playground://local; font-src 'none'" />
  <title>Office Animation Playground (dev)</title>
  <link rel="stylesheet" href="./playground.css" />
</head>
<body>
  <main id="stage-host">
    <!-- The single Pixi canvas mounts here (one Application, one Sprite). -->
  </main>
  <aside id="panel">
    <h1>Animation Playground</h1>
    <p class="hint">dev-only · fake clock · no Harness / IPC / persistence</p>

    <section class="controls">
      <label>state
        <select id="ctl-state">
          <option value="">(derived)</option>
          <option value="idle">idle</option>
          <option value="working">working</option>
          <option value="thinking">thinking</option>
          <option value="waiting">waiting</option>
          <option value="sleeping">sleeping</option>
          <option value="completed">completed</option>
          <option value="failed">failed</option>
          <option value="celebrating">celebrating</option>
          <option value="chatting">chatting</option>
        </select>
      </label>
      <label>direction
        <select id="ctl-direction">
          <option value="">(auto)</option>
          <option value="up">up</option>
          <option value="down">down</option>
          <option value="left">left</option>
          <option value="right">right</option>
        </select>
      </label>
      <label>speed <span id="speed-value">0.12</span>
        <input id="ctl-speed" type="range" min="0.02" max="0.6" step="0.01" value="0.12" />
      </label>
      <label>frame duration (ms) <span id="frame-duration-value">pack</span>
        <input id="ctl-frame-duration" type="range" min="60" max="2000" step="20" value="1000" />
      </label>
      <label class="checkbox"><input id="ctl-loop" type="checkbox" checked /> loop</label>
      <label class="checkbox"><input id="ctl-reduced-motion" type="checkbox" /> reduced motion</label>
      <label class="checkbox"><input id="ctl-direct-target" type="checkbox" /> direct target (debug)</label>
      <label class="checkbox"><input id="ctl-overlay" type="checkbox" checked /> overlay</label>
      <label class="checkbox"><input id="ctl-art" type="checkbox" checked /> show art</label>
      <div class="row">
        <button id="ctl-dispatch">dispatch → desk-1</button>
        <button id="ctl-terminal">terminal ✓</button>
        <button id="ctl-fail">terminal ✗</button>
        <button id="ctl-phase">phase ▸</button>
      </div>
      <div class="row">
        <button id="ctl-pause">pause</button>
        <button id="ctl-step">step +16ms</button>
        <button id="ctl-reset">reset</button>
        <button id="ctl-replay">replay</button>
      </div>
      <p class="hint">click the stage to move to the nearest allowed waypoint</p>
    </section>

    <section id="diagnostics" aria-live="polite">
      <pre id="diag-text">booting…</pre>
    </section>
  </aside>

  <script src="./node_modules/pixi.js/dist/pixi.min.js"></script>
  <script src="./node_modules/pixi.js/dist/packages/unsafe-eval.js"></script>
  <script>
    // Page bootstrap: mini CommonJS loader over the local app scheme. The
    // Task 3 runtime modules are dependency-free CommonJS; loading them as
    // classic scripts would collide their top-level consts in the global
    // scope, so each source is evaluated in its own function scope. No
    // bundler, no network: every URL is office-playground://local.
    (async () => {
      const REGISTRY = {};
      function loadModule(url, requireShim) {
        return fetch(url)
          .then((r) => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.text(); })
          .then((src) => {
            const moduleObj = { exports: {} };
            const factory = new Function('module', 'exports', 'require', src + `\n//# sourceURL=${url}`);
            factory(moduleObj, moduleObj.exports, requireShim || (() => { throw new Error('require unsupported: ' + url); }));
            return moduleObj.exports;
          });
      }
      const runtimePaths = [
        './runtime/asset-pack.js',
        './runtime/animation-controller.js',
        './runtime/movement-controller.js',
        './runtime/transition-controller.js',
        './runtime/state-reducer.js',
      ];
      for (const path of runtimePaths) {
        const name = path.split('/').pop().replace('.js', '');
        REGISTRY[name] = await loadModule(path);
      }
      const requireShim = (spec) => REGISTRY[spec.replace('./runtime/', '').replace('.js', '')];
      const OfficePlayground = await loadModule('./playground-page.js', requireShim);
      window.OfficePlayground = OfficePlayground;

      const loadJson = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); });
      const [graph, events] = await Promise.all([
        loadJson('./fixtures/waypoints.json'),
        loadJson('./fixtures/events.json'),
      ]);
      const packBase = './fixtures/character-pack';
      const [manifest, anchors, animations] = await Promise.all([
        loadJson(`${packBase}/manifest.json`),
        loadJson(`${packBase}/animation/anchors.json`),
        loadJson(`${packBase}/animation/animations.json`),
      ]);
      const pack = REGISTRY['asset-pack'].createAssetPack({ manifest, anchors, animations });
      if (!pack.ok) throw new Error('pack invalid: ' + JSON.stringify(pack.errors || []));

      const harness = OfficePlayground.createPlaygroundHarness({
        pack: pack.pack,
        graph,
        events: events.events,
        scene: { width: 1280, height: 840 },
        seed: events.seed || 'office-playground',
        startNodeId: events.startNodeId || 'roam-1',
      });

      // Textures load through Image() — no fetch, no network, no PIXI.Assets.
      const frames = new Set();
      for (const id of Object.keys(animations.animations)) {
        for (const frame of animations.animations[id].frames) frames.add(frame.file);
      }
      const textures = new Map();
      await Promise.all([...frames].map((file) => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => { textures.set(file, window.PIXI.Texture.from(img)); resolve(); };
        img.onerror = () => reject(new Error('texture failed: ' + file));
        img.src = `${packBase}/${file}`;
      })));

      const nodesById = new Map(graph.nodes.map((n) => [n.id, n]));
      const view = await OfficePlayground.createPlaygroundView({
        PIXI: window.PIXI,
        harness,
        textures,
        packBaseUrl: packBase,
        mount: document.getElementById('stage-host'),
        overlayNodes: nodesById,
      });

      // Fixed-step fake ticker: every rendered frame advances the fake clock
      // by exactly 16ms. No wall-clock deltas — hiding the window advances
      // nothing, and replays stay byte-identical.
      let pagePaused = false;
      window.PIXI.Ticker.shared.add(() => { if (!pagePaused) harness.tick(OfficePlayground.TICK_MS); });

      const $ = (id) => document.getElementById(id);
      const diag = $('diag-text');
      function renderPanel() {
        view.refresh();
        const d = harness.diagnostics();
        const layout = harness.spriteLayout();
        const screen = harness.screenPositionOf(d.position);
        diag.textContent = JSON.stringify({
          fakeTimeMs: d.fakeTimeMs,
          logical: d.position,
          screen: { x: Math.round(screen.x * 10) / 10, y: Math.round(screen.y * 10) / 10 },
          direction: d.direction,
          target: d.target && d.target.nodeId,
          route: d.routeId,
          transition: d.transition && `${d.transition.kind}/${d.transition.phase}`,
          animation: d.animation,
          fallback: d.animation.fallbackReason,
          frame: `${d.animation.frameIndex}`,
          reducer: d.reducer,
          geometry: { visibleHeight: layout.visibleHeight, scale: Math.round(layout.scale * 1000) / 1000 },
        speed: d.speedRatio,
        directionOverride: d.directionOverride,
        loop: d.loopOverride,
        }, null, 1);
      }

      // controls
      $('ctl-state').addEventListener('change', (e) => { harness.setState(e.target.value || null); renderPanel(); });
      $('ctl-direction').addEventListener('change', (e) => { harness.setDirection(e.target.value || null); renderPanel(); });
      $('ctl-speed').addEventListener('input', (e) => {
        harness.setSpeed(Number(e.target.value));
        $('speed-value').textContent = e.target.value;
      });
      $('ctl-frame-duration').addEventListener('input', (e) => {
        harness.setFrameDurationMs(Number(e.target.value));
        $('frame-duration-value').textContent = e.target.value;
      });
      $('ctl-loop').addEventListener('change', (e) => harness.setLoop(e.target.checked));
      $('ctl-reduced-motion').addEventListener('change', (e) => harness.setReducedMotion(e.target.checked));
      $('ctl-direct-target').addEventListener('change', (e) => harness.setDirectTargetEnabled(e.target.checked));
      $('ctl-overlay').addEventListener('change', (e) => view.setOverlayVisible(e.target.checked));
      $('ctl-art').addEventListener('change', (e) => view.setArtVisible(e.target.checked));
      $('ctl-dispatch').addEventListener('click', () => { harness.applyEvent({ type: 'dispatch', targetNodeId: 'desk-1' }); });
      $('ctl-terminal').addEventListener('click', () => { harness.applyEvent({ type: 'task-terminal', outcome: 'completed', result: { summary: 'manual' } }); });
      $('ctl-fail').addEventListener('click', () => { harness.applyEvent({ type: 'task-terminal', outcome: 'failed', result: { summary: 'manual' } }); });
      $('ctl-phase').addEventListener('click', () => { harness.applyEvent({ type: 'phase-complete' }); });
      $('ctl-pause').addEventListener('click', (e) => {
        pagePaused = !pagePaused;
        e.target.textContent = pagePaused ? 'resume' : 'pause';
      });
      $('ctl-step').addEventListener('click', () => { harness.tick(OfficePlayground.TICK_MS); renderPanel(); });
      $('ctl-reset').addEventListener('click', () => { harness.clock.reset(); renderPanel(); });
      $('ctl-replay').addEventListener('click', () => { harness.replay(); renderPanel(); });

      const stage = document.getElementById('stage-host');
      stage.addEventListener('click', (event) => {
        const rect = stage.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        if ($('ctl-direct-target').checked) harness.clickToTarget(px, py);
        else harness.clickToWaypoint(px, py, 'roaming');
      });

      harness.replay(); // deterministic opening state from the fixture
      renderPanel();
      window.__playground = {
        ready: true,
        harness,
        view,
        api: {
          dispatchTo: (nodeId) => harness.applyEvent({ type: 'dispatch', targetNodeId: nodeId }),
          terminal: (outcome) => harness.applyEvent({ type: 'task-terminal', outcome, result: { summary: 'evidence' } }),
          phase: () => harness.applyEvent({ type: 'phase-complete' }),
          fact: (fact, reason) => harness.applyEvent({ type: 'runtime/fact', fact, reason }),
          setState: (s) => harness.setState(s),
          setDirection: (d) => harness.setDirection(d),
          setSpeed: (v) => harness.setSpeed(v),
          setLoop: (v) => harness.setLoop(v),
          setScene: (w, h) => harness.setScene({ width: w, height: h }),
          setReducedMotion: (v) => harness.setReducedMotion(v),
          setDirectTarget: (v) => harness.setDirectTargetEnabled(v),
          clickWaypoint: (px, py) => harness.clickToWaypoint(px, py, 'roaming'),
          tickFor: (ms) => { for (let t = 0; t < ms; t += OfficePlayground.TICK_MS) harness.tick(OfficePlayground.TICK_MS); },
          tickOnce: () => harness.tick(OfficePlayground.TICK_MS),
          diagnostics: () => harness.diagnostics(),
          pixiVersion: () => window.PIXI.VERSION,
          devicePixelRatio: () => window.devicePixelRatio,
        },
      };
      setInterval(renderPanel, 100);
    })().catch((error) => {
      document.getElementById('diag-text').textContent = 'BOOT FAILED: ' + (error && error.message);
      window.__playground = { ready: false, error: String((error && error.message) || error) };
    });
  </script>
</body>
</html>
