      editorForwardButton.addEventListener('click', () => {
        const selected = editor.selected();
        if (!selected) return;
        editor.bringForward(selected.id);
        renderEditorDraft();
      });
      editorBackwardButton.addEventListener('click', () => {
        const selected = editor.selected();
        if (!selected) return;
        editor.sendBackward(selected.id);
        renderEditorDraft();
      });

      // Task E2e — depth/order buttons. 置顶/置底 use the absolute z-order API
      // (moveItemToIndex; multi-selection moves as a contiguous block), 上移/下移
      // reuse the selection block layer ops. Each call is exactly ONE undo
      // unit. Visual reach: array order is the same-layer tiebreak of the
      // (layer, array) paint order — cross-band depth is the 层级 field.
      // Task E3b fix: the depth buttons drive the VISUAL order now — the
      // E2e array-order wiring could never change occlusion between items
      // with different layers (user-reported). Cross-layer moves swap the
      // layer VALUES so the paint order (and z-index) really flips.
      document.getElementById('editor-front').addEventListener('click', () => {
        const selected = editor.selected();
        if (!selected) return;
        editor.bringVisualToFront(selected.id);
        renderEditorDraft();
      });
      document.getElementById('editor-back').addEventListener('click', () => {
        const selected = editor.selected();
        if (!selected) return;
        editor.sendVisualToBack(selected.id);
        renderEditorDraft();
      });
      document.getElementById('editor-layer-up').addEventListener('click', () => {
        const selected = editor.selected();
        if (!selected) return;
        editor.moveVisualUp(selected.id);
        renderEditorDraft();
      });
      document.getElementById('editor-layer-down').addEventListener('click', () => {
        const selected = editor.selected();
        if (!selected) return;
        editor.moveVisualDown(selected.id);
        renderEditorDraft();
      });

      // Task E2e — material groups: 编组 from the toolbar selection; 解组
      // moves the selected items out of their groups. Group ops never touch
      // groupId of unselected members.
      document.getElementById('editor-group').addEventListener('click', () => { editor.groupSelection(); renderEditorDraft(); });
      document.getElementById('editor-ungroup').addEventListener('click', () => { editor.ungroupSelection(); renderEditorDraft(); });
      syncEditorControls();

      function renderOverview(snapshot) {
        const overview = page.overview();
        document.getElementById('overview-summary').textContent =
          `在岗 ${overview.presentCount} 人 · 执行任务 ${overview.runningCount} · 排队 ${overview.queuedCount}`;
        const syncLabel = { healthy: '同步正常', stale: '同步滞后', resyncing: '正在重新同步' }[snapshot.sync] || snapshot.sync;
        document.getElementById('sync-summary').textContent = `同步：${syncLabel}`;
      }

      const listEl = document.getElementById('employee-list');
      const listItems = new Map();
      function renderEmployeeList(snapshot) {
        const order = page.focusOrder();
        // stable element per employee: status refresh never rebuilds the list
        for (const employee of snapshot.employees) {
          let item = listItems.get(employee.employeeId);
          if (!item) {
            item = document.createElement('li');
            item.setAttribute('role', 'option');
            item.tabIndex = -1;
            const label = page.accessibleLabelFor(employee.employeeId).label;
            item.setAttribute('aria-label', label);
            item.addEventListener('click', () => {
              page.select(employee.employeeId);
              renderDetails();
              syncListSelection();
            });
            listEl.appendChild(item);
            listItems.set(employee.employeeId, item);
          }
          const a11y = page.accessibleLabelFor(employee.employeeId).label;
          item.setAttribute('aria-label', a11y);
          item.setAttribute('aria-selected', page.selectedEmployeeId() === employee.employeeId ? 'true' : 'false');
          item.textContent = `${employee.displayName} · ${employee.activity}${employee.queueCount > 0 ? `（排队 ${employee.queueCount}）` : ''}`;
        }
        for (const [id, item] of [...listItems]) {
          if (!order.includes(id)) { item.remove(); listItems.delete(id); }
        }
        void listEl;
      }

      function syncListSelection() {
        for (const [id, item] of listItems) {
          item.setAttribute('aria-selected', page.selectedEmployeeId() === id ? 'true' : 'false');
          item.classList.toggle('selected', page.selectedEmployeeId() === id);
        }
      }

      function renderDetails() {
        const body = document.getElementById('details-body');
        const placeholder = document.getElementById('details-placeholder');
        const selected = page.selectedEmployeeId();
        const vm = selected ? page.detailsFor(selected) : null;
        if (!vm) {
          body.hidden = true;
          placeholder.hidden = false;
          return;
        }
        placeholder.hidden = true;
        body.hidden = false;
        const nameEl = document.getElementById('details-name');
        nameEl.textContent = vm.name.text;
        nameEl.className = 'details-name-large';
        nameEl.setAttribute('aria-label', `${vm.name.text} 详情`);
        const roleEl = document.getElementById('details-role');
        roleEl.textContent = `● ${vm.roleDot.text}`;
        roleEl.className = 'details-role-dot';
        const primaryEl = document.getElementById('details-primary');
        primaryEl.textContent = vm.primary.text;
        primaryEl.className = 'details-primary';
        primaryEl.setAttribute('aria-label', vm.primary.accessibleLabel || vm.primary.text);
        const dimEl = document.getElementById('details-dim');
        dimEl.replaceChildren(...vm.dimFields.map((field) => {
          const li = document.createElement('li');
          li.className = 'dim-field';
          li.textContent = `${field.label}：${field.value}`;
          return li;
        }));
        const queueEl = document.getElementById('details-queue');
        queueEl.textContent = vm.queueCount > 0
          ? `排队任务 ${vm.queueCount} 项${vm.waiting.length ? '：' + vm.waiting.map((w) => `第 ${w.position} 位`).join('、') : ''}`
          : '';
        const capabilities = page.capabilities() || {};
        const bound = !!latestSnapshot && !!latestSnapshot.employees.find((e) => e.employeeId === selected && e.binding);
        document.getElementById('btn-dispatch').disabled = !bound || !capabilities.followup;
        document.getElementById('btn-cancel').disabled = !bound || !capabilities.cancel;
        document.getElementById('btn-interrupt').disabled = !bound || !capabilities.interrupt;
      }

      function renderActivity(snapshot) {
        const logEl = document.getElementById('activity-log');
        const entries = page.activityLog().slice(-12).reverse();
        logEl.replaceChildren(...entries.map((entry) => {
          const li = document.createElement('li');
          li.textContent = `${new Date(entry.atMs).toISOString().slice(11, 19)} · ${employeeName(entry.employeeId)} · ${entry.label}`;
          return li;
        }));
        void snapshot;
      }

      function employeeName(employeeId) {
        const employee = latestSnapshot && latestSnapshot.employees.find((e) => e.employeeId === employeeId);
        return employee ? employee.displayName : employeeId;
      }

      // pointer selection on the Pixi canvas — hit-tests run against the
      // LETTERBOXED canvas rect (scene pixels), not the whole stage
      stage.addEventListener('click', (event) => {
        const sceneCanvas = stage.querySelector('canvas');
        const rect = (sceneCanvas || stage).getBoundingClientRect();
        const hit = renderer.hitTest(event.clientX - rect.left, event.clientY - rect.top);
        if (hit) {
          page.select(hit);
          renderer.setSelection(hit);
          syncListSelection();
          renderDetails();
        }
      });

      // keyboard: list focus + scene selection (shared with the evidence API)
      function handleKeyEvent(key) {
        const result = page.handleKey({ key });
        if (result.action === 'focus') {
          const id = page.focusOrder()[result.index];
          const item = listItems.get(id);
          if (item) item.focus();
          renderer.setSelection(null);
        } else if (result.action === 'select') {
          renderer.setSelection(result.employeeId);
          syncListSelection();
          renderDetails();
        } else if (result.action === 'clear') {
          renderer.setSelection(null);
          syncListSelection();
          renderDetails();
        }
        return result;
      }
      document.addEventListener('keyup', (event) => {
        if (event.key === ' ') spacePanHeld = false;
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Tab') return; // native focus order handles panel traversal
        // Task E2a: when the layout editor is open its editing shortcuts win
        // (typing fields are excluded); unmatched keys keep the page's
        // employee navigation behaviour.
        const targetTag = event.target && event.target.tagName;
        const inField = targetTag === 'INPUT' || targetTag === 'SELECT' || targetTag === 'TEXTAREA';
        // Task E2b: holding space arms the canvas pan gesture (editor open only)
        if (!editorRoot.hidden && !inField && event.key === ' ') {
          spacePanHeld = true;
          event.preventDefault();
          return;
        }
        if (!editorRoot.hidden && !inField) {
          const meta = event.metaKey || event.ctrlKey;
          if (meta && event.key.toLowerCase() === 'd') {
            event.preventDefault();
            editor.duplicateSelection();
            renderEditorDraft();
            return;
          }
          if (meta && event.key.toLowerCase() === 'a') {
            event.preventDefault();
            editor.selectAll();
            renderEditorDraft();
            return;
          }
          if (event.key === 'Delete' || event.key === 'Backspace') {
            event.preventDefault();
            deleteSelectionWithStatus();
            return;
          }
          if (event.key === 'Escape') {
            editor.clearSelection();
            renderEditorDraft();
            return;
          }
          if (event.key.startsWith('Arrow')) {
            event.preventDefault();
            const step = event.shiftKey ? 0.01 : 0.001;
            const dx = event.key === 'ArrowLeft' ? -step : event.key === 'ArrowRight' ? step : 0;
            const dy = event.key === 'ArrowUp' ? -step : event.key === 'ArrowDown' ? step : 0;
            editor.nudgeSelection(dx, dy, { mergeKey: `${event.key}${event.shiftKey ? '+shift' : ''}`, now: Date.now() });
            renderEditorDraft();
            return;
          }
        }
        const result = handleKeyEvent(event.key);
        if (result.action !== 'none') event.preventDefault();
      });

      document.getElementById('btn-dispatch').addEventListener('click', async () => {
        const selected = page.selectedEmployeeId();
        if (selected) await page.dispatch(selected);
      });
      document.getElementById('btn-cancel').addEventListener('click', async () => {
        const selected = page.selectedEmployeeId();
        if (selected) await page.cancel(selected);
      });
      document.getElementById('btn-interrupt').addEventListener('click', async () => {
        const selected = page.selectedEmployeeId();
        if (selected) await page.interrupt(selected);
      });

      const reducedMotionCtl = document.getElementById('ctl-reduced-motion');
      reducedMotionCtl.addEventListener('change', async () => {
        await page.setReducedMotion(reducedMotionCtl.checked);
      });
      const layoutEditorButton = document.createElement('button');
      layoutEditorButton.id = 'btn-layout-editor';
      layoutEditorButton.type = 'button';
      layoutEditorButton.textContent = '布局编辑';
      layoutEditorButton.addEventListener('click', () => setEditorVisible(editorRoot.hidden));
      document.getElementById('office-overview').appendChild(layoutEditorButton);
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        reducedMotionCtl.checked = true;
        await page.setReducedMotion(true);
      }

      // visibility lifecycle: pause the main-process clock when hidden
      const visibility = (visible) => page.handleVisibility(visible);
      document.addEventListener('visibilitychange', () => visibility(document.visibilityState === 'visible'));
      window.addEventListener('blur', () => visibility(false));
      window.addEventListener('focus', () => visibility(true));
      bridge.onVisibilityPush((payload) => visibility(payload && payload.visible));

      function resize() {
        const rect = stage.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          // Task E4.4: FIXED logical scene + letterbox — the canvas keeps the
          // scene reference aspect at every window size (uniform scale, dead
          // centered), so the composition never stretches or crops with the
          // window ratio. The renderer reprojects the whole scene to the
          // scaled logical size; the leftover space stays background.
          const ref = layout.scene();
          const letterboxScale = Math.min(rect.width / ref.referenceWidth, rect.height / ref.referenceHeight);
          const sceneW = ref.referenceWidth * letterboxScale;
          const sceneH = ref.referenceHeight * letterboxScale;
          renderer.resize({ width: sceneW, height: sceneH });
          const canvas = stage.querySelector('canvas');
          if (canvas) {
            canvas.style.left = `${(rect.width - sceneW) / 2}px`;
            canvas.style.top = `${(rect.height - sceneH) / 2}px`;
            canvas.style.width = `${sceneW}px`;
            canvas.style.height = `${sceneH}px`;
          }
        }
        // Task E2b (must-fix): the editor handles are positioned in canvas px —
        // re-position them so they follow window resizes instead of drifting.
        // The first pass runs synchronously; a deferred pass re-runs after the
        // browser settles the new layout (offsets can be stale mid-resize).
        if (!editorRoot.hidden) {
          // Task E2b-R1/E3b: the view re-baselines to the LIVE SCENE FRAME
          updateSceneFrame();
          applyView();
          // Task E3d: item boxes are scene-relative — they must re-derive
          // from the new frame size or the composition drifts with the
          // window (the probe asserts node width / frame width is constant).
          resizeItemBoxes();
          updateInspectorSizePx();
          // Task E3d: deferred second pass — a resize event can fire BEFORE
          // the OS settles the new window size (the real-shell probe caught
          // a frame computed from the OLD canvas rect), so re-derive the
          // frame, the view and every node box once the layout has settled.
          setTimeout(() => {
            if (editorRoot.hidden) return;
            updateSceneFrame();
            applyView();
            resizeItemBoxes();
            positionHandles();
            updateInspectorSizePx();
          }, 100);
        }
      }
      // Task E3d: re-derive every placed node box from the CURRENT scene
      // frame (scene-relative sizes); hidden items have no node and are
      // simply skipped — their box matters only to fit-view's fallback.
      function resizeItemBoxes() {
        const items = editor.toJSON().items;
        for (const node of editorItems.children) {
          const draft = items.find((item) => item.id === node.dataset.draftId);
          if (draft) applyItemGeometry(node, draft);
        }
        positionHandles();
      }
      window.addEventListener('resize', resize);
      resize();

      const stateResult = await bridge.getState();
      page.applySnapshot(stateResult && stateResult.ok ? stateResult.snapshot : stateResult);
      // One main-process clock: subsequent snapshots arrive as office:state
      // pushes (throttled in the module); the page only re-renders the VM.
      bridge.onState((snapshot) => page.applySnapshot(snapshot));

      // Evidence hooks (diagnostics-only, same spirit as the playground)
      window.__office = {
        ready: true,
        page,
        renderer,
        api: {
          selected: () => page.selectedEmployeeId(),
          select: (id) => { page.select(id); renderer.setSelection(id); renderDetails(); syncListSelection(); },
          clear: () => { page.clearSelection(); renderer.setSelection(null); renderDetails(); syncListSelection(); },
          key: (key) => handleKeyEvent(key),
          overview: () => page.overview(),
          snapshot: () => latestSnapshot,
          rendererMode: () => renderer.mode,
          diagnosticCode: () => renderer.diagnosticCode,
          officeDiagnostics: () => renderer.officeDiagnostics(),
          furniturePaintOrder: () => renderer.furniturePaintOrder(),
          packDiagnostic: () => packDiagnostic,
          packId: () => officePackId,
          applySnapshotManually: (s) => renderer.applySnapshot(s),
          resizeTo: (w, h) => renderer.resize({ width: w, height: h }),
          devicePixelRatio: () => window.devicePixelRatio,
          pixiVersion: () => window.PIXI && window.PIXI.VERSION,
          setReducedMotion: async (v) => { reducedMotionCtl.checked = !!v; await page.setReducedMotion(!!v); },
          layoutDraft: () => editor.toJSON(),
          viewState: () => ({ ...view.get(), frameTransform: sceneFrameElement.style.transform, frameRect: (() => { const r = sceneFrameElement.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; })(), itemsRect: (() => { const r = editorItems.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; })() }),
          setGroupMoveRigid: (groupId, rigid) => editor.setGroupMoveRigid(groupId, rigid),
          layoutDiagnostic: () => layoutDiagnostic,
          layoutSource: () => layoutSource,
          runtimeLayoutSource: () => runtimeLayoutSource,
          runtimeLayoutCode: () => runtimeLayoutCode,
          toggleLayoutEditor: () => setEditorVisible(editorRoot.hidden),
        },
      };

      // Task E2d: the standalone launcher boots with ?editor=1 — open the
      // layout editor immediately after the boot settles (every earlier
      // editor entry point stays available; this only AUTO-opens).
      if (officeEditorParam === '1') setEditorVisible(true);
    })().catch((error) => {
      const note = document.getElementById('fallback-note');
      if (note) {
        note.hidden = false;
        note.textContent = `办公室页面启动失败：${(error && error.message) || error}`;
      }
      window.__office = { ready: false, error: String((error && error.message) || error), stack: String((error && error.stack) || error) };
    });
  </script>
</body>
</html>
