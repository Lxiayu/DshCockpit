<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Quick Ask</title>
<link rel="stylesheet" href="theme.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-app); color: var(--text-1);
    font: 13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  #box { padding: 12px; }
  textarea { width: 100%; height: 64px; resize: none; background: var(--bg-panel); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 8px; padding: 8px 10px; font: inherit; outline: none;
    transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
  textarea::placeholder { color: var(--text-4); }
  textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
  #status { margin-top: 8px; color: var(--text-3); white-space: pre-wrap; word-break: break-all;
    max-height: 120px; overflow-y: auto; font-size: 12px; }
  #status.done { color: var(--ok); }
  #status.err { color: var(--bad); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-4) 40%, transparent);
    border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-4) 60%, transparent); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="box">
  <textarea id="prompt" rows="2" placeholder=""></textarea>
  <div id="status"></div>
</div>
<script>
  const ta = document.getElementById('prompt');
  const status = document.getElementById('status');
  const L = { zh: { ph: '输入问题，回车提交（后台运行，完成后通知）', running: '运行中…（完成后会通知）', done: '✅ 完成', fail: '❌ 失败', empty: '⚠ 未返回结果' },
              en: { ph: 'Ask anything, Enter to run in the background', running: 'Running… (you will be notified)', done: '✅ Done', fail: '❌ Failed', empty: '⚠ No result' } };
  let lang = 'zh';
  (async () => {
    try { document.documentElement.dataset.theme = await window.dshQuickAsk.getTheme(); } catch { /* dark default */ }
    window.dshQuickAsk.onTheme((t) => {
      const root = document.documentElement;
      root.classList.add('theme-anim');
      root.dataset.theme = t;
      setTimeout(() => root.classList.remove('theme-anim'), 420);
    });
    try { const s = await window.dshQuickAsk.getSettings(); lang = s.resolvedLanguage === 'en' ? 'en' : 'zh'; } catch {}
    ta.placeholder = L[lang].ph;
    ta.focus();
  })();
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
    if (e.key === 'Escape') window.dshQuickAsk.close();
  });
  async function submit() {
    const text = ta.value.trim();
    if (!text) return;
    ta.disabled = true;
    status.textContent = L[lang].running;
    status.className = '';
    try {
      const r = await window.dshQuickAsk.submit(text);
      if (r && r.output) {
        const snippet = r.output.slice(0, 600);
        status.textContent = (r.ok ? L[lang].done : L[lang].fail) + ` (${Math.round((r.durationMs || 0) / 1000)}s)\n${snippet}`;
        status.className = r.ok ? 'done' : 'err';
      } else {
        status.textContent = L[lang].empty;
      }
    } catch (e) {
      status.textContent = L[lang].fail + ' ' + e.message;
      status.className = 'err';
    } finally {
      ta.disabled = false;
    }
  }
</script>
</body>
</html>
