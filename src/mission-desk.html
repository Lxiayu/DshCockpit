<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Mission Desk</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* Mission Desk —— P1 的第一个用户可见界面。
   *
   * 设计原则（来自 docs/design/mission-desk.md 与 domain-model §2.1.1）：
   *
   *   1. **Active / Focused / Running 三个轴必须视觉上分开**。
   *      用户最容易被误导的地方就是把"我在看这个"当成"这个在跑"。
   *      → 卡片上的 status 徽章（Active）与 running 圆点（Running）不放在一起，
   *        且 running 必须带"x 秒前观察到"。
   *
   *   2. **多个 active 是常态，不是异常**。
   *      → 不做"当前项目"这种单数表述；列表默认显示全部 active。
   *      超过 10 个时给**轻量提示**（软上限），绝不阻止创建。
   *
   *   3. **实时状态不可用时明说**（不是显示"未运行"）。
   *      → 没有 Harness 快照时显示"实时状态不可用"，而不是一个看起来确定的灰点。
   *
   *   4. **Brief 是可见的**，因为它就是 Agent 下次会读到的东西。
   *      用户应该能直接看到"我的项目记忆长什么样"。
   */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-app); color: var(--text-1); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; font-size: 13px; line-height: 1.55; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-1); flex: 0 0 auto; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  .muted { color: var(--text-3); }
  .tiny { font-size: 11px; }

  button { border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 7px; padding: 6px 12px; background: var(--bg-hover); }
  button:hover, button:focus-visible { background: var(--border-2); outline: none; }
  button.primary { background: var(--acc); color: var(--on-acc); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  main { display: flex; gap: 0; flex: 1 1 auto; min-height: 0; }
  #list { flex: 0 0 320px; border-right: 1px solid var(--border-1); overflow: auto; padding: 10px; }
  #detail { flex: 1 1 auto; overflow: auto; padding: 16px; min-width: 0; }

  /* ---------------------------------------------------------------- dock 模式
     右栏宽度只有 380px，不能沿用"左列表 + 右详情"的双栏。
     切到单列：顶部一个 Mission 选择器，下面全是详情。
     同一个文件两种布局，避免维护两份 UI（那必然漂移）。 */
  body.dock main { flex-direction: column; overflow: auto; }
  /* dock 里列表卡片整个隐藏：顶部下拉已经承担了选择职责。
     之前只隐藏 .row 不隐藏 .card，于是选中项会以一张带边框的卡片
     在详情上方重复出现一次（真机截图抓到的）。 */
  /* dock 里 #list 整个让位给 detail：
     顶部下拉已经承担选择职责，列表区的任何内容（卡片/空状态引导）
     都与 detail 的对应内容重复。真机截图抓到过"从这里开始"和
     "还没有选中任何 Mission"同时出现两遍的情况。 */
  body.dock #list { display: none; }
  body.dock #detail { flex: 1 1 auto; padding: 12px 14px; overflow: visible; }
  body.dock h2 { margin-top: 12px; }
  /* dock 里 header 的 h1 与选择器的 "MISSION DESK" 标签重复。
     保留 h1（它是页面标识），去掉选择器里那行小标题。 */
  body.dock #dockPicker .dock-head { display: none; }
  /* 顶部选择器：dock 模式下唯一需要的"列表" */
  #dockPicker { display: none; }
  body.dock #dockPicker { display: block; flex: 0 0 auto;
    border-bottom: 1px solid var(--border-1); padding: 8px 10px; }
  /* 注意：这里原来写的是 var(--bg-2) —— 但 --bg-2 在 theme.css 里
     **根本不存在**，所以永远回退到深色 #22252c。浅色主题下变成深底深字，
     几乎看不见（浅色截图抓到的）。所有 token 必须先在 theme.css 定义。 */
  #dockPicker select { width: 100%; background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  #dockPicker .dock-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #dockPicker .dock-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-3); }

  /* 卡片：status 与 running 分开呈现 */
  .card { border: 1px solid var(--border-1); border-radius: 9px; padding: 10px 11px; margin-bottom: 8px; cursor: pointer; background: var(--bg-panel); }
  .card:hover { border-color: var(--border-2); }
  .card.sel { border-color: var(--acc); }
  .card .title { font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  .card .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Mission 自身状态（我们拥有的） */
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--bg-hover); color: var(--text-2); letter-spacing: .02em; }
  .badge.active { background: var(--att-info-bg); color: var(--att-info-fg); }
  .badge.paused { background: var(--att-warn-bg); color: var(--att-warn-fg); }
  .badge.completed { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .badge.abandoned { background: var(--att-idle-bg); color: var(--att-idle-fg); }

  /* Harness 的事实（只读，必须带时间） */
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); flex: 0 0 7px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--att-ok-bg); }
  .dot.unknown { background: transparent; border: 1px solid var(--text-4); }

  /* ==================================================================
     视觉层级（P4 深度打磨）
     ------------------------------------------------------------------
     第一性原理：用户说"不要只是简单的几个框和按钮"——
     要的不是花哨，是**视觉重量承载语义层级**。

     三级重量：
       L1 需要行动（待办）    最深底 + 左侧强调条 + 最高对比
       L2 情境（快照/时间线）  中等，卡片底
       L3 参考（决策/问题等）  最轻，仅分隔线

     所有颜色一律走 token —— 这页原来有 37 处硬编码色，
     浅色模式下浅蓝字配白底几乎不可见。
     ================================================================== */

  /* --- L1: 需要你处理 ------------------------------------------------ */
  .att { border-radius: 10px; margin: 0 0 10px; overflow: hidden; border: 1px solid var(--border-1); }
  .att.att-present { border-color: var(--att-bad-line); background: var(--att-bad-bg); }
  .att.att-clear { background: var(--bg-panel); }
  .att-head {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 11px; font-size: 12px; font-weight: 650; letter-spacing: .01em;
  }
  .att.att-present .att-head { color: var(--att-bad-fg); }
  .att.att-clear .att-head { color: var(--att-ok-fg); }
  .att-count {
    margin-left: auto; font-size: 10px; font-weight: 600; padding: 1px 7px;
    border-radius: 999px; background: var(--att-idle-bg); color: var(--att-idle-fg);
  }
  .att.att-present .att-count { background: var(--att-bad-strong); color: var(--att-bad-fg); }
  .att-clear-msg { padding: 0 11px 10px; font-size: 11.5px; color: var(--text-3); line-height: 1.55; }

  /* 待办卡片：风险用左侧竖条表达，不用整块染色（整块会抢走全部注意力） */
  .att-item {
    display: flex; flex-direction: column; gap: 4px;
    padding: 9px 11px 10px 13px;
    position: relative;
    transition: background .12s var(--ease);
  }
  .att-item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--att-idle-fg);
  }
  .att-item[data-risk="high"]::before { background: var(--bad); }
  .att-item[data-risk="medium"]::before { background: var(--warn); }
  .att-item[data-risk="low"]::before { background: var(--att-idle-fg); }
  /* 项之间靠极淡的分隔线（比区块间的线更淡），因为它们是同一张卡内的条目 */
  .att-item + .att-item { box-shadow: inset 0 1px 0 var(--border-1); }
  .att-item:hover { background: var(--bg-hover); }
  .att-item-line { display: flex; align-items: baseline; gap: 6px; }
  .att-item-kind {
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; flex: 0 0 auto;
  }
  .att-item[data-kind="approval"] .att-item-kind { background: var(--att-bad-bg); color: var(--att-bad-fg); }
  .att-item[data-kind="question"] .att-item-kind { background: var(--att-info-bg); color: var(--att-info-fg); }
  .att-item-text { font-size: 12px; color: var(--text-1); line-height: 1.45; overflow-wrap: anywhere; }
  /* 元信息（工具名/风险/时间）是**要读的**，所以不能用 --text-4（最弱层）。
     真机对比度实测：--text-4 在深色是 2.89:1、浅色 2.57:1，都低于 AA 4.5:1。
     --text-3 达标（深 5.6 / 浅 4.9）。 */
  .att-item-meta { font-size: 10.5px; color: var(--text-3); }
  .att-item-actions { display: flex; gap: 6px; margin-top: 3px; }
  .att-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border-2); background: var(--bg-hover); color: var(--text-2);
    transition: background .15s var(--ease), color .15s var(--ease);
  }
  .att-btn:hover { background: var(--bg-overlay); color: var(--text-1); }
  .att-btn.danger { border-color: var(--att-bad-line); color: var(--att-bad-fg); }
  .att-btn.primary { background: var(--acc); border-color: transparent; color: var(--on-acc); }
  .att-btn.primary:hover { background: var(--acc-hover); }

  /* --- L2: 离开期间发生了什么（时间线）------------------------------- */
  .tl { margin: 0 0 10px; padding: 10px 11px; border-radius: 10px; background: var(--bg-panel); border: 1px solid var(--border-1); }
  .tl-head { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 650; color: var(--text-1); margin-bottom: 7px; }
  .tl-when { font-size: 10.5px; color: var(--text-4); font-weight: 400; margin-left: auto; }
  .tl-list { list-style: none; margin: 0; padding: 0 0 0 11px; border-left: 1px solid var(--tl-line); }
  .tl-list li { position: relative; padding: 3px 0 3px 9px; font-size: 11.5px; color: var(--tl-fg); line-height: 1.5; }
  .tl-list li::before {
    content: ''; position: absolute; left: -14px; top: 9px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--tl-line);
  }
  .tl-list li[data-tone="ok"]::before { background: var(--ok); }
  .tl-list li[data-tone="warn"]::before { background: var(--warn); }
  .tl-list li[data-tone="info"]::before { background: var(--info); }
  .tl-tag { font-size: 9.5px; color: var(--tl-time); margin-right: 5px; }
  .tl-more { font-size: 10.5px; color: var(--text-4); padding: 5px 0 0 11px; }

  /* --- L3: 参考区块（可折叠）---------------------------------------- */
  /* --- Shared Context 条目（发现/假设/证据）--------------------------
     与"待办"的区别：待办是需要行动，这些是**参考资料**。
     所以视觉更轻：无边框、无底色，只有状态徽标 + 文字。
     第三层（参考）就该是这个重量。 */
  .sc-list { list-style: none; margin: 0; padding: 0; }
  .sc-item { padding: 7px 0; }
  .sc-line { display: flex; align-items: baseline; gap: 7px; }
  .sc-text { font-size: 12.5px; color: var(--text-1); line-height: 1.5; overflow-wrap: anywhere; }
  .sc-mono { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
  .sc-badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
    padding: 1.5px 6px; border-radius: 4px; flex: 0 0 auto;
  }
  .sc-badge-kind { background: var(--acc-soft); color: var(--acc); }
  .sc-meta { font-size: 10.5px; color: var(--text-3); margin-top: 3px; padding-left: 2px; }
  /* 状态色只上徽标，不染整行——整行染色会抢走"待办"的注意力 */
  .st-finding-unverified, .st-assumption-unverified { background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .st-finding-verified, .st-assumption-holding { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .st-finding-refuted, .st-assumption-violated, .st-assumption-expired { background: var(--att-bad-bg); color: var(--att-bad-fg); }

  /* Linear 原则：「no separators — only background hover state」。
     区块之间靠**留白**分组，不靠横线。留 14px 的呼吸。
     原来每个 .sec 都有 border-top，结果整页像一张表单。 */
  .sec { margin-top: 14px; }
  .sec > summary {
    display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
    padding: 9px 2px; font-size: 12px; font-weight: 620; color: var(--text-2);
    user-select: none;
  }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary::after {
    content: '▸'; margin-left: auto; font-size: 10px; color: var(--text-4);
    transition: transform .15s var(--ease);
  }
  .sec[open] > summary::after { transform: rotate(90deg); }
  .sec > summary:hover { color: var(--text-1); }
  .sec-n { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px;
    background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .sec-body { padding: 0 2px 10px; }

  .empty { color: var(--text-3); padding: 24px 8px; text-align: center; }
  /* P4 空状态：不是"占位文案"，是**起点**。
     所以标题要突出（这是第一步），正文要有信息量（解释这是什么），
     按钮要唯一（不要给用户一堆选择）。 */
  .empty-lead { color: var(--text-1); font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .empty-body { max-width: 420px; margin: 0 auto 14px; line-height: 1.6; font-size: 12px; }
  .empty button.primary {
    background: var(--acc); color: var(--on-acc); border: 0; border-radius: 8px;
    padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .empty button.primary:hover { background: var(--acc-hover); }
  .soft-hint { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--att-warn-bg); color: var(--att-warn-fg); font-size: 11px; }

  /* ==================================================================
     排版层级（P4 UI 打磨）
     ------------------------------------------------------------------
     第一性原理（来自 Linear 设计系统）：
       「Hierarchy is enforced through scale and weight, never color.」

     之前的问题：标题/正文/元信息全靠 --text-1/2/3/4 四级颜色区分，
     字号只差 0.5-1px。结果看起来"全是白字"，单调。

     改法：
       · 标签（h2）= 11px / 650 / UPPERCASE / tracking .07em —— 形状上有识别度
       · 内容        = 13px / 450 / --text-1
       · 元信息      = 11px / 400 / --text-3
       · 数字用 tabular-nums，等宽对齐不跳动
     ================================================================== */
  h2 {
    font-size: 11px; font-weight: 650; margin: 20px 0 9px;
    color: var(--text-3); letter-spacing: .07em; text-transform: uppercase;
  }
  h3 { font-size: 12px; font-weight: 600; margin: 14px 0 6px; color: var(--text-2); }
  /* 数字等宽：计数变化时不左右跳 */
  .num, .att-count, .sec-n { font-variant-numeric: tabular-nums; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 3px 0; overflow-wrap: anywhere; }

  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; }
  .kv dt { color: var(--text-3); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }

  pre#briefText { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg-panel); border: 1px solid var(--border-1); border-radius: 9px; padding: 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; margin: 0; }
  .deliv { border: 1px solid var(--border-1); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; font-size: 12px; }
  .deliv .status { font-size: 10px; padding: 1px 7px; border-radius: 999px; }
  .st-unchanged { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .st-modified { background: var(--att-warn-bg); color: var(--att-warn-fg); }
  .st-missing { background: var(--att-bad-bg); color: var(--att-bad-fg); }
  .st-invalid, .st-unreadable { background: var(--att-idle-bg); color: var(--att-idle-fg); }

  dialog { border: 1px solid var(--border-2); border-radius: 11px; background: var(--bg-panel); color: var(--text-1); padding: 16px; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--text-2); }
  dialog input, dialog textarea { width: 100%; background: var(--bg-input); color: var(--text-1); border: 1px solid var(--border-1); border-radius: 7px; padding: 7px 9px; font: inherit; }
  dialog textarea { min-height: 64px; resize: vertical; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .err { color: var(--att-bad-fg); font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>Mission Desk</h1>
  <span id="counts" class="muted tiny"></span>
  <button id="btnNew" class="primary">新建 Mission</button>
</header>

<main>
  <!-- dock 模式的选择器：右栏没有空间放列表，用一个下拉替代。
       必须放在 #list **外面** —— renderList() 会 `$('list').textContent = ''`
       清空整个列表容器，放在里面会被一起清掉（真机验收抓到的）。 -->
  <div id="dockPicker">
    <div class="dock-head">
      <span class="dock-title">Mission Desk</span>
    </div>
    <select id="dockSelect" aria-label="选择 Mission"></select>
  </div>
  <aside id="list"></aside>
  <section id="detail" class="empty">选择一个 Mission 查看详情</section>
</main>

<dialog id="dlg">
  <form id="newForm" method="dialog">
    <strong>新建 Mission</strong>
    <label for="fTitle">标题</label>
    <input id="fTitle" required maxlength="200" placeholder="例如：把产品转成 Agent-first 工作空间" />
    <label for="fIntent">目标（你的原话，不会被模型改写）</label>
    <textarea id="fIntent" required placeholder="一句话说明这个项目要达成什么"></textarea>
    <label for="fConstraint">边界（可留空；用户确认过的不许越界）</label>
    <input id="fConstraint" maxlength="300" placeholder="例如：不许改 office 业务代码" />
    <div class="err" id="dlgErr"></div>
    <div class="dlg-actions">
      <button type="button" id="btnCancel">取消</button>
      <button type="submit" class="primary" id="btnCreate">创建</button>
    </div>
  </form>
</dialog>

<script>
// dock 模式：右栏（380px）用单列布局。同一个文件两种布局，
// 避免维护两份 UI（那必然漂移）。
const DOCK_MODE = new URLSearchParams(location.search).get('dock') === '1';
if (DOCK_MODE) document.body.classList.add('dock');

'use strict';

// 这个页面只做三件事：调 IPC、渲染、把"不确定"如实呈现。
// 所有业务语义都在主进程（src/ipc-mission.js → src/mission/**）。

const api = (action, payload) => window.dshShell.mission(action, payload);

// P4：错误提示的分级（S2）。
//
// 第一性原理：不是所有错误都该"人话化"，但**都不该只给 code**。
//
//   · 用户能处理的（参数填错、文件不存在）→ 给可执行建议
//   · 用户不能处理的（内部状态、窗口没接上）→ 一句人话 + **保留 code**
//
// 关键是**不能丢掉 code**——那是排查的唯一线索。所以格式是
// 「人话（代码 XXX）」，而不是二选一。
const ERROR_HINTS = {
  MISSION_ID_REQUIRED: '没有选中 Mission',
  WORKSTREAM_ID_REQUIRED: '先创建一个工作流',
  MISSION_PATCH_EMPTY: '没有改动',
  DELIVERABLE_INVALID: '产物路径不对（文件不存在，或不在工作区里）',
  DECISION_INVALID: '决策内容不完整（决定和理由都要填）',
  QUESTION_INVALID: '问题内容不完整',
  STATUS_INVALID: '状态值不对',
  TASK_REF_STATUS_FORBIDDEN: '任务状态由 Harness 拥有，Mission 不保存它',
  DESK_UNAVAILABLE: 'Mission Desk 窗口还没接上',
  DESK_OPEN_FAILED: '打开窗口失败',
  MISSION_APPEND_FAILED: '写入失败（磁盘可能满了或没有权限）',
  UNKNOWN_ACTION: '这个操作还没有实现',
};

/** 把一次失败翻译成「人话（代码）」。永远保留 code。 */
function explainFailure(r) {
  const code = (r && (r.code || (r.reason && /^[A-Z_]{3,}$/.test(r.reason) ? r.reason : null))) || null;
  const hint = code && ERROR_HINTS[code];
  if (hint) return `${hint}（${code}）`;
  // 没有映射时：如果 reason 本身像一句话就直接用，否则回退到通用文案
  const reason = r && r.reason;
  if (typeof reason === 'string' && reason.length > 0 && !/^[A-Z_]{3,}$/.test(reason)) {
    return code ? `${reason}（${code}）` : reason;
  }
  return code ? `操作失败（${code}）` : '操作失败，请重试';
}

const state = {
  missions: [],
  selectedId: null,
  detail: null,
  brief: null,
  verified: null,
  syncState: null,
  attention: null,
  since: null,
  liveAvailable: false,
};

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

/** 把 observedAtMs 渲染成"x 秒前"，而不是一个绝对时间戳。
 *  理由：用户关心的是"这个信息有多新"，不是"哪一刻"。

 *  注意：**没有时间戳就返回 null**，调用方必须显示"不可用"，
 *  绝不能退化成"未运行"。 */
function relativeTime(observedAtMs) {
  if (!Number.isFinite(observedAtMs)) return null;
  const deltaSec = Math.max(0, Math.round((Date.now() - observedAtMs) / 1000));
  if (deltaSec < 5) return '刚刚';
  if (deltaSec < 60) return deltaSec + ' 秒前';
  const m = Math.floor(deltaSec / 60);
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  return h + ' 小时前';
}

// ------------------------------------------------------------------ 渲染

// dock 模式：下拉切换 Mission。复用与列表点击同一条路径。
function bindDockPicker() {
  const select = $('dockSelect');
  if (!select) return;
  select.addEventListener('change', async () => {
    const id = select.value;
    if (!id || id === state.selectedId) return;
    state.selectedId = id;
    renderList();
    await loadDetail(id);
  });
}

function renderList() {
  const box = $('list');
  box.textContent = '';
  const active = state.missions.filter((m) => m.status === 'active');

  // dock 模式：用下拉替代列表
  const select = $('dockSelect');
  if (select) {
    select.textContent = '';
    if (state.missions.length === 0) {
      select.append(el('option', { value: '', text: '（还没有 Mission）' }));
    } else {
      for (const m of state.missions) {
        const opt = el('option', { value: m.missionId, text: m.title || m.missionId });
        if (state.selectedId === m.missionId) opt.selected = true;
        select.append(opt);
      }
    }
  }

  if (state.missions.length === 0) {
    // 空状态不是"占位文案"。新用户看到的第一屏应该是**明确的第一步**，
    // 而不是一句被动的"还没有"。
    //
    // 设计原则（P4 §5）：
    //   ❌ 显示"暂无数据" → 用户不知道该做什么
    //   ✅ 告诉用户下一步做什么，且**只提示最关键的那一个动作**
    box.append(el('div', { class: 'empty-lead', text: '从这里开始' }));
    box.append(el('div', { class: 'empty-body',
      text: '一个 Mission 就是一件你想让 AI 团队做成的事。给它一个标题和目标，之后所有会话、决策、产物都挂在它下面 —— 关掉再打开也不会丢。' }));
    const cta = el('button', { class: 'primary', text: '创建第一个 Mission' });
    cta.addEventListener('click', () => {
      // 复用已有的新建流程，不重复实现
      const openBtn = [...document.querySelectorAll('button')]
        .find((b) => b.textContent && b.textContent.includes('新建 Mission'));
      if (openBtn) openBtn.click();
    });
    box.append(cta);
    $('counts').textContent = '';
    return;
  }

  // 软上限提示：**只提示，不阻止**（domain-model §2.1.1）
  $('counts').textContent =
    '进行中 ' + active.length + ' / 共 ' + state.missions.length;

  for (const m of state.missions) {
    const row = el('div', { class: 'row' });
    row.append(el('span', { class: 'badge ' + m.status, text: m.status }));

    // Running 是 Harness 的事实，必须与 status 分开显示且带时间
    const live = m.live || {};
    if (live.available) {
      const t = relativeTime(live.observedAtMs);
      const dot = el('span', { class: 'dot' + (live.hasRunningAgent ? ' on' : '') });
      row.append(el('span', { class: 'live' }, [dot, document.createTextNode(
        live.hasRunningAgent ? 'Agent 在跑 · ' + t : '无 Agent · ' + t)]));
    } else {
      // 关键：不可用时明说，不显示灰点假装"未运行"
      const dot = el('span', { class: 'dot unknown' });
      row.append(el('span', { class: 'live' }, [dot, document.createTextNode('实时状态不可用')]));
    }
    if (live.awaitingUser) {
      row.append(el('span', { class: 'badge', text: '等你决定' }));
    }

    const card = el('div', {
      class: 'card' + (m.missionId === state.selectedId ? ' sel' : ''),
      role: 'button',
      tabindex: '0',
    }, [el('div', { class: 'title', text: m.title }), row]);

    card.addEventListener('click', () => selectMission(m.missionId));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectMission(m.missionId); }
    });
    box.append(card);
  }

  if (active.length > 10) {
    // 软提示（不是硬限制）：建议整理，但绝不阻止
    box.append(el('div', {
      class: 'soft-hint',
      text: '你有 ' + active.length + ' 个进行中的 Mission。考虑归档一些？这只是提醒，不影响创建。',
    }));
  }
}

// ---------------------------------------------------------------- 待办区（L1）
//
// 第一性原理：待办不是"多一个区块"，是**排序机制**。
//
//   做成普通区块 = 又多了一个要用户自己找的地方。
//   正确做法：有 todo 时它占最顶部并压缩其他区块的视觉重量；
//   没有 todo 时那一行变成"团队运行正常"——**这句本身就是有价值的信号**。
//
//   两个硬约束：
//     · 零待办时也要占位（否则用户不确定"是真的没有还是加载失败"）
//     · 每张卡必须能直接处理（只显示不能点 = 用户还得去别处找）

const RISK_LABEL = { high: '高', medium: '中', low: '低' };
const FINDING_LABEL = { unverified: '待验证', verified: '已验证', refuted: '已推翻' };
const ASSUMPTION_LABEL = { unverified: '未验证', holding: '仍成立', violated: '已推翻', expired: '已过期' };
const CONF_LABEL = { low: '低', medium: '中', high: '高' };
const EVIDENCE_LABEL = { file: '文件', commit: '提交', url: '链接', command: '命令', observation: '观察' };
const KIND_LABEL = { approval: '审批', question: '提问' };

function renderAttention() {
  const a = state.attention;
  const wrap = el('div', { class: 'att' });
  if (!a) return wrap;

  if (!a.available) {
    wrap.className = 'att att-clear';
    wrap.append(el('div', { class: 'att-head' }, [
      el('span', { text: '○ 待办状态未知' }),
    ]));
    wrap.append(el('div', { class: 'att-clear-msg',
      text: '运行时还没连上，所以现在无法确认有没有需要你处理的事。这不是"没有待办"。' }));
    return wrap;
  }

  const total = a.total || 0;

  // 一致性守卫：attention 说"没有待办"，但 live 说"有 1 个待审批"——
  // 这时**不能**显示"团队运行正常"，那是在撒谎。
  // 真机截图抓到过这种矛盾（测试 fixture 造出来的，但也可能真的发生：
  // 两条数据路径一条读 pendingItems 一条读计数）。
  const live = (state.detail && state.detail.live) || {};
  const livePending = (Number(live.pendingApprovals) || 0) + (Number(live.pendingQuestions) || 0);
  if (total === 0 && livePending > 0) {
    wrap.className = 'att att-clear';
    wrap.append(el('div', { class: 'att-head' }, [
      el('span', { text: '○ 待办数据不一致' }),
    ]));
    wrap.append(el('div', { class: 'att-clear-msg',
      text: '运行时报告有 ' + livePending + ' 件事等你处理，但明细还没拿到。'
        + '这不是"没有待办"——请到办公室里查看收件箱。' }));
    return wrap;
  }

  if (total === 0) {
    // 零待办也要占位——这是"你可以放心离开"的信号
    wrap.className = 'att att-clear';
    wrap.append(el('div', { class: 'att-head' }, [
      el('span', { text: '✓ 团队运行正常' }),
    ]));
    wrap.append(el('div', { class: 'att-clear-msg',
      text: '没有需要你处理的事。有新情况时会出现在这里。' }));
    return wrap;
  }

  wrap.className = 'att att-present';
  wrap.append(el('div', { class: 'att-head' }, [
    el('span', { text: '⚠ 需要你处理' }),
    el('span', { class: 'att-count', text: String(total) }),
  ]));

  for (const item of a.items || []) {
    const risk = item.risk || 'medium';
    const kind = item.kind || 'question';
    const row = el('div', { class: 'att-item', 'data-risk': risk, 'data-kind': kind });

    const line = el('div', { class: 'att-item-line' });
    line.append(el('span', { class: 'att-item-kind', text: KIND_LABEL[kind] || kind }));
    line.append(el('span', { class: 'att-item-text', text: item.summary || '（没有摘要）' }));
    row.append(line);

    const meta = [];
    if (item.toolName) meta.push(item.toolName);
    meta.push('风险 ' + (RISK_LABEL[risk] || risk));
    if (Number.isFinite(item.createdAtMs)) meta.push(relativeTime(item.createdAtMs));
    row.append(el('div', { class: 'att-item-meta', text: meta.join(' · ') }));

    // 操作：审批有两个选择，提问要输入答案
    const actions = el('div', { class: 'att-item-actions' });
    if (kind === 'approval') {
      const deny = el('button', { class: 'att-btn danger', text: '拒绝' });
      deny.addEventListener('click', () => answerPending(item, 'denied'));
      const allow = el('button', { class: 'att-btn primary', text: '允许' });
      allow.addEventListener('click', () => answerPending(item, 'granted'));
      actions.append(deny, allow);
    } else {
      const input = el('input', { placeholder: '输入回答…', style: 'flex:1;min-width:0' });
      const send = el('button', { class: 'att-btn primary', text: '回答' });
      send.addEventListener('click', () => {
        const v = input.value.trim();
        if (v) answerPending(item, v);
      });
      actions.append(input, send);
    }
    row.append(actions);
    wrap.append(row);
  }
  return wrap;
}

/**
 * 把用户的选择送回 Harness。失败必须显示原因，不能假装成功。
 *
 * 真实 payload 形状（office-module.js 的 validateOfficeIpcPayload 严格校验键序）：
 *   { action: 'answer', id, value }
 * 我之前猜的 { pendingId, kind, answer } 会被判 PAYLOAD_INVALID。
 */
async function answerPending(item, answer) {
  const r = await window.dshShell.answerPending({ action: 'answer', id: item.id, value: answer });
  if (!r || !r.ok) {
    alert(explainFailure(r || { code: 'UNKNOWN' }));
    return;
  }
  await refresh();
}

// -------------------------------------------------- 离开期间（L2 时间线）
//
// 关键约束：**只从真实事件派生，不调用模型生成摘要。**
// 用户要的是"发生了什么"，不是"模型猜测发生了什么"。

const SINCE_TAG = {
  decision: '决策', question: '提问', answer: '回答',
  workstream: '工作流', 'workstream-status': '工作流', deliverable: '产物', mission: 'Mission',
};

function renderSince() {
  const si = state.since;
  if (!si) return null;

  if (!si.available) {
    // 第一次看这个 Mission → 没有"离开期间"。这是正常状态，不是错误。
    if (si.reason === 'never-seen') return null;
    return null;
  }
  if (!si.entries || si.entries.length === 0) return null;

  const box = el('div', { class: 'tl' });
  const head = el('div', { class: 'tl-head' }, [
    el('span', { text: '你离开期间' }),
  ]);
  if (Number.isFinite(si.sinceMs)) {
    // relativeTime 返回 "3 小时前"，而这里要说"上次看到是 3 小时前"。
    // 直接拼 "之后" 会变成"3 小时前 之后"，语义别扭。
    head.append(el('span', { class: 'tl-when', text: '上次查看：' + relativeTime(si.sinceMs) }));
  }
  box.append(head);

  const ul = el('ul', { class: 'tl-list' });
  for (const e of si.entries) {
    const li = el('li', { 'data-tone': e.tone || 'info' });
    li.append(el('span', { class: 'tl-tag', text: SINCE_TAG[e.kind] || e.kind }));
    li.append(document.createTextNode(e.text || ''));
    ul.append(li);
  }
  box.append(ul);
  if (si.truncated) {
    box.append(el('div', { class: 'tl-more', text: `另有 ${si.dropped} 条更早的变化未显示` }));
  }
  return box;
}

function renderDetail() {
  const box = $('detail');
  box.textContent = '';
  box.className = '';
  if (!state.detail) {
    box.className = 'empty';
    // 下面这句原来只说"选择一个 Mission"——但列表里可能**一个都没有**。
    // 分两种情况给不同的路标，否则用户会卡在一个无解的指令上。
    if (state.missions.length === 0) {
      box.append(el('div', { class: 'empty-lead', text: '还没有选中任何 Mission' }));
      box.append(el('div', { class: 'empty-body',
        text: '先在左边创建你的第一个 Mission，或者从列表里点一个已有的。' }));
    } else {
      box.append(el('div', { class: 'empty-lead', text: '选择一个 Mission' }));
      box.append(el('div', { class: 'empty-body',
        text: '从左侧列表点一个，就能看到它的目标、决策、工作流和产物。' }));
    }
    return;
  }
  const v = state.detail;
  const m = v.mission;

  // --- L1：需要你处理（最高优先级，永远置顶）---
  box.append(renderAttention());

  // --- L2：你离开期间发生了什么 ---
  const sinceBlock = renderSince();
  if (sinceBlock) box.append(sinceBlock);

  // --- 头部 ---
  const head = el('div', { class: 'row' });
  head.append(el('span', { class: 'badge ' + m.status, text: m.status }));
  const sel = el('select', {});
  for (const s of ['active', 'paused', 'completed', 'abandoned']) {
    const o = el('option', { value: s, text: s });
    if (s === m.status) o.selected = true;
    sel.append(o);
  }
  sel.addEventListener('change', async () => {
    const r = await api('updateStatus', { missionId: m.missionId, to: sel.value });
    if (!r.ok) { alert(r.reason); return; }
    await refresh();
  });
  box.append(el('h3', { text: 'Mission 状态（我们拥有）' }), sel);

  // --- 实时（Harness 的事实）---
  const live = v.live || {};
  const liveBlock = el('div', {});
  if (live.available) {
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '观察到 ' + relativeTime(live.observedAtMs) + '（' + new Date(live.observedAtMs).toLocaleTimeString() + '）',
    }));
    liveBlock.append(el('div', {
      class: 'tiny',
      text: 'Agent 在跑：' + (live.hasRunningAgent ? '是' : '否')
        + ' · 待审批 ' + live.pendingApprovals
        + ' · 待回答 ' + live.pendingQuestions,
    }));
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '这项状态由 Harness 提供，DshCockpit 只读不写（所以不会在重启后撒谎）。',
    }));
  } else {
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '实时状态不可用——没有 Harness 快照。这不代表"没有在跑"，只代表我们现在读不到。',
    }));
  }
  box.append(el('h3', { text: '实时状态（Harness 拥有，只读）' }), liveBlock);

  // --- 目标 ---
  //
  // 第一性原理：Desk 是编辑器，不是只读报表。
  // 标题/目标写错了却改不了，用户唯一的办法是删掉重建——
  // 而 Mission 的事实链是不可删的。所以"能改"不是锦上添花，是**纠错能力**。
  //
  // 边界：这里**不提供**改 status 的入口。状态变更是独立事实，
  // 必须走 updateStatus（顶部选择器），不能混进 update 的 patch。
  box.append(el('h2', { text: '目标' }));
  {
    const wrap = el('div', { class: 'row', style: 'gap:6px;align-items:flex-start' });
    const view = el('div', { text: m.intent || '（未填写）', style: 'flex:1' });
    const editBtn = el('button', { text: '改', class: 'tiny' });
    const editor = el('div', { style: 'flex-basis:100%;display:none;gap:6px;flex-wrap:wrap' });
    const titleInput = el('input', { placeholder: 'Mission 标题', style: 'flex:1;min-width:160px', value: m.title || '' });
    const intentInput = el('input', { placeholder: '目标（你的原话）', style: 'flex:2;min-width:200px', value: m.intent || '' });
    const saveBtn = el('button', { text: '保存' });
    const cancelBtn = el('button', { text: '取消' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });

    editBtn.addEventListener('click', () => {
      editor.style.display = 'flex';
      editBtn.style.display = 'none';
    });
    cancelBtn.addEventListener('click', () => {
      editor.style.display = 'none';
      editBtn.style.display = '';
      msg.textContent = '';
    });
    saveBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const patch = { missionId: m.missionId };
      if (titleInput.value.trim() && titleInput.value.trim() !== (m.title || '')) patch.title = titleInput.value.trim();
      if (intentInput.value.trim() !== (m.intent || '')) patch.intent = intentInput.value.trim();
      if (Object.keys(patch).length === 1) { msg.textContent = '没有改动'; return; }
      saveBtn.disabled = true;
      let r;
      try { r = await api('update', patch); }
      catch (e) { r = { ok: false, reason: e.message }; }
      saveBtn.disabled = false;
      if (r && r.ok) { editor.style.display = 'none'; editBtn.style.display = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });

    editor.append(titleInput, intentInput, saveBtn, cancelBtn, msg);
    wrap.append(view, editBtn, editor);
    box.append(wrap);
  }

  // --- 边界 ---
  box.append(el('h2', { text: '边界' }));
  if (!m.constraints || m.constraints.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '未声明边界。' }));
  } else {
    const ul = el('ul', {});
    for (const c of m.constraints) {
      ul.append(el('li', { text: c.text + (c.source === 'model' ? '（模型建议）' : '') }));
    }
    box.append(ul);
  }

  // --- 决策 ---
  //
  // 第一性原理：没有写入的 Desk 不叫 Desk，叫报表。
  // 报表不能支撑"跨会话不丢" —— 而 V2「不丢决策」正是本产品的核心主张。
  //
  // 设计要点（与 answerQuestion 的就地输入同一个模式，不新增弹窗）：
  //   · 「决定」+「为什么」两个输入，理由必填（schema 强制）
  //   · 默认走 proposed（提议），不是 accepted —— 见治理漏洞修复 S1
  //   · 失败时显示具体原因，不只 {ok:false}
  box.append(el('h2', { text: '决策（含理由）' }));
  if (!v.decisions || v.decisions.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '还没有记录决策。' }));
  } else {
    const ul = el('ul', {});
    for (const d of v.decisions) {
      const li = el('li', {});
      li.append(el('div', { text: d.text + (d.status === 'superseded' ? '（已被 ' + (d.supersededBy || '?') + ' 取代）' : '') }));
      // 状态可见：proposed 与 accepted 必须让用户分得清，
      // 否则"模型提议"会被误读成"已经拍板"。
      const badge = el('span', {
        class: 'tiny',
        style: d.status === 'accepted'
          ? 'margin-left:6px;color:var(--att-ok-fg)'
          : 'margin-left:6px;color:var(--att-warn-fg)',
        text: d.status === 'accepted' ? '已接受' : (d.status === 'proposed' ? '提议中' : d.status),
      });
      li.firstChild.append(badge);
      li.append(el('div', { class: 'muted tiny', text: '为什么：' + d.rationale }));
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 记录一条决策（就地表单）
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const txt = el('input', { placeholder: '决定了什么…', style: 'flex:1;min-width:140px' });
    const why = el('input', { placeholder: '为什么（必填）…', style: 'flex:1;min-width:140px' });
    const btn = el('button', { text: '记录决策' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!txt.value.trim()) { msg.textContent = '请填写决定内容'; return; }
      if (!why.value.trim()) { msg.textContent = '请填写理由 —— 没有理由的决策正是压缩会毁掉的东西'; return; }
      btn.disabled = true;
      let r;
      try {
        r = await api('recordDecision', {
          missionId: m.missionId,
          text: txt.value.trim(),
          rationale: why.value.trim(),
          // 用户在 UI 里点"记录决策"= 用户自己拍的板
          status: 'accepted',
          decidedBy: 'user',
        });
      } catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { txt.value = ''; why.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(txt, why, btn, msg);
    box.append(wrap);
  }

  // ================================================================
  // Shared Context：发现 / 假设 / 证据（2026-11-01）
  //
  // 为什么这三块比"决策"更重要：
  //   决策只记"决定了什么"，记不住"为什么这么决定"。
  //     · Finding    = 我们发现的事实  → 团队积累的实体
  //     · Assumption = 暂时采用的判断  → 未来会爆的地雷
  //     · Evidence   = 凭什么相信      → 可信度的来源
  // ================================================================

  // --- 发现 ---
  const findings = v.findings || [];
  box.append(el('h2', { text: '发现' }));
  if (findings.length === 0) {
    box.append(el('div', { class: 'muted tiny',
      text: '还没有记录发现。发现是"我们确认了 X 成立"，与决策（我们选择了 A）不同。' }));
  } else {
    const ul = el('ul', { class: 'sc-list' });
    for (const f of findings) {
      const li = el('li', { class: 'sc-item' });
      const line = el('div', { class: 'sc-line' });
      line.append(el('span', { class: 'sc-badge st-finding-' + f.status,
        text: FINDING_LABEL[f.status] || f.status }));
      line.append(el('span', { class: 'sc-text', text: f.text }));
      li.append(line);
      const meta = [];
      meta.push('置信 ' + CONF_LABEL[f.confidence] || f.confidence);
      if (Number.isFinite(f.foundAtMs)) meta.push(relativeTime(f.foundAtMs));
      if ((f.evidenceIds || []).length) meta.push(f.evidenceIds.length + ' 条证据');
      li.append(el('div', { class: 'sc-meta', text: meta.join(' · ') }));
      // 状态推进入口：发现必须能被"确认"或"推翻"，否则它永远停在待验证
      if (f.status !== 'refuted') {
        const acts = el('div', { class: 'row', style: 'margin-top:5px;gap:6px' });
        if (f.status !== 'verified') {
          const okBtn = el('button', { class: 'att-btn', text: '已验证' });
          okBtn.addEventListener('click', async () => {
            const r = await api('updateFindingStatus', { findingId: f.findingId, to: 'verified' });
            if (!r.ok) { alert(explainFailure(r)); return; }
            await refresh();
          });
          acts.append(okBtn);
        }
        const noBtn = el('button', { class: 'att-btn danger', text: '推翻' });
        noBtn.addEventListener('click', async () => {
          // refuted 必须给理由——它是语义反转，没有理由就无法追溯
          const why = prompt('为什么推翻这个发现？（必填）');
          if (!why || !why.trim()) return;
          const r = await api('updateFindingStatus', { findingId: f.findingId, to: 'refuted', reason: why.trim() });
          if (!r.ok) { alert(explainFailure(r)); return; }
          await refresh();
        });
        acts.append(noBtn);
        li.append(acts);
      }
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 记录一条发现（就地表单）。
    // 第一性原理：只有展示没有入口 = 这块内容永远只能来自别处。
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const txt = el('input', { placeholder: '发现了什么事实…', style: 'flex:1;min-width:160px' });
    const conf = el('select', {});
    for (const [val, label] of [['high', '高置信'], ['medium', '中置信'], ['low', '低置信']]) {
      conf.append(el('option', { value: val, text: label }));
    }
    conf.value = 'medium';
    const btn = el('button', { text: '记录发现' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!txt.value.trim()) { msg.textContent = '请填写发现内容'; return; }
      btn.disabled = true;
      let r;
      try {
        r = await api('recordFinding', {
          missionId: m.missionId,
          text: txt.value.trim(),
          confidence: conf.value,
          // 用户在 UI 里录入 = 用户自己的发现
          foundBy: 'user',
        });
      } catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { txt.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(txt, conf, btn, msg);
    box.append(wrap);
  }

  // --- 假设 ---
  const assumptions = v.assumptions || [];
  box.append(el('h2', { text: '假设' }));
  if (assumptions.length === 0) {
    box.append(el('div', { class: 'muted tiny',
      text: '还没有记录假设。假设是"我们暂时这么认为，但还没验证"——它是最容易在三天后爆炸的东西。' }));
  } else {
    const ul = el('ul', { class: 'sc-list' });
    const now = Date.now();
    for (const a of assumptions) {
      const li = el('li', { class: 'sc-item' });
      const line = el('div', { class: 'sc-line' });
      line.append(el('span', { class: 'sc-badge st-assumption-' + a.status,
        text: ASSUMPTION_LABEL[a.status] || a.status }));
      line.append(el('span', { class: 'sc-text', text: a.text }));
      li.append(line);
      const meta = [];
      if (a.verifyBy) meta.push('验证方式：' + a.verifyBy);
      if (Number.isFinite(a.expiresAtMs)) {
        const left = a.expiresAtMs - now;
        // 过期是**显式**状态；这里只提示"快过期"，不自己改状态
        meta.push(left < 0 ? '已过期' : `还有 ${Math.ceil(left / 3600e3)}h 过期`);
      }
      if (a.violatedReason) meta.push('被推翻：' + a.violatedReason);
      if (meta.length) li.append(el('div', { class: 'sc-meta', text: meta.join(' · ') }));
      // 假设必须能被确认或推翻。它是最容易在三天后爆炸的东西，
      // 没有这两个按钮，用户只能看着它过期。
      if (a.status !== 'violated' && a.status !== 'expired') {
        const acts = el('div', { class: 'row', style: 'margin-top:5px;gap:6px' });
        if (a.status !== 'holding') {
          const okBtn = el('button', { class: 'att-btn', text: '仍成立' });
          okBtn.addEventListener('click', async () => {
            const r = await api('updateAssumptionStatus', { assumptionId: a.assumptionId, to: 'holding' });
            if (!r.ok) { alert(explainFailure(r)); return; }
            await refresh();
          });
          acts.append(okBtn);
        }
        const noBtn = el('button', { class: 'att-btn danger', text: '已推翻' });
        noBtn.addEventListener('click', async () => {
          const why = prompt('为什么它不再成立？（必填）');
          if (!why || !why.trim()) return;
          const r = await api('updateAssumptionStatus', { assumptionId: a.assumptionId, to: 'violated', reason: why.trim() });
          if (!r.ok) { alert(explainFailure(r)); return; }
          await refresh();
        });
        acts.append(noBtn);
        li.append(acts);
      }
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 记录一个假设（就地表单）。
    // verifyBy 是这个表单最重要的字段：假设之所以危险，是因为没人记得怎么验证它。
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const txt = el('input', { placeholder: '我们暂时假设…', style: 'flex:1;min-width:160px' });
    const verify = el('input', { placeholder: '怎么验证它仍成立（可留空）…', style: 'flex:1;min-width:160px' });
    const btn = el('button', { text: '记录假设' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!txt.value.trim()) { msg.textContent = '请填写假设内容'; return; }
      btn.disabled = true;
      let r;
      try {
        r = await api('recordAssumption', {
          missionId: m.missionId,
          text: txt.value.trim(),
          verifyBy: verify.value.trim() || null,
          assumedBy: 'user',
        });
      } catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { txt.value = ''; verify.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(txt, verify, btn, msg);
    box.append(wrap);
  }

  // --- 证据 ---
  const evidences = v.evidences || [];
  box.append(el('h2', { text: '证据' }));
  if (evidences.length === 0) {
    box.append(el('div', { class: 'muted tiny',
      text: '还没有证据。证据是"凭什么相信这个结论"——只存引用，不存内容。' }));
  } else {
    const ul = el('ul', { class: 'sc-list' });
    for (const e of evidences) {
      const li = el('li', { class: 'sc-item' });
      const line = el('div', { class: 'sc-line' });
      line.append(el('span', { class: 'sc-badge sc-badge-kind', text: EVIDENCE_LABEL[e.kind] || e.kind }));
      line.append(el('span', { class: 'sc-text sc-mono', text: e.ref }));
      li.append(line);
      li.append(el('div', { class: 'sc-meta', text: '支持：' + e.claim }));
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 记录一条证据（就地表单）。
    // ref 是引用不是内容：commit / 相对路径 / URL / 命令。
    // claim 必填——没有 claim 的证据只是一个链接。
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const kind = el('select', {});
    for (const [val, label] of [['commit', '提交'], ['file', '文件'], ['url', '链接'], ['command', '命令'], ['observation', '观察']]) {
      kind.append(el('option', { value: val, text: label }));
    }
    const ref = el('input', { placeholder: '引用（相对路径/commit/URL）…', style: 'flex:1;min-width:160px' });
    const claim = el('input', { placeholder: '它支持什么结论（必填）…', style: 'flex:1;min-width:160px' });
    const btn = el('button', { text: '记录证据' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!ref.value.trim()) { msg.textContent = '请填写引用'; return; }
      if (!claim.value.trim()) { msg.textContent = '请填写它支持什么 —— 没有 claim 的证据只是链接'; return; }
      btn.disabled = true;
      let r;
      try {
        r = await api('recordEvidence', {
          missionId: m.missionId,
          kind: kind.value,
          ref: ref.value.trim(),
          claim: claim.value.trim(),
          recordedBy: 'user',
        });
      } catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { ref.value = ''; claim.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(kind, ref, claim, btn, msg);
    box.append(wrap);
  }

  // --- 未决问题 ---
  const openQ = (v.questions || []).filter((q) => q.status === 'open');
  box.append(el('h2', { text: '未决问题' }));
  if (openQ.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '没有未决问题。' }));
  } else {
    const ul = el('ul', {});
    for (const q of openQ) {
      const li = el('li', {});
      li.append(el('div', { text: q.text }));
      const wrap = el('div', { class: 'row', style: 'margin-top:4px' });
      const input = el('input', { placeholder: '回答…', style: 'flex:1;min-width:120px' });
      const btn = el('button', { text: '回答' });
      btn.addEventListener('click', async () => {
        const r = await api('answerQuestion', { questionId: q.questionId, answer: input.value, missionId: m.missionId });
        if (!r.ok) { alert(r.reason); return; }
        await refresh();
      });
      wrap.append(input, btn);
      li.append(wrap);
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 提问。第一性原理：没有它，用户**不能把自己脑子里的疑问记进 Mission**。
    //
    // 「未决问题」这一节的存在意义就是"把悬而未决的事留下来"。只能答不能问，
    // 等于这一节的内容全部来自外部（模型/他人），用户自己无法往里放东西。
    //
    // 它与 recordDecision 是配对的：
    //   决策 = 已经想清楚的；未决问题 = 还没想清楚的。
    // 两者都是 Shared Context 的入口，只做一半等于只记结论不记悬念。
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const qInput = el('input', { placeholder: '有什么还没想清楚的…', style: 'flex:1;min-width:180px' });
    const askBtn = el('button', { text: '记下这个问题' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    askBtn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!qInput.value.trim()) { msg.textContent = '请填写问题内容'; return; }
      askBtn.disabled = true;
      let r;
      try { r = await api('openQuestion', { missionId: m.missionId, text: qInput.value.trim() }); }
      catch (e) { r = { ok: false, reason: e.message }; }
      askBtn.disabled = false;
      if (r && r.ok) { qInput.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(qInput, askBtn, msg);
    box.append(wrap);
  }

  // --- Workstreams ---
  box.append(el('h2', { text: '工作流' }));
  if (!v.workstreams || v.workstreams.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '还没有工作流。' }));
  } else {
    const ul = el('ul', {});
    for (const w of v.workstreams) {
      const li = el('li', {});
      const row = el('div', { class: 'row', style: 'gap:6px;align-items:center' });
      row.append(el('span', { text: '[' + w.status + '] ' + w.title, style: 'flex:1' }));
      // 状态切换：阻塞是一个高频动作，必须能就地标记，
      // 而不是"再开一个编辑弹窗"。
      for (const next of ['active', 'blocked', 'done'].filter((x) => x !== w.status)) {
        const b = el('button', {
          text: next === 'active' ? '进行中' : (next === 'blocked' ? '阻塞' : '完成'),
          class: 'tiny',
        });
        b.addEventListener('click', async () => {
          b.disabled = true;
          const r = await api('updateWorkstreamStatus', {
            missionId: m.missionId, workstreamId: w.workstreamId, to: next,
          });
          b.disabled = false;
          if (r && r.ok) await refresh();
          else alert(explainFailure(r));
        });
        row.append(b);
      }
      li.append(row);
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 新建工作流（就地表单）
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const title = el('input', { placeholder: '新工作流名称…', style: 'flex:1;min-width:160px' });
    const btn = el('button', { text: '新建工作流' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!title.value.trim()) { msg.textContent = '请填写名称'; return; }
      btn.disabled = true;
      let r;
      try { r = await api('addWorkstream', { missionId: m.missionId, title: title.value.trim() }); }
      catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { title.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(title, btn, msg);
    box.append(wrap);
  }

  // --- 关联的执行（TaskRef）---
  //
  // 第一性原理：这是 Mission 与 Harness 之间**唯一**的连接点。
  //
  //   没有它，用户在 Desk 里看到 3 个工作流，在 Harness 里看到 5 次会话，
  //   但两者之间没有任何对应关系 —— 只能靠人记。这就是跨会话连续性
  //   最实际的断点。
  //
  // 边界：这里**只显示"哪次执行属于哪个工作流"，不显示任务状态**。
  //   任务状态归 Harness，Mission 存状态就是两个事实作者（铁律 1）。
  box.append(el('h2', { text: '关联的执行' }));
  const refs = v.taskRefs || [];
  if (refs.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '还没有关联任何执行。' }));
  } else {
    const ul = el('ul', {});
    for (const t of refs) {
      const li = el('li', {});
      const ws = (v.workstreams || []).find((w) => w.workstreamId === t.workstreamId);
      li.append(el('div', { text: (t.summary || '（无摘要）') }));
      li.append(el('div', {
        class: 'muted tiny',
        // harnessRef 是派生句柄，不是 sessionId —— 单独标出来，
        // 让读的人知道点这里也反查不到原始会话。
        text: `属于工作流：${ws ? ws.title : t.workstreamId} · 句柄 ${t.harnessRef}`,
      }));
      ul.append(li);
    }
    box.append(ul);
  }
  {
    // 关联一次执行（就地表单）
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const wsSel = el('select', { style: 'flex:1;min-width:120px' });
    for (const w of (v.workstreams || [])) {
      wsSel.append(el('option', { value: w.workstreamId, text: w.title }));
    }
    const summary = el('input', { placeholder: '这次执行做了什么…', style: 'flex:2;min-width:160px' });
    const btn = el('button', { text: '关联执行' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      const workstreamId = wsSel.value;
      if (!workstreamId) { msg.textContent = '请先新建一个工作流'; return; }
      if (!summary.value.trim()) { msg.textContent = '请填写摘要 —— 不然下次看到这个句柄不知道它是什么'; return; }
      btn.disabled = true;
      let r;
      try {
        r = await api('linkTaskRef', {
          missionId: m.missionId,
          workstreamId,
          // 这里本来该由 Harness 提供真实 sessionId；离线/无 runtime 时
          // 用一个明确的占位值，并让用户在摘要里写清楚。
          // 绝不伪造一个"看起来像真的" sessionId —— 那会让人以为能反查。
          sessionId: state.linkSessionId || 'manual-link',
          summary: summary.value.trim(),
        });
      } catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { summary.value = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });
    wrap.append(wsSel, summary, btn, msg);
    box.append(wrap);
  }

  // --- 产物 ---
  box.append(el('h2', { text: '产物' }));
  const ver = state.verified;
  if (!v.deliverables || v.deliverables.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '还没有登记产物。' }));
  } else {
    for (const d of v.deliverables) {
      const res = ver && ver.results ? ver.results.find((x) => x.deliverableId === d.deliverableId) : null;
      const status = res ? res.status : 'unchecked';
      const box2 = el('div', { class: 'deliv' });
      const row = el('div', { class: 'row' });
      row.append(el('span', { text: d.label }));
      row.append(el('span', { class: 'status st-' + status, text: status }));
      box2.append(row);
      box2.append(el('div', { class: 'muted tiny', text: d.relPath + ' · sha256:' + String(d.digest).slice(0, 12) + '…' }));
      if (res && res.status === 'modified') {
        box2.append(el('div', { class: 'tiny', text: '内容已变化（登记时 ' + String(res.expected).slice(0, 8) + '… → 现在 ' + String(res.actual).slice(0, 8) + '…）' }));
      }
      if (res && res.status === 'missing') {
        box2.append(el('div', { class: 'tiny', text: '文件已不存在：' + res.reason }));
      }
      box.append(box2);
    }
    const verifyBtn = el('button', { text: '校验产物是否仍是当时那一版' });
    verifyBtn.addEventListener('click', async () => {
      const r = await api('verifyDeliverables', { missionId: m.missionId });
      if (!r.ok) { alert(r.reason); return; }
      state.verified = r;
      renderDetail();
    });
    box.append(verifyBtn);
  }

  {
    // 登记产物。关键设计：registerDeliverable 会**真的读文件算 sha256**，
    // 所以"登记成功"本身就证明文件存在。用户填一个不存在的路径会被拒绝——
    // 这比"只存一个路径字符串"强得多（V3「产物是真实文件」的机械保证）。
    const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
    const label = el('input', { placeholder: '产物名称…', style: 'flex:1;min-width:120px' });
    const rel = el('input', { placeholder: '相对工作区的路径，如 docs/report.md', style: 'flex:2;min-width:180px' });
    const btn = el('button', { text: '登记产物' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
    btn.addEventListener('click', async () => {
      msg.textContent = '';
      if (!label.value.trim()) { msg.textContent = '请填写产物名称'; return; }
      if (!rel.value.trim()) { msg.textContent = '请填写相对路径'; return; }
      btn.disabled = true;
      let r;
      try {
        r = await api('registerDeliverable', {
          missionId: m.missionId,
          label: label.value.trim(),
          relPath: rel.value.trim(),
        });
      } catch (e) { r = { ok: false, reason: e.message }; }
      btn.disabled = false;
      if (r && r.ok) { label.value = ''; rel.value = ''; await refresh(); }
      else {
        // 失败原因很有信息量：文件不存在 / 是目录 / 路径越界
        msg.textContent = explainFailure(r);
      }
    });
    wrap.append(label, rel, btn, msg);
    box.append(wrap);
  }

  // --- Brief ---
  box.append(el('h2', { text: 'Mission Brief（下次会话 Agent 会读到这个）' }));
  if (!state.brief) {
    box.append(el('div', { class: 'muted tiny', text: '正在生成…' }));
  } else if (state.brief.empty) {
    box.append(el('div', { class: 'muted tiny', text: 'Brief 为空。' }));
  } else {
    box.append(el('div', {
      class: 'tiny muted',
      text: state.brief.bytes + ' 字节'
        + (state.brief.truncated ? ' · 已截断（省略了 ' + JSON.stringify(state.brief.dropped) + '）' : ' · 未截断'),
    }));
    box.append(el('pre', { id: 'briefText', text: state.brief.text }));

    // ---- 同步到 AGENTS.md（这一步让 Brief 真正生效）----
    // 为什么需要用户主动点：它会写入用户工作区里的 AGENTS.md 文件。
    // 自动写用户文件是越界行为——即使内容是"有用的"。
    const syncRow = el('div', { class: 'row', style: 'margin-top:10px' });

    const syncState = state.syncState || { synced: false };
    if (syncState.synced && syncState.missionId === m.missionId) {
      syncRow.append(el('span', { class: 'badge active', text: '已同步到 AGENTS.md' }));
      const unBtn = el('button', { text: '撤销同步' });
      unBtn.addEventListener('click', async () => {
        const r = await api('unsyncBrief');
        if (!r.ok) { alert(r.reason); return; }
        state.syncState = { synced: false };
        renderDetail();
      });
      syncRow.append(unBtn);
    } else {
      const btn = el('button', { class: 'primary', text: '同步到 AGENTS.md' });
      btn.addEventListener('click', async () => {
        const r = await api('syncBrief', { missionId: m.missionId });
        if (!r.ok) { alert(r.reason); return; }
        const st = await api('briefSyncState');
        state.syncState = st.ok ? st : { synced: false };
        renderDetail();
      });
      syncRow.append(btn);
      syncRow.append(el('span', {
        class: 'tiny muted',
        text: '写入工作区的 AGENTS.md，下次会话 Agent 会自动读到。不会覆盖你手写的内容。',
      }));
    }
    box.append(syncRow);
  }

  // --- 诊断 ---
  const diagBtn = el('button', { text: '诊断（日志健康 / 备份 / 迁移）' });
  diagBtn.style.marginTop = '18px';
  diagBtn.addEventListener('click', async () => {
    const r = await api('diagnostics');
    if (!r.ok) { alert(r.reason); return; }
    alert(JSON.stringify(r, null, 2));
  });
  box.append(diagBtn);
}

// ------------------------------------------------------------------ 数据

async function refresh() {
  const list = await api('list');
  if (!list.ok) {
    $('list').textContent = '';
    $('list').append(el('div', { class: 'empty', text: '无法读取 Mission：' + list.reason }));
    return;
  }
  state.missions = list.missions || [];
  if (state.selectedId && !state.missions.some((m) => m.missionId === state.selectedId)) {
    state.selectedId = null;
  }
  // dock 模式：没有选中时自动选第一个——右栏应该"打开就有内容"，
  // 不该要求用户先点一下才看到东西。
  if (DOCK_MODE && !state.selectedId && state.missions.length > 0) {
    state.selectedId = state.missions[0].missionId;
  }
  renderList();
  if (state.selectedId) await loadDetail(state.selectedId);
  else renderDetail();
}

bindDockPicker();

async function selectMission(missionId) {
  state.selectedId = missionId;
  state.verified = null;
  state.brief = null;
  renderList();
  await loadDetail(missionId);
}

async function loadDetail(missionId) {
  const r = await api('get', { missionId });
  if (!r.ok) {
    state.detail = null;
    renderDetail();
    return;
  }
  state.detail = { ...r.view, live: r.live };

  // 待办与"离开期间"并行取：它们互不依赖，串行会让右栏打开慢一拍。
  const [att, since] = await Promise.all([
    api('attention'),
    api('sinceLastSeen', { missionId }),
  ]);
  state.attention = att.ok ? att : { ok: false, items: [], total: 0, available: false };
  state.since = since.ok ? since : { ok: false, entries: [], available: false };

  renderDetail();

  // Brief 单独取（它可能较大，且失败不应影响主视图）
  const b = await api('getBrief', { missionId });
  state.brief = b.ok ? b.brief : { empty: true };
  const sync = await api('briefSyncState');
  state.syncState = sync.ok ? sync : { synced: false };
  renderDetail();

  // 渲染完成后再记"看过"——记早了会把这次探索本身算进"离开期间"。
  // 不 await：它只是 UI 偏好，失败也不该影响展示。
  api('markSeen', { missionId });
}

// ------------------------------------------------------------------ 交互

$('btnNew').addEventListener('click', () => {
  $('fTitle').value = '';
  $('fIntent').value = '';
  $('fConstraint').value = '';
  $('dlgErr').textContent = '';
  $('dlg').showModal();
  $('fTitle').focus();
});

$('btnCancel').addEventListener('click', () => $('dlg').close());

$('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('fTitle').value.trim();
  const intent = $('fIntent').value.trim();
  const constraintsText = $('fConstraint').value.trim();
  if (!title || !intent) { $('dlgErr').textContent = '标题与目标都必须填写。'; return; }

  const payload = { title, intent };
  if (constraintsText) {
    payload.constraints = [{ id: 'con-1', text: constraintsText, source: 'user' }];
  }
  const r = await api('create', payload);
  if (!r.ok) { $('dlgErr').textContent = r.reason; return; }

  $('dlg').close();
  state.selectedId = r.missionId;
  await refresh();
});

// 启动
refresh();
</script>
