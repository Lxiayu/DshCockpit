  // 建索引：taskId → task（解析 blockedBy 用）
  const byId = new Map();
  for (const t of tasks) byId.set(t.id, t);

  for (const t of tasks) {
    if (t.status === 'deleted') continue;
    const row = el('div', { class: 'team-task', 'data-status': t.status });

    const line = el('div', { class: 'team-task-line' });
    line.append(el('span', { class: 'team-task-status st-task-' + t.status,
      text: TASK_STATUS_LABEL[t.status] || t.status }));
    line.append(el('span', { class: 'team-task-subject', text: t.subject || t.id }));
    row.append(line);

    // 负责人（官方给的 ownerName，可能没有）
    const meta = [];
    if (t.ownerName) meta.push(t.ownerName);
    if (meta.length) row.append(el('div', { class: 'team-task-meta', text: meta.join(' · ') }));

    // 被阻塞：读 blockedBy，去 tasks 里找**真正阻塞它**的任务
    // blockedBy 同理：官方投影里通常有，但缺省时不该让整块崩。
    const blockedBy = Array.isArray(t.blockedBy) ? t.blockedBy : [];
    if (t.ready === false && blockedBy.length > 0) {
      const blockers = blockedBy.map((id) => byId.get(id)).filter(Boolean);
      const blocked = el('div', { class: 'team-blocked' });
      if (blockers.length === 1) {
        const b = blockers[0];
        blocked.append(el('div', { class: 'team-blocked-line',
          text: '等待：' + (b.subject || b.id)
            + (b.ownerName ? ' · ' + b.ownerName : '')
            + (TASK_STATUS_LABEL[b.status] ? ' · ' + TASK_STATUS_LABEL[b.status] : '') }));
      } else if (blockers.length > 1) {
        blocked.append(el('div', { class: 'team-blocked-line',
          text: '等待 ' + blockers.length + ' 项前置任务' }));
        const ul = el('ul', { class: 'team-blocked-list' });
        for (const b of blockers) {
          ul.append(el('li', {
            text: (b.subject || b.id)
              + (b.ownerName ? ' · ' + b.ownerName : '')
              + (TASK_STATUS_LABEL[b.status] ? ' · ' + TASK_STATUS_LABEL[b.status] : ''),
          }));
        }
        blocked.append(ul);
      }
      // 找不到被引用的任务时如实说，不假装没被阻塞
      if (blockers.length === 0) {
        blocked.append(el('div', { class: 'team-blocked-line',
          text: '被 ' + blockedBy.length + ' 项前置任务阻塞（明细暂时读不到）' }));
      }
      row.append(blocked);
    }

    // writeScopeWarnings：**可能是冲突**，不是"已锁定"
    // 防御：writeScopeWarnings 在某些投影里可能缺省（如队友未启用 team profile）。
    // 直接 .length 会让整块渲染崩掉 —— 而它只是"可能冲突"的提示，
    // 不值得因为一个可选字段让整个右栏白屏。
    const scopeWarns = Array.isArray(t.writeScopeWarnings) ? t.writeScopeWarnings : [];
    if (scopeWarns.length > 0) {
      row.append(el('div', { class: 'team-scope-warn',
        text: '可能存在文件修改范围冲突：' + scopeWarns.join('、') }));
    }

    box.append(row);
  }
  return box;
}

/** 渲染第二层。**中性样式**，不能与第一层抢注意力。 */
function appendReminders(wrap, reminders) {
  if (!reminders || reminders.length === 0) return;
  const box = el('div', { class: 'att-reminders' });
  box.append(el('div', { class: 'att-rem-head', text: '执行提醒 · 不需要你决策' }));
  for (const r of reminders) {
    const row = el('div', { class: 'att-rem', 'data-tone': r.tone || 'info' });
    row.append(el('div', { class: 'att-rem-title', text: r.title }));
    if (r.detail) row.append(el('div', { class: 'att-rem-detail', text: r.detail }));
    box.append(row);
  }
  wrap.append(box);
}

/**
 * 从运行时投影里找这条待办对应的结构化问题。
 *
 * 匹配策略：投影里的 `active[]` 每项有 `callId`，而 office 快照的
 * pending item 有 `id`（也就是 callId）。先按 id 精确匹配；
 * 匹配不到但有**唯一**一个 active 问题时，用它（常见情形：
 * 同一时刻只有一个待回答的问题）。
 *
 * 拿不到就返回 null —— 调用方回落自由文本，**不猜**。
 */
function findStructuredQuestion(item) {
  const p = state.projections;
  if (!p || !p.userQuestionsAvailable || !Array.isArray(p.activeQuestions)) return null;
  const active = p.activeQuestions.filter((x) => x && Array.isArray(x.questions) && x.questions.length > 0);
  const pick = (entry) => {
    const q = entry.questions[0];
    const opts = Array.isArray(q.options)
      ? q.options.filter((o) => o && typeof o.label === 'string' && o.label) : [];
    return {
      question: q.question,
      detail: q.detail || null,
      options: opts,
      multiSelect: q.multiSelect === true,
      intent: q.intent || null,
    };
  };
  const byId = active.find((x) => x.callId && item && item.id && x.callId === item.id);
  if (byId) return pick(byId);
  if (active.length === 1) return pick(active[0]);
  return null;
}

/**
 * 渲染 plan-review 的计划内容（折叠式）。
 *
 * 官方约束（`AskUserQuestionIntent`）：
 *   · `detail` 是计划 markdown
 *   · `approve` 是**批准选项的 label**，且「named rather than positional
 *     so no UI infers the verdict from option order」
 *
 * 所以我们**不按索引猜哪个是批准**——判定完全交给运行时。
 */
function renderPlanReview(struct) {
  const wrap = el('div', { class: 'plan-review' });
  const text = typeof struct.detail === 'string' ? struct.detail : '';

  const head = el('div', { class: 'plan-review-head', text: '计划待审阅' });
  wrap.append(head);

  if (!text.trim()) {
    // 没有 detail 就如实说，不假装有内容可审
    wrap.append(el('div', { class: 'plan-review-empty',
      text: '计划没有附带正文。你可以直接批准/拒绝，或到 Harness 里查看完整计划。' }));
    return wrap;
  }

  // 折叠：默认只显示前 4 行。计划可能几千字，全展开会把侧栏撑爆。
  const PREVIEW_LINES = 4;
  const allLines = text.split('\n');
  const preview = allLines.slice(0, PREVIEW_LINES).join('\n');
  const hasMore = allLines.length > PREVIEW_LINES;

  const pre = el('pre', { class: 'plan-review-body', text: hasMore ? preview : text });
  wrap.append(pre);

  // 后端可能因为体积上限截断过 detail（见 ipc-mission.js 的 MAX_QUESTION_DETAIL_CHARS）。
  // **必须告诉用户**，否则他会以为计划就只有这些内容。
  if (struct.detailTruncated) {
    wrap.append(el('div', { class: 'plan-review-truncated',
      text: '计划正文过长，这里只显示了前 ' + Math.round(text.length / 1024) + 'k 字符'
        + '（原文 ' + Math.round((struct.detailFullLength || text.length) / 1024) + 'k）。'
        + '完整内容请在 Harness 里查看。' }));
  }

  if (hasMore) {
    const more = el('button', { class: 'plan-review-toggle',
      text: '展开全文（还有 ' + (allLines.length - PREVIEW_LINES) + ' 行）' });
    let expanded = false;
    more.addEventListener('click', () => {
      expanded = !expanded;
      pre.textContent = expanded ? text : preview;
      more.textContent = expanded ? '收起' : '展开全文（还有 ' + (allLines.length - PREVIEW_LINES) + ' 行）';
    });
    wrap.append(more);
  }
  return wrap;
}

/**
 * 把用户的选择送回 Harness。失败必须显示原因，不能假装成功。
 *
 * 真实 payload 形状（office-module.js 的 validateOfficeIpcPayload 严格校验键序）：
 *   { action: 'answer', id, value }
 * 我之前猜的 { pendingId, kind, answer } 会被判 PAYLOAD_INVALID。
 */
async function answerPending(item, answer) {
  const r = await window.dshShell.answerPending({ action: 'answer', id: item.id, value: answer });
  if (!r || !r.ok) {
    alert(explainFailure(r || { code: 'UNKNOWN' }));
    return;
  }
  await refresh();
}

// -------------------------------------------------- 离开期间（L2 时间线）
//
// 关键约束：**只从真实事件派生，不调用模型生成摘要。**
// 用户要的是"发生了什么"，不是"模型猜测发生了什么"。

const SINCE_TAG = {
  decision: '决策', question: '提问', answer: '回答',
  workstream: '工作流', 'workstream-status': '工作流', deliverable: '产物', mission: 'Mission',
};

function renderSince() {
  const si = state.since;
  if (!si) return null;

  if (!si.available) {
    // 第一次看这个 Mission → 没有"离开期间"。这是正常状态，不是错误。
    if (si.reason === 'never-seen') return null;
    return null;
  }
  if (!si.entries || si.entries.length === 0) return null;

  const box = el('div', { class: 'tl' });
  const head = el('div', { class: 'tl-head' }, [
    el('span', { text: '你离开期间' }),
  ]);
  if (Number.isFinite(si.sinceMs)) {
    // relativeTime 返回 "3 小时前"，而这里要说"上次看到是 3 小时前"。
    // 直接拼 "之后" 会变成"3 小时前 之后"，语义别扭。
    head.append(el('span', { class: 'tl-when', text: '上次查看：' + relativeTime(si.sinceMs) }));
  }
  box.append(head);

  const ul = el('ul', { class: 'tl-list' });
  for (const e of si.entries) {
    const li = el('li', { 'data-tone': e.tone || 'info' });
    li.append(el('span', { class: 'tl-tag', text: SINCE_TAG[e.kind] || e.kind }));
    li.append(document.createTextNode(e.text || ''));
    ul.append(li);
  }
  box.append(ul);
  if (si.truncated) {
    box.append(el('div', { class: 'tl-more', text: `另有 ${si.dropped} 条更早的变化未显示` }));
  }
  return box;
}

/**
 * 头部：一行标题 + 一个状态徽标 + 一行目标（§6.2 第 1 块）。
 *
 * 第一性原理：为什么状态是**徽标**而不是常驻下拉框
 *
 *   状态切换是低频动作（一个 Mission 从 active 到 completed 通常就一次）。
 *   把它做成常驻下拉框，等于用低频控件占掉首屏一个高频位置；
 *   而浏览器原生 select 在深色界面里是一块白，刺眼。
 *
 *   所以：徽标显示当前状态（一眼看到），点击才展开切换
 *   —— 低频动作收到它该在的层级里。
 */
function renderMissionHead(m, v) {
  const head = el('header', { class: 'mhead' });

  const line1 = el('div', { class: 'mhead-line1' });
  line1.append(el('h2', {
    class: 'mhead-title',
    text: m.title || '(未命名)',
    title: m.title || '',   // 省略号截断时，hover 能看到全文
  }));

  const badge = el('button', {
    class: 'mhead-badge mh-' + (m.status || 'active'),
    text: STATUS_TEXT[m.status] || m.status || '未知',
    title: '点击切换状态',
  });
  const menu = el('div', { class: 'mhead-status-menu' });
  menu.style.display = 'none';
  for (const s of ['active', 'paused', 'completed', 'abandoned']) {
    if (s === m.status) continue;
    const opt = el('button', { class: 'mhead-status-opt', text: STATUS_TEXT[s] || s });
    opt.addEventListener('click', async () => {
      menu.style.display = 'none';
      const r = await api('updateStatus', { missionId: m.missionId, to: s });
      if (!r || !r.ok) { alert((r && r.reason) || '切换失败'); return; }
      // 状态字段不能替代刹车：取消失败必须说出来，否则用户以为已经停了。
      if (r.stopped === 'cancel-failed') {
        alert('状态已改为 ' + (STATUS_TEXT[r.status] || r.status) + '，但**未能停止正在执行的会话**。'
          + '它可能还在跑，请到 Harness 视图确认。');
      } else if (r.stopped === 'not-wired') {
        alert('状态已改为 ' + (STATUS_TEXT[r.status] || r.status) + '，但当前环境没接上停止能力。'
          + '如果团队在跑，请到 Harness 视图手动停止。');
      }
      await refresh();
    });
    menu.append(opt);
  }
  badge.addEventListener('click', (ev) => {
    ev.stopPropagation();
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', () => { menu.style.display = 'none'; });
  line1.append(badge);
  head.append(line1);
  head.append(menu);

  if (m.intent) {
    const intentLine = el('div', { class: 'mhead-intent' });
    intentLine.append(el('span', { class: 'mhead-intent-label', text: '目标' }));
    intentLine.append(el('span', { class: 'mhead-intent-text', text: m.intent }));
    head.append(intentLine);
  }
  return head;
}

// 状态的人话标签。**不直接用 active/paused** ——
// 用户看不懂英文状态词，而"进行中/已暂停"是零学习成本的。
const STATUS_TEXT = {
  active: '进行中',
  paused: '已暂停',
  completed: '已完成',
  abandoned: '已放弃',
};

/**
 * 通用折叠区（§6.2 第 6 块）。
 *
 * 第一性原理：为什么折叠区的**默认状态**是关的，而不是开的
 *
 *   右栏 380px。用户打开它，80% 的时候只想知道三件事：
 *   有什么要我拍板、事情做到哪了、谁在做什么。
 *
 *   而"决策/发现/证据/假设/问题/工作流/产物/Brief" 这些是**查阅型**内容
 *   —— 需要时会去找，不需要时它们只是在挤压首屏。
 *
 *   所以：默认折叠，标题上带数量，需要时展开。
 *   数量很重要：`交付物 · 1` 比 `交付物` 多告诉用户"里面有一件事"，
 *   否则用户没有动机去点开。
 *
 * @param {object} opts
 * @param {string} opts.title
 * @param {number|null} [opts.count]   标题右侧的数量徽标（null = 不显示）
 * @param {Function} opts.render       展开时才调用的渲染函数（懒加载，省首屏开销）
 * @param {boolean} [opts.open]        默认是否展开
 * @returns {HTMLElement}
 */
function collapsibleSection({ title, count = null, render, open = false }) {
  const wrap = el('section', { class: 'coll' });
  const head = el('button', { class: 'coll-head' });

  const caret = el('span', { class: 'coll-caret', text: open ? '▾' : '▸' });
  head.append(caret);
  head.append(el('span', { class: 'coll-title', text: title }));
  if (Number.isFinite(count) && count > 0) {
    head.append(el('span', { class: 'coll-count', text: String(count) }));
  } else if (Number.isFinite(count)) {
    head.append(el('span', { class: 'coll-count coll-count-zero', text: '0' }));
  }
  wrap.append(head);

  const body = el('div', { class: 'coll-body' });
  body.style.display = open ? 'block' : 'none';
  wrap.append(body);

  let rendered = false;
  const ensure = () => {
    if (rendered) return;
    rendered = true;
    try {
      const out = render();
      if (out) body.append(out);
    } catch (err) {
      // 折叠区里某一块渲染出错，不该让整页崩 —— 这是本轮学到的教训
      body.append(el('div', { class: 'coll-error',
        text: '这块内容渲染失败：' + (err && err.message ? err.message : String(err)) }));
    }
  };

  if (open) ensure();
  head.addEventListener('click', () => {
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    caret.textContent = isOpen ? '▸' : '▾';
    if (!isOpen) ensure();
  });
  return wrap;
}

function renderDetail() {
  const box = $('detail');
  box.textContent = '';
  box.className = '';
  if (!state.detail) {
    box.className = 'empty';
    // 下面这句原来只说"选择一个 Mission"——但列表里可能**一个都没有**。
    // 分两种情况给不同的路标，否则用户会卡在一个无解的指令上。
    if (state.missions.length === 0) {
      box.append(el('div', { class: 'empty-lead', text: '还没有选中任何 Mission' }));
      box.append(el('div', { class: 'empty-body',
        text: '先在左边创建你的第一个 Mission，或者从列表里点一个已有的。' }));
    } else {
      box.append(el('div', { class: 'empty-lead', text: '选择一个 Mission' }));
      box.append(el('div', { class: 'empty-body',
        text: '从左侧列表点一个，就能看到它的目标、决策、工作流和产物。' }));
    }
    return;
  }
  const v = state.detail;
  const m = v.mission;

  // --- 头部：标题 + 状态 + 目标（§6.2 第 1 块）---
  //
  // 第一性原理：为什么头部必须置顶，且只放三样东西
  //
  //   右栏 380px。用户每次看它，第一个问题都是"这是哪个 Mission、它现在怎么样、
  //   它要完成什么"。这三件事必须在**第一眼**答完。
  //
  //   原实现把头部放在最下面（在"需要你"、"交给团队"、"团队任务"之后），
  //   于是首屏看不到"我在看哪个 Mission"——这正是用户抱怨的开头。
  box.append(renderMissionHead(m, v));

  // --- L1：需要你处理（最高优先级，永远置顶）---
  box.append(renderAttention());

  // --- L2：你离开期间发生了什么 ---
  const sinceBlock = renderSince();
  if (sinceBlock) box.append(sinceBlock);

  // ================================================================
  // 「交给团队」—— 这是整个 Mission Desk 最重要的入口
  //
  // 第一性原理：用户创建 Mission 后**无事可做**，因为 Mission 只能
  // 记录工作、不能启动工作。这一块补上那个缺失的环节。
  //
  // 放在最顶部而不是底部：它是"下一步做什么"的答案，
  // 不该藏在十几屏表单之后。
  // ================================================================
  box.append(renderStartWork(m));


  // --- 团队任务（只有启用 team 投影时才显示）---
  const teamBlock = renderTeamTasks();
  if (teamBlock) box.append(teamBlock);


  // --- 实时（Harness 的事实）---
  const live = v.live || {};
  const liveBlock = el('div', {});
  if (live.available) {
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '观察到 ' + relativeTime(live.observedAtMs) + '（' + new Date(live.observedAtMs).toLocaleTimeString() + '）',
    }));
    liveBlock.append(el('div', {
      class: 'tiny',
      text: 'Agent 在跑：' + (live.hasRunningAgent ? '是' : '否')
        + ' · 待审批 ' + live.pendingApprovals
        + ' · 待回答 ' + live.pendingQuestions,
    }));
    liveBlock.append(el('div', {
      class: 'tiny muted',
      // 保留"不会撒谎"这个**用户利益**，去掉"Harness/只读不写"这个**实现细节**。
      text: '这些数字直接来自运行时，我们不缓存、不推测，重启后也不会编造。',
    }));
  } else {
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '实时状态不可用——没有 Harness 快照。这不代表"没有在跑"，只代表我们现在读不到。',
    }));
  }
  // 术语修正（§6.1）：原来写"实时状态（Harness 拥有，只读）"——
  // "Harness 拥有"是架构术语，用户不知道 Harness 是什么，更不关心谁拥有它。
  // 他只想确认"这数字是真的吗"。所以标题说"现在的运行情况"，
  // 真实性由下面那句人话解释。
  box.append(el('h3', { text: '现在的运行情况' }), liveBlock);

  // --- 目标 ---
  //
  // 第一性原理：Desk 是编辑器，不是只读报表。
  // 标题/目标写错了却改不了，用户唯一的办法是删掉重建——
  // 而 Mission 的事实链是不可删的。所以"能改"不是锦上添花，是**纠错能力**。
  //
  // 边界：这里**不提供**改 status 的入口。状态变更是独立事实，
  // 必须走 updateStatus（顶部选择器），不能混进 update 的 patch。
  // 注意：这里不是「目标」的展示（那在头部），而是**编辑入口**。
  // 标题必须区分开，否则用户会以为页面上有两个目标。
  box.append(el('h2', { text: '编辑标题与目标' }));
  {
    const wrap = el('div', { class: 'row', style: 'gap:6px;align-items:flex-start' });
    const view = el('div', { text: m.intent || '（未填写）', style: 'flex:1' });
    const editBtn = el('button', { text: '改', class: 'tiny' });
    const editor = el('div', { style: 'flex-basis:100%;display:none;gap:6px;flex-wrap:wrap' });
    const titleInput = el('input', { placeholder: 'Mission 标题', style: 'flex:1;min-width:160px', value: m.title || '' });
    const intentInput = el('input', { placeholder: '目标（你的原话）', style: 'flex:2;min-width:200px', value: m.intent || '' });
    const saveBtn = el('button', { text: '保存' });
    const cancelBtn = el('button', { text: '取消' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });

    editBtn.addEventListener('click', () => {
      editor.style.display = 'flex';
      editBtn.style.display = 'none';
    });
    cancelBtn.addEventListener('click', () => {
      editor.style.display = 'none';
      editBtn.style.display = '';
      msg.textContent = '';
    });
    saveBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const patch = { missionId: m.missionId };
      if (titleInput.value.trim() && titleInput.value.trim() !== (m.title || '')) patch.title = titleInput.value.trim();
      if (intentInput.value.trim() !== (m.intent || '')) patch.intent = intentInput.value.trim();
      if (Object.keys(patch).length === 1) { msg.textContent = '没有改动'; return; }
      saveBtn.disabled = true;
      let r;
      try { r = await api('update', patch); }
      catch (e) { r = { ok: false, reason: e.message }; }
      saveBtn.disabled = false;
      if (r && r.ok) { editor.style.display = 'none'; editBtn.style.display = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });

    editor.append(titleInput, intentInput, saveBtn, cancelBtn, msg);
    wrap.append(view, editBtn, editor);
    box.append(wrap);
  }

  // --- 边界 ---
  box.append(el('h2', { text: '边界' }));
  if (!m.constraints || m.constraints.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '未声明边界。' }));
  } else {
    const ul = el('ul', {});
    for (const c of m.constraints) {
      ul.append(el('li', { text: c.text + (c.source === 'model' ? '（模型建议）' : '') }));
    }
    box.append(ul);
  }

  // --- 决策 ---
  box.append(renderDecisions(v.decisions || [], m));

  // ================================================================
  // Shared Context：发现 / 假设 / 证据（2026-11-01）
  //
  // 为什么这三块比"决策"更重要：
  //   决策只记"决定了什么"，记不住"为什么这么决定"。
  //     · Finding    = 我们发现的事实  → 团队积累的实体
  //     · Assumption = 暂时采用的判断  → 未来会爆的地雷
  //     · Evidence   = 凭什么相信      → 可信度的来源
  // ================================================================

  // 发现 / 假设 / 证据 —— 三者结构同构（状态徽章 + 正文 + 元信息 + 状态推进入口），
  // 所以走同一个声明式渲染器。这消除了三份几乎相同的 80 行代码，
  // 也让"再加一类实体"变成加一条配置，而不是复制 80 行。
  box.append(collapsibleSection({
    title: '发现',
    count: null,
    render: () => renderEntitySection({
    title: '发现',
    hint: '还没有记录发现。发现是"我们确认了 X 成立"，与决策（我们选择了 A）不同。',
    items: v.findings || [],
    idKey: 'findingId',
    labelMap: FINDING_LABEL,
    badgeClass: (it) => 'sc-badge st-finding-' + it.status,
    body: (it) => it.text,
    meta: (it) => {
      const out = ['置信 ' + (CONF_LABEL[it.confidence] || it.confidence)];
      if (Number.isFinite(it.foundAtMs)) out.push(relativeTime(it.foundAtMs));
      if ((it.evidenceIds || []).length) out.push(it.evidenceIds.length + ' 条证据');
      return out.join(' · ');
    },
    transitions: [
      { to: 'verified', label: '已验证', hideWhen: (it) => it.status === 'verified' || it.status === 'refuted' },
      { to: 'refuted', label: '已推翻', hideWhen: (it) => it.status === 'refuted' },
    ],
    apiAction: 'updateFindingStatus',
    form: 'finding',
    }),
  }));

  box.append(collapsibleSection({
    title: '假设',
    count: null,
    render: () => renderEntitySection({
    title: '假设',
    hint: '还没有记录假设。假设是"我们暂时这么认为，但还没验证"——它是最容易在三天后爆炸的东西。',
    items: v.assumptions || [],
    idKey: 'assumptionId',
    labelMap: ASSUMPTION_LABEL,
    badgeClass: (it) => 'sc-badge st-assumption-' + it.status,
    body: (it) => it.text,
    meta: (it) => {
      const out = ['置信 ' + (CONF_LABEL[it.confidence] || it.confidence)];
      if (Number.isFinite(it.madeAtMs)) out.push(relativeTime(it.madeAtMs));
      return out.join(' · ');
    },
    transitions: [
      { to: 'holding', label: '仍成立', hideWhen: (it) => it.status === 'holding' },
      { to: 'violated', label: '已推翻', hideWhen: (it) => it.status === 'violated' },
      { to: 'expired', label: '已过期', hideWhen: (it) => it.status === 'expired' },
    ],
    apiAction: 'updateAssumptionStatus',
    form: 'assumption',
    }),
  }));

  box.append(collapsibleSection({
    title: '证据',
    count: null,
    render: () => renderEntitySection({
    title: '证据',
    hint: '还没有证据。证据是"凭什么相信这个结论"——只存引用，不存内容。',
    items: v.evidences || [],
    idKey: 'evidenceId',
    labelMap: EVIDENCE_LABEL,
    badgeClass: () => 'sc-badge sc-badge-kind',
    badgeText: (it) => EVIDENCE_LABEL[it.kind] || it.kind,
    body: (it) => it.ref,
    bodyClass: 'sc-text sc-mono',
    meta: (it) => '支持：' + it.claim,
    transitions: [],
    form: 'evidence',
    }),
  }));

  // ================================================================
  // 折叠区（§6.2 第 6 块）
  //
  // 第一性原理：从这里往下的内容都是**查阅型**的。
  //
  //   用户打开右栏，80% 的时候只想知道三件事：要我拍板什么、事情做到哪了、
  //   谁在做什么。这三件事在上面已经答完了。
  //
  //   而"决策/发现/证据/假设/问题/工作流/产物/Brief/审计"是查阅型的
  //   —— 需要时会去找，不需要时只是在挤压首屏。
  //
  //   所以统一收进折叠区，标题带数量（`交付物 · 1` 比 `交付物` 多告诉
  //   用户"里面有事"），需要时点开。内容懒渲染：不点开就不构造 DOM。
  // ================================================================

  // 未决问题留在明面上：它和"需要你"是同一类事（悬而未决）。
  const qCount = Array.isArray(v.questions) ? v.questions.length : 0;
  box.append(collapsibleSection({
    title: '未决问题',
    count: qCount,
    open: qCount > 0,     // 有问题就应该被看见，不藏
    render: () => renderOpenQuestions(v.questions || [], m),
  }));

  const wsCount = Array.isArray(v.workstreams) ? v.workstreams.length : 0;
  box.append(collapsibleSection({
    title: '工作流',
    count: wsCount,
    render: () => renderWorkstreams(v, m),
  }));

  const trCount = Array.isArray(v.taskRefs) ? v.taskRefs.length : 0;
  box.append(collapsibleSection({
    title: '关联执行',
    count: trCount,
    render: () => renderTaskRefs(v, m),
  }));

  const dlCount = Array.isArray(v.deliverables) ? v.deliverables.length : 0;
  box.append(collapsibleSection({
    title: '交付物',
    count: dlCount,
    render: () => renderDeliverables(v, m),
  }));

  box.append(collapsibleSection({
    title: 'Brief 与诊断',
    count: null,
    render: () => renderBriefAndDiagnostics(v, m),
  }));

  // 团队成员留在明面上（不在折叠区）：它是"谁在做什么"，
  // 属于用户三大问题之一，不该藏起来。
  box.append(renderTeamMembers(m));

  box.append(collapsibleSection({
    title: '最近的干预',
    count: null,
    render: () => renderInterventionHistory(m),
  }));
}

/**
 * 团队成员名册 + 干预操作（S6）。
 *
 * 第一性原理：为什么名册必须带操作，而不是只列名字
 *
 *   右栏放一个"只读的成员列表"是没有价值的 —— office 里已经能看到成员在走动。
 *   名册在这里的唯一意义是：**让我能对某个人做点什么**
 *   （叫它停下、给它补一句话）。
 *
 * 诚实约束（来自 S0 实测 D11）：
 *   我们没有对成员直连的写表面，干预指令要经 Lead 转达。
 *   所以按钮文案写"请 Lead 转达"，并在成功后明确说
 *   "指令已发出，不代表对方已处理" —— 不假装是直连。
 */
function renderTeamMembers(m) {
  const proj = state.projections;
  const team = proj && proj.agentTeam;
  if (!team) return el('div', { class: 'members-empty', text: '' });

  const members = Array.isArray(team.members) ? team.members : [];
  if (members.length === 0) return el('div', { class: 'members-empty', text: '' });

  const box = el('section', { class: 'entity-section members-section' });
  const head = el('div', { class: 'entity-head' });
  head.append(el('h3', { text: '团队成员' }));
  head.append(el('span', { class: 'members-count', text: String(members.length) }));
  box.append(head);

  for (const mem of members) {
    const row = el('div', { class: 'member-row' });

    const line = el('div', { class: 'member-line' });
    line.append(el('span', { class: 'member-name', text: mem.name || mem.id }));
    // phase 是**生命周期**（provisioning/active/failed），不是"在不在跑"。
    // 不能把它显示成"工作中"——那是在 phase 上编造 turn 级事实。
    line.append(el('span', {
      class: 'member-phase',
      'data-phase': mem.phase || 'active',
      text: PHASE_LABEL[mem.phase] || mem.phase || 'active',
    }));
    if (mem.role === 'lead') line.append(el('span', { class: 'member-role', text: 'Lead' }));
    row.append(line);

    // 干预操作：只对非 lead 成员显示（对 Lead 的"中断"没有意义，
    // 它自己就是执行入口；要停整支团队用状态切换）
    if (mem.role !== 'lead' && mem.name) {
      const ops = el('div', { class: 'member-ops' });

      const msgBtn = el('button', { class: 'member-op', text: '转达消息' });
      msgBtn.addEventListener('click', () => openMemberMessage(m, mem.name));
      ops.append(msgBtn);

      const stopBtn = el('button', { class: 'member-op danger', text: '中断它' });
      stopBtn.addEventListener('click', () => interruptMember(m, mem.name, stopBtn));
      ops.append(stopBtn);

      row.append(ops);
    }
    box.append(row);
  }
  return box;
}

const PHASE_LABEL = {
  active: '在册',
  provisioning: '创建中',
  failed: '创建失败',
};

/** 打开一个小的"转达消息"表单（内联，不弹窗——右栏内弹窗会遮住上下文）。 */
function openMemberMessage(m, memberName) {
  const existing = document.querySelector('.member-msg-form');
  if (existing) existing.remove();

  const form = el('div', { class: 'member-msg-form' });
  form.append(el('div', { class: 'member-msg-title', text: '转达给 ' + memberName }));
  const input = el('textarea', { class: 'member-msg-input', rows: '3',
    placeholder: '要转达的原话（会原样发给 Lead，由它转达）' });
  form.append(input);
  const why = el('input', { class: 'member-msg-why', placeholder: '原因（可选，如：它跑偏了）' });
  form.append(why);
  const row = el('div', { class: 'member-msg-actions' });
  const send = el('button', { class: 'member-op', text: '请 Lead 转达' });
  const cancel = el('button', { class: 'member-op', text: '取消' });
  row.append(send, cancel);
  form.append(row);
  const msg = el('div', { class: 'member-msg-result' });
  form.append(msg);
  cancel.addEventListener('click', () => form.remove());
  send.addEventListener('click', async () => {
    const text = input.value.trim();
    if (!text) { msg.textContent = '消息不能为空。'; msg.classList.add('err'); return; }
    send.disabled = true;
    let r;
    try {
      r = await api('interveneMember', {
        missionId: m.missionId, kind: 'message', memberName,
        message: text, reason: why.value.trim() || undefined,
      });
    } catch (e) { r = { ok: false, reason: e.message }; }
    send.disabled = false;
    if (!r || !r.ok) {
      msg.textContent = '未发出：' + ((r && r.reason) || '未知原因');
      msg.classList.add('err');
      return;
    }
    msg.textContent = r.note || '已下达。';
    msg.classList.add('ok');
    input.value = '';
    if (typeof refresh === 'function') await refresh();
  });
  // 用 section 包一层便于定位
  const wrap = el('div', { class: 'entity-section member-msg-wrap' });
  wrap.append(form);
  const host = document.querySelector('#detail');
  if (host) host.append(wrap);
}

/** 中断某成员（经 Lead）。成功后如实说明"不代表已经停下"。 */
async function interruptMember(m, memberName, btn) {
  btn.disabled = true;
  let r;
  try {
    r = await api('interveneMember', {
      missionId: m.missionId, kind: 'interrupt', memberName,
    });
  } catch (e) { r = { ok: false, reason: e.message }; }
  btn.disabled = false;
  if (!r || !r.ok) { alert('未发出：' + ((r && r.reason) || '未知原因')); return; }
  alert(r.note || '已下达。');
  if (typeof refresh === 'function') await refresh();
}

/**
 * 「最近的干预」——回答"刚才我做了什么"。
 *
 * 第一性原理：干预是产品里权力最不对称的动作（点一下停掉整支团队）。
 * 没有这块，用户过十分钟就记不清自己停过什么、为什么停。
 *
 * 隐私：只显示闭集文案（"暂停了团队" / "中断了成员 xyz"），
 * 绝不显示任务正文或消息内容 —— 审计本身不能成为泄露面。
 */
function renderInterventionHistory(m) {
  const box = el('section', { class: 'entity-section' });
  const head = el('div', { class: 'entity-head' });
  head.append(el('h3', { text: '最近的干预' }));
  box.append(head);

  const list = el('div', { class: 'iv-list' });
  box.append(list);
  let loaded = false;

  const load = async () => {
    if (loaded) return;
    loaded = true;
    list.textContent = '';
    let r;
    try {
      r = await api('interventionHistory', { missionId: m.missionId, limit: 10 });
    } catch (e) {
      r = { ok: false, reason: e.message };
    }
    if (!r || !r.ok) {
      list.append(el('div', { class: 'entity-empty', text: '读取干预记录失败：' + ((r && r.reason) || '未知原因') }));
      return;
    }
    if (!r.entries || r.entries.length === 0) {
      list.append(el('div', { class: 'entity-empty', text: '这个 Mission 还没有干预记录。' }));
      return;
    }
    for (const e of r.entries) {
      const row = el('div', { class: 'iv-row' });
      row.append(el('span', { class: 'iv-desc', text: e.description || e.action }));
      const meta = [];
      if (Number.isFinite(e.atMs)) meta.push(relativeTime(e.atMs));
      if (e.reason) meta.push(e.reason);
      if (meta.length) row.append(el('span', { class: 'iv-meta', text: meta.join(' · ') }));
      list.append(row);
    }
  };

  // 折叠加载：默认收起，展开时才请求（右栏首屏被这一块挤掉不值得）
  const toggle = el('button', { class: 'iv-toggle', text: '展开' });
  toggle.addEventListener('click', async () => {
    const open = toggle.textContent === '收起';
    toggle.textContent = open ? '展开' : '收起';
    list.style.display = open ? 'none' : 'block';
    if (!open) await load();
  });
  list.style.display = 'none';
  head.append(toggle);
  return box;
}

// ------------------------------------------------------------------ 数据

async function refresh() {
  const list = await api('list');
  if (!list.ok) {
    $('list').textContent = '';
    $('list').append(el('div', { class: 'empty', text: '无法读取 Mission：' + list.reason }));
    return;
  }
  state.missions = list.missions || [];
  if (state.selectedId && !state.missions.some((m) => m.missionId === state.selectedId)) {
    state.selectedId = null;
  }
  // dock 模式：没有选中时自动选第一个——右栏应该"打开就有内容"，
  // 不该要求用户先点一下才看到东西。
  if (DOCK_MODE && !state.selectedId && state.missions.length > 0) {
    state.selectedId = state.missions[0].missionId;
  }
  renderList();
  if (state.selectedId) await loadDetail(state.selectedId);
  else renderDetail();
}

bindDockPicker();

async function selectMission(missionId) {
  state.selectedId = missionId;
  state.verified = null;
  state.brief = null;
  renderList();
  await loadDetail(missionId);
}

async function loadDetail(missionId) {
  const r = await api('get', { missionId });
  if (!r.ok) {
    state.detail = null;
    renderDetail();
    return;
  }
  state.detail = { ...r.view, live: r.live };

  // 待办 / 离开期间 / 运行时投影 并行取：三者互不依赖，
  // 串行会让右栏打开慢一拍。
  const [att, since, proj, bound] = await Promise.all([
    api('attention'),
    api('sinceLastSeen', { missionId }),
    api('sessionProjections'),
    api('getBoundSession', { missionId }),
  ]);
  state.boundSession = bound && bound.ok ? bound : null;
  // 已绑定会话时，顺手拿一次真实进度（只有绑定过才问，避免无谓调用）
  state.workStatus = null;
  if (state.boundSession && state.boundSession.bound) {
    try {
      const ws = await api('workStatus', { missionId });
      if (ws && ws.ok) state.workStatus = ws;
    } catch { /* 进度拿不到不影响主流程 */ }
  }
  // 有绑定的执行在跑 → 开始自动刷新进度（用户正在等，不能"看着没反应"）
  if (state.boundSession && state.boundSession.bound) {
    startProgressPoll();
  } else {
    stopProgressPoll();
  }
  state.attention = att.ok ? att : { ok: false, items: [], total: 0, available: false };
  state.since = since.ok ? since : { ok: false, entries: [], available: false };
  // 运行时投影：给出结构化的 userQuestions（含 options / multiSelect / plan-review）。
  // 拿不到时如实为 null —— 待办区会回落到 office 快照的纯文本路径。
  state.projections = proj.ok && proj.available ? proj : null;

  renderDetail();

  // Brief 单独取（它可能较大，且失败不应影响主视图）
  const b = await api('getBrief', { missionId });
  state.brief = b.ok ? b.brief : { empty: true };
  const sync = await api('briefSyncState');
  state.syncState = sync.ok ? sync : { synced: false };
  renderDetail();

  // 渲染完成后再记"看过"——记早了会把这次探索本身算进"离开期间"。
  // 不 await：它只是 UI 偏好，失败也不该影响展示。
  api('markSeen', { missionId });
}

// ------------------------------------------------------------------ 交互

$('btnNew').addEventListener('click', () => {
  $('fTitle').value = '';
  $('fIntent').value = '';
  $('fConstraint').value = '';
  $('dlgErr').textContent = '';
  $('dlg').showModal();
  $('fTitle').focus();
});

$('btnCancel').addEventListener('click', () => $('dlg').close());

$('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('fTitle').value.trim();
  const intent = $('fIntent').value.trim();
  const constraintsText = $('fConstraint').value.trim();
  if (!title || !intent) { $('dlgErr').textContent = '标题与目标都必须填写。'; return; }

  const payload = { title, intent };
  if (constraintsText) {
    payload.constraints = [{ id: 'con-1', text: constraintsText, source: 'user' }];
  }
  const r = await api('create', payload);
  if (!r.ok) { $('dlgErr').textContent = r.reason; return; }

  $('dlg').close();
  state.selectedId = r.missionId;
  await refresh();
});

// -------------------------------------------------- 进度自动刷新
//
// 第一性原理：用户点了「交给团队」之后会盯着屏幕等。
// 如果进度不自己变，他会以为"没反应"——这正是最初被抱怨的那个症状。
//
// 但不能无脑轮询：
//   · 全局每 3 秒刷一次 = 白烧 CPU，且大多数时候没有变化
//   · 有 Agent 任务在跑时才轮询
//   · 页面不可见时停（用户切走了就没必要刷）
//   · 连续多次没有变化就退避
//
// 只刷「交给团队」那一块的数字，**不整页重绘**——
// 整页重绘会让用户正在输入的文本框失焦。

const PROGRESS_POLL_MS = 4000;
let progressTimer = null;
let progressIdleTicks = 0;
// 防止 setInterval + async 重入（见 startProgressPoll 里的说明）
let progressBusy = false;

function stopProgressPoll() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  progressIdleTicks = 0;
}

function startProgressPoll() {
  stopProgressPoll();
  progressTimer = setInterval(async () => {
    // ⚠️ 防重入（2026-11-02 复查发现）。
    //
    //   setInterval + async 有天然缺陷：**如果一次请求比间隔慢，
    //   下一次会照常启动**，于是多个请求并发堆积。
    //   实测在 120ms 的慢请求 + 50ms 间隔下最大并发能到 3。
    //
    //   在真机上这意味着 IPC 排队、内存峰值、以及"看到先后乱序的结果"
    //   （后发的请求先回来 → 进度回退）。
    //
    //   加一个 in-flight 标记：上一次没回来就跳过这一跳。
    if (progressBusy) return;
    progressBusy = true;
    try {
      await pollProgressOnce();
    } finally {
      progressBusy = false;
    }
  }, PROGRESS_POLL_MS);
}

/** 单次轮询。抽出来是为了让 startProgressPoll 里的防重入逻辑保持简单。 */
async function pollProgressOnce() {
  {
    // 页面隐藏 → 不刷
    if (document.hidden) return;
    const id = state.selectedId;
    if (!id) { stopProgressPoll(); return; }
    const bound = state.boundSession;
    if (!bound || !bound.bound) { stopProgressPoll(); return; }

    let ws = null;
    try {
      ws = await api('workStatus', { missionId: id });
    } catch { return; }
    if (!ws || !ws.ok) return;

    // ⚠️ 需求发出后用户可能已经切走了（2026-11-02 复查发现）。
    //
    //   这个 await 可能耗时几百毫秒。如果期间用户点了另一个 Mission，
    //   state.selectedId 已经变了，而这里仍然会把**旧 Mission 的进度**
    //   写进 state.workStatus 并重绘 —— 于是新 Mission 的卡片上
    //   显示的是上一个 Mission 的"已执行 N 轮"。
    //
    //   判定：请求发出时的 id 与当前选中不一致 → 结果作废，直接丢弃。
    if (state.selectedId !== id) {
      return;
    }

    const prev = state.workStatus;
    const changed = !prev
      || prev.turns !== ws.turns
      || prev.steps !== ws.steps
      || prev.lastResponsePreview !== ws.lastResponsePreview
      || prev.hasResponse !== ws.hasResponse;

    state.workStatus = ws;

    if (changed) {
      progressIdleTicks = 0;
      // 只重绘 start-work 区块，不整页重绘（避免抢焦点）
      const oldBox = document.querySelector('.start-work');
      if (oldBox && state.detail && state.detail.mission) {
        const fresh = renderStartWork(state.detail.mission);
        oldBox.replaceWith(fresh);
      }
    } else {
      progressIdleTicks += 1;
      // 连续 15 次（≈60 秒）没变化 → 退避到停止，
      // 等用户下次交互再重启。避免长时间空转。
      if (progressIdleTicks >= 15) stopProgressPoll();
    }
  }
}

// 页面重新可见时，如果有绑定的会话就恢复轮询
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.boundSession && state.boundSession.bound) {
    startProgressPoll();
  }
});

// 启动
refresh();
</script>
