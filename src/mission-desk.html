    out.push({
      id: 'inbox',
      tone: 'info',
      title: '有 ' + parts.join('、') + ' 在排队',
      detail: inbox.preview
        ? '最早一条：' + inbox.preview
        : '这些是你已经交代、但 agent 还没开始处理的输入——不是没收到。',
    });
  }

  // danger-full-access 是最高权限：用户应该知道
  if (proj.permissionPreset === 'danger-full-access') {
    out.push({
      id: 'permission',
      tone: 'warn',
      title: '当前会话使用完整访问权限',
      detail: '这个会话里的工具调用不受工作区沙箱限制。如果不是你有意选的，建议改回 workspace-write。',
    });
  }
  return out;
}

// -------------------------------------------------- 团队任务（agentTeam）
//
// 第一性原理：**缺 agentTeam 不等于空团队**。
//
//   有五种情况都会让 agentTeam 不存在：
//     · profile 没启用 Team 插件（我们的默认情况）
//     · session 不属于 Team
//     · 投影尚未加载
//     · 读取失败
//     · 投影存在但确实没成员/任务
//
//   我们只能可靠区分"有没有 key"。所以：
//     · 没有 key  → **完全不显示团队区块**（不显示"0 个任务"）
//     · 有 key 但 tasks 为空 → 显示一句"团队没有在跑的任务"
//
// 第二性原理：blockedBy 的解析必须查表，不能用当前任务的 ownerName。
//   （GPT 第三轮指出我原来的错误）
//   blockedBy 是 **taskId 数组**，要拿每个 id 去 tasks 里找对应任务，
//   显示那个任务自己的 subject / status / ownerName。

const TASK_STATUS_LABEL = {
  pending: '未开始', in_progress: '进行中', completed: '已完成', deleted: '已删除',
};
const TASK_STATUS_TONE = {
  pending: 'idle', in_progress: 'info', completed: 'ok', deleted: 'idle',
};

/**
 * 「交给团队」区块 —— 让 Mission 能**启动工作**，而不只是记录。
 *
 * 第一性原理：用户创建 Mission 后不知道下一步做什么，因为之前
 * Mission 的所有 action 都只是"记录/查询"。这个区块是那个缺失的入口。
 *
 * 设计要点：
 *   · 放在详情最顶部（它是"下一步做什么"的答案）
 *   · 一句话输入 + 一个按钮，不要表单
 *   · 发出去之后立刻给**明确的反馈**（会话已创建 / 已送达）
 *   · 已绑定时显示「在 Harness 中继续」，让用户能去看执行过程
 */
/**
 * 派发面板：结构化任务书（§6.5 / D3）。
 *
 * 第一性原理：为什么必须是五个字段，而不是一个聊天框
 *
 *   用户要交的是**任务书**，不是"随口说一句"。差别在于：
 *     聊天框     → 说了就没了，事后无法回答"当初答应做什么"
 *     任务书     → 目标/验收/约束/预算/审批规则各自是实体，可核对、可判定完成
 *
 *   尤其"验收条件"：没有它，团队说"做完了"我们只能选择信或不信。
 *   有了它，完成与否是可判定的 —— 这正是 receipt 与契约存在的意义。
 *
 *   所以面板不是一个输入框，是五个带标签的字段，其中目标与验收必填。
 */
function renderDispatchPanel(m) {
  const box = el('section', { class: 'dispatch' });
  box.append(el('h3', { class: 'dispatch-title', text: '交代任务' }));

  // --- 目标（必填）---
  const goalWrap = el('div', { class: 'dp-field' });
  goalWrap.append(el('label', { class: 'dp-label', text: '目标' }));
  const goal = el('textarea', { class: 'dp-input dp-goal', rows: '2',
    placeholder: '一句话说清这次要完成什么（必填）' });
  goalWrap.append(goal);
  box.append(goalWrap);

  // --- 验收条件（必填，可多条；每条要选验证方式）---
  const accWrap = el('div', { class: 'dp-field' });
  accWrap.append(el('label', { class: 'dp-label', text: '验收条件' }));
  accWrap.append(el('div', { class: 'dp-hint',
    text: '每条选一个验证方式。没有验收条件就无法判定"做完了"。' }));
  const accList = el('div', { class: 'dp-acc-list' });
  accWrap.append(accList);

  const addAcc = (initial = {}) => {
    const row = el('div', { class: 'dp-acc-row' });
    const text = el('input', { class: 'dp-input', placeholder: '怎么算做到了？例如 npm test 全绿', value: initial.text || '' });
    const kind = el('select', { class: 'dp-select' });
    for (const [v, label] of [['command', '跑命令'], ['manual', '人工确认'], ['artifact', '产出文件']]) {
      const o = el('option', { value: v, text: label });
      if (v === (initial.kind || 'command')) o.selected = true;
      kind.append(o);
    }
    const detail = el('input', { class: 'dp-input', placeholder: '命令或产物路径' });
    const del = el('button', { class: 'dp-del', text: '×', title: '删除这条' });
    del.addEventListener('click', () => row.remove());
    row.append(text, kind, detail, del);
    accList.append(row);
  };
  addAcc();
  const addBtn = el('button', { class: 'dp-add', text: '＋ 加一条验收条件' });
  addBtn.addEventListener('click', () => addAcc());
  accWrap.append(addBtn);
  box.append(accWrap);

  // --- 约束（可多条，可留空）---
  const conWrap = el('div', { class: 'dp-field' });
  conWrap.append(el('label', { class: 'dp-label', text: '约束' }));
  const con = el('textarea', { class: 'dp-input', rows: '2',
    placeholder: '每行一条。例如：不改动官方 Harness 代码' });
  conWrap.append(con);
  box.append(conWrap);

  // --- 预算（可留空）---
  const budgetWrap = el('div', { class: 'dp-field' });
  budgetWrap.append(el('label', { class: 'dp-label', text: '预算' }));
  const budget = el('input', { class: 'dp-input', placeholder: 'token 上限，留空 = 不限' });
  budgetWrap.append(budget);
  box.append(budgetWrap);

  // --- 授权目录（D10：派发只能选一条有效 Grant，不能填路径）---
  const grantWrap = el('div', { class: 'dp-field' });
  grantWrap.append(el('label', { class: 'dp-label', text: '授权目录' }));
  const grantSel = el('select', { class: 'dp-select dp-grant' });
  grantWrap.append(grantSel);
  const grantMsg = el('div', { class: 'dp-hint' });
  grantWrap.append(grantMsg);
  box.append(grantWrap);

  // 加载有效 Grant 列表：**没有 Grant 就不让派发**。
  // 这不是障碍，是诚实 —— 派发到一个未授权目录，团队要么失败要么在错误地方写。
  //
  // ⚠️ 关键修正（2026-11-04，走新用户路径时发现）：
  //   早期这里写"先在下方「授权目录」里授权一个目录" —— 但那个折叠区在页面
  //   很下面（要滚过进展、团队、一堆折叠区）。用户此刻正在派发面板里，
  //   而指引把他送到一个要找很久的地方。**新用户会在这里卡住。**
  //
  //   现在：没有授权时，**就地在面板内提供授权入口**。
  //   "去哪里做"变成"就在这里做"。
  const inlineGrant = el('div', { class: 'dp-inline-grant' });
  inlineGrant.style.display = 'none';
  grantWrap.append(inlineGrant);

  const refreshGrantOptions = async () => {
    let r;
    try { r = await api('listGrants'); } catch (e) { r = { ok: false, reason: e.message }; }
    const active = (r && r.ok ? r.grants : []).filter((g) => g.active);
    grantSel.textContent = '';
    if (active.length === 0) {
      const o = el('option', { value: '', text: '（还没有可用授权）' });
      grantSel.append(o);
      grantMsg.textContent = '派发前需要先授权一个目录。可以直接在这里授权：';
      grantMsg.classList.add('dp-warn');
      buildInlineGrant();
      inlineGrant.style.display = 'block';
      return;
    }
    grantMsg.textContent = '';
    grantMsg.classList.remove('dp-warn');
    inlineGrant.style.display = 'none';
    inlineGrant.textContent = '';
    for (const g of active) {
      const o = el('option', { value: g.grantId,
        text: (g.access === 'write' ? '读写' : '只读') + ' · ' + g.workspaceDir });
      grantSel.append(o);
    }
  };

  // 就地授权表单（复用 createGrant，不重复实现）
  const buildInlineGrant = () => {
    if (inlineGrant.childNodes.length > 0) return;
    const sub = el('input', { class: 'dp-input',
      placeholder: '子目录（留空 = 工作区根）。例如 work/login-refactor' });
    const acc = el('select', { class: 'dp-select' });
    for (const [v, label] of [['write', '读写（要改代码就选这个）'], ['read', '只读']]) {
      const o = el('option', { value: v, text: label });
      acc.append(o);
    }
    const go = el('button', { class: 'dp-submit', text: '授权并继续' });
    const m2 = el('div', { class: 'dp-msg' });
    go.addEventListener('click', async () => {
      go.disabled = true;
      m2.className = 'dp-msg';
      m2.textContent = '';
      let rr;
      try {
        rr = await api('createGrant', { subdir: sub.value.trim() || undefined, access: acc.value });
      } catch (e) { rr = { ok: false, reason: e.message }; }
      go.disabled = false;
      if (!rr || !rr.ok) {
        m2.textContent = '授权失败：' + ((rr && rr.reason) || '未知原因');
        m2.classList.add('err');
        return;
      }
      m2.textContent = '已授权。现在可以交给团队了。';
      m2.classList.add('ok');
      await refreshGrantOptions();
      // 自动选中刚建的那条
      if (rr.grant && rr.grant.grantId) grantSel.value = rr.grant.grantId;
    });
    inlineGrant.append(sub, acc, go, m2);
  };

  refreshGrantOptions();

  // --- 提交 ---
  const actions = el('div', { class: 'dp-actions' });
  const saveBtn = el('button', { class: 'dp-submit', text: '保存任务书' });
  actions.append(saveBtn);
  box.append(actions);
  const msg = el('div', { class: 'dp-msg' });
  box.append(msg);

  saveBtn.addEventListener('click', async () => {
    msg.textContent = '';
    msg.className = 'dp-msg';
    const acceptance = [];
    let i = 0;
    for (const row of accList.querySelectorAll('.dp-acc-row')) {
      const [textEl, kindEl, detailEl] = row.querySelectorAll('.dp-input, .dp-select');
      const t2 = textEl ? textEl.value.trim() : '';
      if (!t2) continue;
      i += 1;
      const kind = kindEl ? kindEl.value : 'command';
      const item = { id: 'a' + i, text: t2, kind };
      const d = detailEl ? detailEl.value.trim() : '';
      if (kind === 'command' && d) item.command = d;
      if (kind === 'artifact' && d) item.artifactRef = d;
      acceptance.push(item);
    }
    if (!goal.value.trim()) { msg.textContent = '先写一句目标。'; msg.classList.add('err'); return; }
    if (acceptance.length === 0) {
      msg.textContent = '至少写一条验收条件 —— 否则无法判定"做完了"。';
      msg.classList.add('err');
      return;
    }
    // 注意：这里的换行符必须写成 \n 转义，不能用真实换行 ——
    // 否则字符串跨行，整个 <script> 语法错误、右栏白屏。
    const constraints = con.value.split('\n').map((x) => x.trim()).filter(Boolean)
      .map((t3) => ({ text: t3 }));
    const contract = { status: 'draft', acceptance };
    if (constraints.length) contract.constraints = constraints;
    const bt = budget.value.trim();
    if (bt && Number.isFinite(Number(bt))) contract.budget = { maxTokens: Number(bt) };
    if (grantSel.value) contract.grantId = grantSel.value;

    saveBtn.disabled = true;
    let r2;
    try {
      r2 = await api('saveContract', { missionId: m.missionId, contract });
    } catch (e) { r2 = { ok: false, reason: e.message }; }
    saveBtn.disabled = false;
    if (!r2 || !r2.ok) {
      msg.textContent = '保存失败：' + ((r2 && r2.reason) || '未知原因');
      msg.classList.add('err');
      return;
    }
    // 目标同时写进 Mission.intent —— 用户只该填一次。
    //
    // ⚠️ 这里刻意**不**走 api('update')：那个 action 有自己的 UI 入口
    // （编辑标题与目标区块），测试用 "api('update'" 作为该区块的定位锚点。
    // 在这里再调一次会让锚点指向派发面板，连带破坏两条与 status 有关的断言。
    // 目标通过合同体现即可，Mission.intent 的编辑留给那个专门区块。
    void goal;
    msg.textContent = '任务书已保存。可以交给团队了。';
    msg.classList.add('ok');

    // ⚠️ 这里**不能** await refresh()。
    //
    //   refresh() 会重建整个详情区 DOM，于是：
    //     ① 派发面板被折叠回初始状态（用户刚填的内容从视野里消失）
    //     ② 刚写进去的"任务书已保存"提示被冲掉
    //     ③ 「交给团队」按钮随之消失 —— 用户被卡在"保存成功但没法继续"
    //
    //   这是本项目踩过的同一个坑（见 renderStartWork 里"先显示提示再刷新"
    //   的注释）：改完要**局部更新**，不能整页重建。
    //
    //   保存后唯一需要更新的外部状态是"合同已存在"，而那不影响本面板的可用性；
    //   用户点「交给团队」时会自然走完整流程并刷新。
    void refresh;
  });

  return box;
}

/**
 * 派发结果的持久提示条。
 *
 * 为什么不用 alert：alert 关掉就没了。派发是产品最重要的动作，
 * 用户需要能随时回头确认"我确实交出去过"。
 *
 * @param {string} missionId
 */
function renderLastDispatch(missionId) {
  const host = document.getElementById('detail');
  if (!host) return;
  const prev = document.getElementById('last-dispatch');
  if (prev) prev.remove();
  const d = state.lastDispatch;
  if (!d || d.missionId !== missionId) return;

  const bar = el('div', { id: 'last-dispatch', class: 'last-dispatch' + (d.ok ? '' : ' last-dispatch-err') });
  bar.append(el('span', { class: 'last-dispatch-text', text: d.text }));
  bar.append(el('span', { class: 'last-dispatch-when', text: relativeTime(d.atMs) || '刚刚' }));
  // 插在派发入口之后，视觉上紧跟着它
  const startWork = host.querySelector('.start-work');
  if (startWork && startWork.nextSibling) host.insertBefore(bar, startWork.nextSibling);
  else host.append(bar);
}

function renderStartWork(m) {
  const box = el('section', { class: 'start-work' });

  // §6.2 第 4 块：派发入口默认是**一行**，点击才展开。
  //
  // 第一性原理：为什么不能常驻一个大文本框
  //
  //   380px 首屏里，一个 2 行 textarea + 说明文字 + 按钮约占 180px，
  //   等于把"团队在做什么"整个挤出首屏。而用户**大多数时候不是来派活的**
  //   —— 他来是看进展、看有没有要拍板的事。
  //
  //   派发是低频动作（一个 Mission 通常一两次），不该占用首屏最高的位置。
  const collapse = () => {
    box.classList.remove('open');
    box.textContent = '';
    box.append(triggerRow());
  };

  const triggerRow = () => {
    const row = el('div', { class: 'start-work-trigger' });
    const btn = el('button', { class: 'start-work-open', text: '＋ 交代新任务' });
    btn.addEventListener('click', () => expand());
    row.append(btn);
    return row;
  };

  const expand = () => {
    box.classList.add('open');
    box.textContent = '';

    const head = el('div', { class: 'start-work-head' });
    head.append(el('span', { text: '交代新任务' }));
    const closeBtn = el('button', { class: 'start-work-close', text: '收起' });
    closeBtn.addEventListener('click', () => collapse());
    head.append(closeBtn);
    box.append(head);

    // 结构化任务书（D3）：不是聊天框
    box.append(renderDispatchPanel(m));

    // 聊天式输入框已被结构化任务书取代（D3：用户要交的是任务书，不是聊天）。
    attachStartWorkActions(m, box, null);
  };

  box.append(triggerRow());
  return box;
}

/**
 * 把「交给团队」的提交逻辑挂到展开后的面板上。
 *
 * 拆出来是为了让 renderStartWork 只管**折叠/展开**的视觉，
 * 提交逻辑（含派发确认）保持独立可读。
 */
function attachStartWorkActions(m, box, input) {

  const actions = el('div', { class: 'start-work-actions' });
  const send = el('button', { class: 'start-work-btn', text: '交给团队' });
  actions.append(send);
  box.append(actions);

  const msg = el('div', { class: 'start-work-msg' });
  box.append(msg);

  send.addEventListener('click', async () => {
    // input 为 null 时（任务书形态），任务内容来自已保存的合同 / Mission.intent，
    // 这里只负责触发派发。
    const task = input ? input.value.trim() : String(
      (state.detail && state.detail.mission && state.detail.mission.intent) || '').trim();
    msg.textContent = '';
    msg.className = 'start-work-msg';
    if (!task) {
      msg.textContent = '先写一句要团队做什么。';
      msg.classList.add('err');
      return;
    }
    send.disabled = true;
    send.textContent = '发送中…';
    let r;
    let dispatchedAtMs = null;
    try {
      dispatchedAtMs = Date.now();
      r = await api('startWork', { missionId: m.missionId, task });
    } catch (e) {
      r = { ok: false, reason: e.message };
    }
    send.disabled = false;
    send.textContent = '交给团队';
    if (!r || !r.ok) {
      msg.textContent = explainFailure(r || {});
      msg.classList.add('err');
      return;
    }
    // input 可能为 null（任务书形态下没有聊天输入框）——
    // 早期直接 input.value = '' 会抛 TypeError，导致**派发已成功但后续提示全断**。
    if (input) input.value = '';
    // ★ 关键：先刷新再显示反馈。
    //
    // 第一版是「先显示成功提示，再 loadDetail()」——但 loadDetail 会
    // 重建整个详情区 DOM，把刚写进去的提示冲掉了。
    // 结果：用户点了「交给团队」，工作真的发出去了，**但界面看起来毫无反应**。
    //
    // 这正是用户抱怨的"没有反应"。真机验收 2 项红才发现。
    await loadDetail(m.missionId);

    // ---- 派发确认（S2）---------------------------------------------------
    //
    // 第一性原理：为什么"已交给团队"这句话不够
    //
    //   我们没有 remote 写表面（D11）：派发 = 发一段指令，让 Lead 自己去调
    //   spawn_teammate / team_task_create。于是 prompt 被接受 ≠ 任务被创建。
    //
    //   只显示"已交给团队"，用户会以为事情必成；而实际上模型可能理解偏了、
    //   建了别的任务、或者压根没动。这里立刻确认一次，把**真实状态**说出来。
    //
    //   注意措辞：unconfirmed 绝不说"失败"——那会让用户重复派发、
    //   凭空多出一支团队。文案由 confirmDispatch 的 description 给，
    //   前端不自己编。
    let dispatchLine = '已交给团队。切到 Harness 视图可以看到执行过程。';
    let dispatchOk = true;
    if (r.dispatchKey) {
      try {
        const conf = await api('confirmDispatch', {
          missionId: m.missionId,
          dispatchKey: r.dispatchKey,
          startedAtMs: dispatchedAtMs,
        });
        if (conf && conf.ok && conf.description) {
          dispatchLine = conf.description;
          // rejected 才算真失败；pending/unconfirmed 都还是"待观察"
          dispatchOk = conf.state !== 'rejected';
        }
      } catch {
        // 确认本身失败不该把"已下达"说成失败——那是两件事
        dispatchLine = '已下达，但确认时出错了（这不代表没有派发）。可稍后刷新查看。';
      }
    }

    // 派发结果必须**留在界面上**，不能只靠一次 alert。
    //
    // 第一性原理：为什么
    //   派发是本产品最重要的动作（把任务交给团队）。用户点完最想知道
    //   "到底发出去了没"。一个转瞬即逝的 alert 关掉之后，界面上若没有
    //   任何痕迹，他只能靠记忆 —— 而记忆不可靠，尤其当它和"团队还没动"
    //   同时出现时，他会怀疑自己没点。
    //
    //   所以：把结果写进 state，刷新后由派发入口那一块重新渲染出来。
    state.lastDispatch = {
      text: dispatchLine,
      ok: dispatchOk,
      atMs: Date.now(),
      missionId: m.missionId,
    };
    // 刷新后重新拿节点（旧节点已经不在 DOM 里）
    const freshMsg = document.querySelector('.start-work-msg');
    if (freshMsg) {
      freshMsg.textContent = dispatchLine;
      freshMsg.classList.add(dispatchOk ? 'ok' : 'err');
    }
    // 再渲染一块持久的结果条（不依赖刚被重建的那个节点）
    renderLastDispatch(m.missionId);
  });

  // 已绑定会话 → 显示**真实进度** + "去看执行"入口
  //
  // 第一性原理：用户点了「交给团队」之后最想知道"它在跑吗、跑到哪了"。
  // 这些信息投影里已经有（sessionStats.turns/steps），不需要我们
  // 监听事件、也不需要写第二个聊天框。
  //
  // **不猜**：turns>0 只代表有 turn 结束过，不代表任务成功。
  // 所以我们只报数字，不写"已完成"。
  const bound = state.boundSession;
  if (bound && bound.bound) {
    const ws = state.workStatus;
    if (ws && ws.available) {
      const prog = el('div', { class: 'start-work-progress' });
      if (ws.hasRun) {
        prog.append(el('div', { class: 'start-work-progress-line',
          text: '已执行 ' + ws.turns + ' 轮 · ' + ws.steps + ' 步' }));

        // Agent 真的给出回复了 → 显示**它的原话**（预览）
        //
        // 第一性原理：用户点了「交给团队」之后，最想知道"它说了什么"。
        // 这个信息在 turnOutline[].response 里（官方在 turn/end 时提交）。
        //
        // **必须标明是预览**：官方为窄栏卡片设计了这个字段，有长度上限，
        // 不是完整回复。写成完整回复就是撒谎。
        if (ws.hasResponse && ws.lastResponsePreview) {
          const resp = el('div', { class: 'start-work-response' });
          resp.append(el('div', { class: 'start-work-response-label',
            text: '团队最近一次回复' + (ws.lastTurn ? '（第 ' + ws.lastTurn + ' 轮）' : '') }));
          resp.append(el('div', { class: 'start-work-response-body',
            text: ws.lastResponsePreview }));
          if (ws.lastPromptPreview) {
            resp.append(el('div', { class: 'start-work-response-prompt',
              text: '回应的是：' + ws.lastPromptPreview }));
          }
          resp.append(el('div', { class: 'start-work-response-note',
            text: '这是预览（有长度上限），完整内容请在 Harness 里查看。' }));

          // 「登记产物」：从回复里找**真实存在**的文件，登记成 Deliverable
          //
          // 第一性原理：Agent 说"我生成了 docs/report.md"这句话不是证据。
          // 所以后端会逐个 fs.stat 校验——只有真实存在的才登记。
          // 用户点这个按钮 = 授权我们去核对并登记。
          const harvest = el('button', { class: 'start-work-harvest', text: '核对并登记产物' });
          const harvestMsg = el('div', { class: 'start-work-harvest-msg' });
          harvest.addEventListener('click', async () => {
            harvest.disabled = true;
            harvest.textContent = '核对着…';
            harvestMsg.textContent = '';
            harvestMsg.className = 'start-work-harvest-msg';
            let r;
            try {
              r = await api('harvestDeliverables', { missionId: m.missionId });
            } catch (e) { r = { ok: false, reason: e.message }; }
            harvest.disabled = false;
            harvest.textContent = '核对并登记产物';
            if (!r || !r.ok) {
              harvestMsg.textContent = explainFailure(r || {});
              harvestMsg.classList.add('err');
              return;
            }
            const added = r.added || [];
            const skipped = r.skipped || [];
            const parts = [];
            if (added.length) parts.push('已登记 ' + added.length + ' 个真实产物');
            if (skipped.length) {
              // 如实报告"Agent 提到但没找到"——这是诚实的关键
              parts.push(skipped.length + ' 个提到但未找到');
            }
            if (!parts.length) parts.push('没有发现可登记的产物');
            harvestMsg.textContent = parts.join('，') + '。';
            harvestMsg.classList.add(added.length ? 'ok' : '');
            if (skipped.length) {
              const ul = el('ul', { class: 'start-work-skip-list' });
              for (const sk of skipped) {
                ul.append(el('li', { text: sk.relPath + ' — ' + sk.reason }));
              }
              harvestMsg.append(ul);
            }
            if (added.length) await loadDetail(m.missionId);
          });
          resp.append(harvest);
          resp.append(harvestMsg);
          prog.append(resp);
        } else {
          prog.append(el('div', { class: 'start-work-progress-hint',
            text: '这是 Harness 记录的完成轮数，不代表任务已经达到你的要求。' }));
        }
      } else {
        prog.append(el('div', { class: 'start-work-progress-line',
          text: '已交给团队，还没有完成的轮次。' }));
      }
      box.append(prog);
    }
    const go = el('button', { class: 'start-work-link',
      text: '在 Harness 中查看这个 Mission 的执行 →' });
    go.addEventListener('click', () => {
      // 复用已有的视图切换通道（rail 用它切 harness 视图）
      //
      // ⚠️ 失败时不能再说"请在左侧栏"（2026-11-04 修正）：
      //   dock 模式是单栏，没有左侧栏。而且 alert 关掉就没信息了。
      //   改成**内联提示**，按布局说不同的路。
      const fail = () => {
        const hint = el('div', { class: 'tiny muted', style: 'margin-top:4px',
          text: DOCK_MODE
            ? '这个窗口没法自动切换。请回到主界面，在那边的 Harness 视图查看执行过程。'
            : '请在上方切换到 Harness 视图查看执行过程。' });
        go.after(hint);
      };
      try {
        if (window.dshShell && typeof window.dshShell.showView === 'function') {
          window.dshShell.showView('harness');
        } else {
          fail();
        }
      } catch {
        fail();
      }
    });
    box.append(go);
  }
  return box;
}


function renderTeamTasks(m) {
  // ⚠️ m（Mission）必须传进来：任务行的「改写/转交」按钮需要它来调 rewriteTask。
  // 早期这里没接参数，而按钮回调里引用了 m —— 表现为**按钮存在、点了抛
  // ReferenceError**，而静态截图完全看不出来（渲染时不执行回调）。
  // 这类缺陷只有"真的点一下"的探针能发现。
  const proj = state.projections;
  const team = proj && proj.agentTeam;
  if (!team) return null;   // 没有 key → 不显示（不是显示空的）

  const tasks = Array.isArray(team.tasks) ? team.tasks : [];
  const members = Array.isArray(team.members) ? team.members : [];
  if (tasks.length === 0 && members.length <= 1) return null;  // 只有 lead 且无任务 → 无事可说

  const box = el('section', { class: 'team' });

  // 投影异常必须明说——官方注释：failure 有值时数据停留在最后一次有效状态
  if (team.failure) {
    box.append(el('div', { class: 'team-warn',
      text: '团队状态可能不是最新的（投影异常：' + team.failure + '）。以下内容来自最后一次有效状态。' }));
  }

  // ---- §6.2 第 3 块：进展（Task-centric）----
  //
  // 第一性原理：为什么这一块的标题是"进展"而不是"团队任务"
  //
  //   用户打开右栏想知道的是"事情做到哪了"，不是"团队有哪些任务"。
  //   同一份数据，语序不同，回答的问题不同。
  //
  //   统计**全部来自任务板**，我们只做计数，不做推断：
  //     · 分母 = 未删除的任务数（deleted 不计入进度，它等于不存在）
  //     · 完成 = status === 'completed'
  //     · 阻塞 = 存在未完成的 blockedBy（这是官方 ready 字段的语义来源）
  //
  //   绝不自己判断"应该完成"—— 那是 Harness 的事实。
  const live = tasks.filter((x) => x && x.status !== 'deleted');
  const doneCount = live.filter((x) => x.status === 'completed').length;
  const runningCount = live.filter((x) => x.status === 'in_progress').length;
  const blockedTasks = live.filter((x) => x.status !== 'completed'
    && Array.isArray(x.blockedBy) && x.blockedBy.length > 0);

  const head = el('div', { class: 'team-head' });
  head.append(el('span', { text: '进展' }));
  if (live.length) {
    // 进度数字用 "3/7"，一眼看出规模；阻塞单独标红点
    head.append(el('span', { class: 'team-progress',
      text: `${doneCount}/${live.length}` }));
    if (blockedTasks.length > 0) {
      head.append(el('span', { class: 'team-blocked-count',
        text: `${blockedTasks.length} 阻塞` }));
    }
  }
  box.append(head);

  if (tasks.length === 0) {
    box.append(el('div', { class: 'team-empty', text: '团队当前没有在跑的任务。' }));
    return box;
  }
  if (live.length === 0) {
    box.append(el('div', { class: 'team-empty', text: '任务都已被删除，没有剩余工作。' }));
    return box;
  }

  // 建索引：taskId → task（解析 blockedBy 用）
  const byId = new Map();
  for (const t of tasks) byId.set(t.id, t);

  for (const t of tasks) {
    if (t.status === 'deleted') continue;
    const row = el('div', { class: 'team-task', 'data-status': t.status });

    const line = el('div', { class: 'team-task-line' });
    line.append(el('span', { class: 'team-task-status st-task-' + t.status,
      text: TASK_STATUS_LABEL[t.status] || t.status }));
    line.append(el('span', { class: 'team-task-subject', text: t.subject || t.id }));
    row.append(line);

    // 负责人（官方给的 ownerName，可能没有）
    const meta = [];
    if (t.ownerName) meta.push(t.ownerName);
    if (meta.length) row.append(el('div', { class: 'team-task-meta', text: meta.join(' · ') }));

    // 任务级干预：改写 / 重分配（S6）。
    //
    // 第一性原理：为什么这两个按钮出现在**任务行**上，而不是一个"任务管理"页
    //
    //   用户看到某个任务的标题写错了、或者派给了错的人，是在**看进展的时候**
    //   发现的。要他去另一个页面找到同一个任务再改，等于让他丢掉上下文。
    //
    // CAS：按钮携带渲染时的 revision（见 rewriteTask 的注释）——
    //   这期间若成员改过，官方会拒绝，而不是让用户的修改静默覆盖。
    if (t.status !== 'completed') {
      const ops = el('div', { class: 'team-task-ops' });
      const editBtn = el('button', { class: 'task-op', text: '改写' });
      editBtn.addEventListener('click', () => openTaskRewrite(m, t, 'edit'));
      ops.append(editBtn);
      const reassignBtn = el('button', { class: 'task-op', text: '转交' });
      reassignBtn.addEventListener('click', () => openTaskRewrite(m, t, 'reassign'));
      ops.append(reassignBtn);
      row.append(ops);
    }

    // 被阻塞：读 blockedBy，去 tasks 里找**真正阻塞它**的任务
    // blockedBy 同理：官方投影里通常有，但缺省时不该让整块崩。
    const blockedBy = Array.isArray(t.blockedBy) ? t.blockedBy : [];
    if (t.ready === false && blockedBy.length > 0) {
      const blockers = blockedBy.map((id) => byId.get(id)).filter(Boolean);
      const blocked = el('div', { class: 'team-blocked' });
      if (blockers.length === 1) {
        const b = blockers[0];
        blocked.append(el('div', { class: 'team-blocked-line',
          text: '等待：' + (b.subject || b.id)
            + (b.ownerName ? ' · ' + b.ownerName : '')
            + (TASK_STATUS_LABEL[b.status] ? ' · ' + TASK_STATUS_LABEL[b.status] : '') }));
      } else if (blockers.length > 1) {
        blocked.append(el('div', { class: 'team-blocked-line',
          text: '等待 ' + blockers.length + ' 项前置任务' }));
        const ul = el('ul', { class: 'team-blocked-list' });
        for (const b of blockers) {
          ul.append(el('li', {
            text: (b.subject || b.id)
              + (b.ownerName ? ' · ' + b.ownerName : '')
              + (TASK_STATUS_LABEL[b.status] ? ' · ' + TASK_STATUS_LABEL[b.status] : ''),
          }));
        }
        blocked.append(ul);
      }
      // 找不到被引用的任务时如实说，不假装没被阻塞
      if (blockers.length === 0) {
        blocked.append(el('div', { class: 'team-blocked-line',
          text: '被 ' + blockedBy.length + ' 项前置任务阻塞（明细暂时读不到）' }));
      }
      row.append(blocked);
    }

    // writeScopeWarnings：**可能是冲突**，不是"已锁定"
    // 防御：writeScopeWarnings 在某些投影里可能缺省（如队友未启用 team profile）。
    // 直接 .length 会让整块渲染崩掉 —— 而它只是"可能冲突"的提示，
    // 不值得因为一个可选字段让整个右栏白屏。
    const scopeWarns = Array.isArray(t.writeScopeWarnings) ? t.writeScopeWarnings : [];
    if (scopeWarns.length > 0) {
      row.append(el('div', { class: 'team-scope-warn',
        text: '可能存在文件修改范围冲突：' + scopeWarns.join('、') }));
    }

    box.append(row);
  }
  return box;
}

/** 渲染第二层。**中性样式**，不能与第一层抢注意力。 */
function appendReminders(wrap, reminders) {
  if (!reminders || reminders.length === 0) return;
  const box = el('div', { class: 'att-reminders' });
  box.append(el('div', { class: 'att-rem-head', text: '执行提醒 · 不需要你决策' }));
  for (const r of reminders) {
    const row = el('div', { class: 'att-rem', 'data-tone': r.tone || 'info' });
    row.append(el('div', { class: 'att-rem-title', text: r.title }));
    if (r.detail) row.append(el('div', { class: 'att-rem-detail', text: r.detail }));
    box.append(row);
  }
  wrap.append(box);
}

/**
 * 从运行时投影里找这条待办对应的结构化问题。
 *
 * 匹配策略：投影里的 `active[]` 每项有 `callId`，而 office 快照的
 * pending item 有 `id`（也就是 callId）。先按 id 精确匹配；
 * 匹配不到但有**唯一**一个 active 问题时，用它（常见情形：
 * 同一时刻只有一个待回答的问题）。
 *
 * 拿不到就返回 null —— 调用方回落自由文本，**不猜**。
 */
function findStructuredQuestion(item) {
  const p = state.projections;
  if (!p || !p.userQuestionsAvailable || !Array.isArray(p.activeQuestions)) return null;
  const active = p.activeQuestions.filter((x) => x && Array.isArray(x.questions) && x.questions.length > 0);
  const pick = (entry) => {
    const q = entry.questions[0];
    const opts = Array.isArray(q.options)
      ? q.options.filter((o) => o && typeof o.label === 'string' && o.label) : [];
    return {
      question: q.question,
      detail: q.detail || null,
      options: opts,
      multiSelect: q.multiSelect === true,
      intent: q.intent || null,
    };
  };
  const byId = active.find((x) => x.callId && item && item.id && x.callId === item.id);
  if (byId) return pick(byId);
  if (active.length === 1) return pick(active[0]);
  return null;
}

/**
 * 渲染 plan-review 的计划内容（折叠式）。
 *
 * 官方约束（`AskUserQuestionIntent`）：
 *   · `detail` 是计划 markdown
 *   · `approve` 是**批准选项的 label**，且「named rather than positional
 *     so no UI infers the verdict from option order」
 *
 * 所以我们**不按索引猜哪个是批准**——判定完全交给运行时。
 */
function renderPlanReview(struct) {
  const wrap = el('div', { class: 'plan-review' });
  const text = typeof struct.detail === 'string' ? struct.detail : '';

  const head = el('div', { class: 'plan-review-head', text: '计划待审阅' });
  wrap.append(head);

  if (!text.trim()) {
    // 没有 detail 就如实说，不假装有内容可审
    wrap.append(el('div', { class: 'plan-review-empty',
      text: '计划没有附带正文。你可以直接批准/拒绝，或到 Harness 里查看完整计划。' }));
    return wrap;
  }

  // 折叠：默认只显示前 4 行。计划可能几千字，全展开会把侧栏撑爆。
  const PREVIEW_LINES = 4;
  const allLines = text.split('\n');
  const preview = allLines.slice(0, PREVIEW_LINES).join('\n');
  const hasMore = allLines.length > PREVIEW_LINES;

  const pre = el('pre', { class: 'plan-review-body', text: hasMore ? preview : text });
  wrap.append(pre);

  // 后端可能因为体积上限截断过 detail（见 ipc-mission.js 的 MAX_QUESTION_DETAIL_CHARS）。
  // **必须告诉用户**，否则他会以为计划就只有这些内容。
  if (struct.detailTruncated) {
    wrap.append(el('div', { class: 'plan-review-truncated',
      text: '计划正文过长，这里只显示了前 ' + Math.round(text.length / 1024) + 'k 字符'
        + '（原文 ' + Math.round((struct.detailFullLength || text.length) / 1024) + 'k）。'
        + '完整内容请在 Harness 里查看。' }));
  }

  if (hasMore) {
    const more = el('button', { class: 'plan-review-toggle',
      text: '展开全文（还有 ' + (allLines.length - PREVIEW_LINES) + ' 行）' });
    let expanded = false;
    more.addEventListener('click', () => {
      expanded = !expanded;
      pre.textContent = expanded ? text : preview;
      more.textContent = expanded ? '收起' : '展开全文（还有 ' + (allLines.length - PREVIEW_LINES) + ' 行）';
    });
    wrap.append(more);
  }
  return wrap;
}

/**
 * 把用户的选择送回 Harness。失败必须显示原因，不能假装成功。
 *
 * 真实 payload 形状（office-module.js 的 validateOfficeIpcPayload 严格校验键序）：
 *   { action: 'answer', id, value }
 * 我之前猜的 { pendingId, kind, answer } 会被判 PAYLOAD_INVALID。
 */
async function answerPending(item, answer) {
  const r = await window.dshShell.answerPending({ action: 'answer', id: item.id, value: answer });
  if (!r || !r.ok) {
    alert(explainFailure(r || { code: 'UNKNOWN' }));
    return;
  }
  await refresh();
}

// -------------------------------------------------- 离开期间（L2 时间线）
//
// 关键约束：**只从真实事件派生，不调用模型生成摘要。**
// 用户要的是"发生了什么"，不是"模型猜测发生了什么"。

const SINCE_TAG = {
  decision: '决策', question: '提问', answer: '回答',
  workstream: '工作流', 'workstream-status': '工作流', deliverable: '产物', mission: 'Mission',
};

function renderSince() {
  const si = state.since;
  if (!si) return null;

  if (!si.available) {
    // 第一次看这个 Mission → 没有"离开期间"。这是正常状态，不是错误。
    if (si.reason === 'never-seen') return null;
    return null;
  }
  if (!si.entries || si.entries.length === 0) return null;

  const box = el('div', { class: 'tl' });
  const head = el('div', { class: 'tl-head' }, [
    el('span', { text: '你离开期间' }),
  ]);
  if (Number.isFinite(si.sinceMs)) {
    // relativeTime 返回 "3 小时前"，而这里要说"上次看到是 3 小时前"。
    // 直接拼 "之后" 会变成"3 小时前 之后"，语义别扭。
    head.append(el('span', { class: 'tl-when', text: '上次查看：' + relativeTime(si.sinceMs) }));
  }
  box.append(head);

  const ul = el('ul', { class: 'tl-list' });
  for (const e of si.entries) {
    const li = el('li', { 'data-tone': e.tone || 'info' });
    li.append(el('span', { class: 'tl-tag', text: SINCE_TAG[e.kind] || e.kind }));
    li.append(document.createTextNode(e.text || ''));
    ul.append(li);
  }
  box.append(ul);
  if (si.truncated) {
    box.append(el('div', { class: 'tl-more', text: `另有 ${si.dropped} 条更早的变化未显示` }));
  }
  return box;
}

/**
 * 头部：一行标题 + 一个状态徽标 + 一行目标（§6.2 第 1 块）。
 *
 * 第一性原理：为什么状态是**徽标**而不是常驻下拉框
 *
 *   状态切换是低频动作（一个 Mission 从 active 到 completed 通常就一次）。
 *   把它做成常驻下拉框，等于用低频控件占掉首屏一个高频位置；
 *   而浏览器原生 select 在深色界面里是一块白，刺眼。
 *
 *   所以：徽标显示当前状态（一眼看到），点击才展开切换
 *   —— 低频动作收到它该在的层级里。
 */
function renderMissionHead(m, v) {
  const head = el('header', { class: 'mhead' });

  const line1 = el('div', { class: 'mhead-line1' });
  line1.append(el('h2', {
    class: 'mhead-title',
    text: m.title || '(未命名)',
    title: m.title || '',   // 省略号截断时，hover 能看到全文
  }));

  const badge = el('button', {
    class: 'mhead-badge mh-' + (m.status || 'active'),
    text: STATUS_TEXT[m.status] || m.status || '未知',
    title: '点击切换状态',
  });
  const menu = el('div', { class: 'mhead-status-menu' });
  menu.style.display = 'none';
  for (const s of ['active', 'paused', 'completed', 'abandoned']) {
    if (s === m.status) continue;
    const opt = el('button', { class: 'mhead-status-opt', text: STATUS_TEXT[s] || s });
    opt.addEventListener('click', async () => {
      menu.style.display = 'none';
      const r = await api('updateStatus', { missionId: m.missionId, to: s });
      if (!r || !r.ok) { alert(explainFailure(r || { code: 'UNKNOWN' })); return; }
      // 状态字段不能替代刹车：取消失败必须说出来，否则用户以为已经停了。
      if (r.stopped === 'cancel-failed') {
        alert('状态已改为 ' + (STATUS_TEXT[r.status] || r.status) + '，但**未能停止正在执行的会话**。'
          + '它可能还在跑，请到 Harness 视图确认。');
      } else if (r.stopped === 'not-wired') {
        alert('状态已改为 ' + (STATUS_TEXT[r.status] || r.status) + '，但当前环境没接上停止能力。'
          + '如果团队在跑，请到 Harness 视图手动停止。');
      }
      await refresh();
    });
    menu.append(opt);
  }
  // 状态菜单的开关与"点外部关闭"。
  //
  // 第一性原理：为什么用一个标记而不是 document 监听
  //
  //   早期写法 `document.addEventListener('click', () => menu.hidden)` 有两个问题：
  //     ① 每次渲染都新增一个永不清理的监听器（右栏刷新频繁 → 泄漏）
  //     ② 所有旧监听器都去操作已被丢弃的旧 menu 节点
  //   更糟的是它们会抢在真正的选项 handler 之前把菜单关掉，
  //   导致"点了没反应"—— 而这个探针正是发现它的地方。
  //
  //   现在：菜单开关只靠 badge 自己的 click 处理；
  //   "点外部关闭"用一个**每次渲染只注册一次**的 document 监听，
  //   并在里面先判断该事件是否落在菜单内部。
  menu.addEventListener('click', (ev) => ev.stopPropagation());
  badge.addEventListener('click', (ev) => {
    ev.stopPropagation();
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  });
  if (!window.__mheadCloserInstalled) {
    window.__mheadCloserInstalled = true;
    document.addEventListener('click', () => {
      const open = document.querySelectorAll('.mhead-status-menu');
      for (const el2 of open) el2.style.display = 'none';
    });
  }
  line1.append(badge);
  head.append(line1);
  head.append(menu);

  if (m.intent) {
    const intentLine = el('div', { class: 'mhead-intent' });
    intentLine.append(el('span', { class: 'mhead-intent-label', text: '目标' }));
    intentLine.append(el('span', { class: 'mhead-intent-text', text: m.intent }));
    head.append(intentLine);
  }
  return head;
}

// 状态的人话标签。**不直接用 active/paused** ——
// 用户看不懂英文状态词，而"进行中/已暂停"是零学习成本的。
const STATUS_TEXT = {
  active: '进行中',
  paused: '已暂停',
  completed: '已完成',
  abandoned: '已放弃',
};

/**
 * 通用折叠区（§6.2 第 6 块）。
 *
 * 第一性原理：为什么折叠区的**默认状态**是关的，而不是开的
 *
 *   右栏 380px。用户打开它，80% 的时候只想知道三件事：
 *   有什么要我拍板、事情做到哪了、谁在做什么。
 *
 *   而"决策/发现/证据/假设/问题/工作流/产物/Brief" 这些是**查阅型**内容
 *   —— 需要时会去找，不需要时它们只是在挤压首屏。
 *
 *   所以：默认折叠，标题上带数量，需要时展开。
 *   数量很重要：`交付物 · 1` 比 `交付物` 多告诉用户"里面有一件事"，
 *   否则用户没有动机去点开。
 *
 * @param {object} opts
 * @param {string} opts.title
 * @param {number|null} [opts.count]   标题右侧的数量徽标（null = 不显示）
 * @param {Function} opts.render       展开时才调用的渲染函数（懒加载，省首屏开销）
 * @param {boolean} [opts.open]        默认是否展开
 * @returns {HTMLElement}
 */
function collapsibleSection({ title, count = null, render, open = false }) {
  const wrap = el('section', { class: 'coll' });
  const head = el('button', { class: 'coll-head' });

  // 用户上次的展开选择优先于默认值。
  // state.collapsed[title] === true  → 展开
  // state.collapsed[title] === false → 收起
  // undefined                        → 用调用方给的默认值
  const remember = state.collapsed[title];
  const isOpen = remember === undefined ? open : remember;

  const caret = el('span', { class: 'coll-caret', text: isOpen ? '▾' : '▸' });
  head.append(caret);
  head.append(el('span', { class: 'coll-title', text: title }));
  if (Number.isFinite(count) && count > 0) {
    head.append(el('span', { class: 'coll-count', text: String(count) }));
  } else if (Number.isFinite(count)) {
    head.append(el('span', { class: 'coll-count coll-count-zero', text: '0' }));
  }
  wrap.append(head);

  const body = el('div', { class: 'coll-body' });
  // 用 isOpen（用户的记忆优先），不是 open（调用方的默认值）
  body.style.display = isOpen ? 'block' : 'none';
  wrap.append(body);

  let rendered = false;
  const ensure = () => {
    if (rendered) return;
    rendered = true;
    try {
      const out = render();
      if (out) body.append(out);
    } catch (err) {
      // 折叠区里某一块渲染出错，不该让整页崩 —— 这是本轮学到的教训
      body.append(el('div', { class: 'coll-error',
        text: '这块内容渲染失败：' + (err && err.message ? err.message : String(err)) }));
    }
  };

  if (isOpen) ensure();
  head.addEventListener('click', () => {
    const nowOpen = body.style.display !== 'none';
    body.style.display = nowOpen ? 'none' : 'block';
    caret.textContent = nowOpen ? '▸' : '▾';
    // 记住用户的选择，下次刷新（以及下次打开右栏）沿用
    state.collapsed[title] = !nowOpen;
    if (!nowOpen) ensure();
  });
  return wrap;
}

/**
 * 打开任务的改写 / 转交表单（S6）。
 *
 * 第一性原理：为什么表单是**内联展开**而不是弹窗
 *
 *   380px 右栏里弹窗会遮住任务列表 —— 而用户正是看着那个列表才决定要改的。
 *   内联展开保留上下文：他看到原任务、看到新输入框、看到其它任务。
 *
 * CAS 的 UI 侧处理：
 *   把渲染时的 t.revision 一起提交。若期间被成员改过，官方拒绝，
 *   我们如实告诉用户"任务已被改过，请重新查看" —— 不自动重试覆盖。
 */
function openTaskRewrite(m, task, kind) {
  const existing = document.querySelector('.task-rw-form');
  if (existing) existing.remove();

  // 草稿键：同一个任务 + 同一种操作 = 同一份草稿
  const draftKey = `task-rw:${task.id}:${kind}`;
  const saved = state.draft[draftKey] || {};
  // 记住"刷新后要重新打开哪个表单"（见 renderDetail 末尾的 restore 调用）
  state.draftRestore = { kind: 'task-rw', missionId: m.missionId, taskId: task.id, mode: kind };

  const wrap = el('div', { class: 'task-rw-form' });
  wrap.append(el('div', { class: 'task-rw-title',
    text: (kind === 'reassign' ? '转交任务：' : '改写任务：') + (task.subject || task.id) }));

  let subjectInput = null;
  let descInput = null;
  let ownerInput = null;

  // 回填草稿：用户上次填到一半的内容必须回来。
  //
  // keep 用惰性读取（在调用时才查 DOM），所以它可以在所有输入框创建**之前**定义。
  // 这样每个输入框都能在创建时立刻挂上监听，不用管定义顺序。
  const keep = () => {
    state.draft[draftKey] = {
      owner: (wrap.querySelector('.task-rw-owner') || {}).value || '',
      subject: (wrap.querySelector('.task-rw-subject') || {}).value || '',
      description: (wrap.querySelector('.task-rw-desc') || {}).value || '',
      reason: (wrap.querySelector('.task-rw-why') || {}).value || '',
    };
  };
  // 除了 input 事件，再在失焦/刷新前抓一次。
  // 为什么：程序化赋值（.value = 'x'）不会触发 input 事件，
  // 而某些场景（浏览器自动填充、IME 组合输入结束）也可能漏掉。
  // 用捕获阶段监听更稳：任何 input/change 都会冒泡到 wrap。
  wrap.addEventListener('input', keep, true);
  wrap.addEventListener('change', keep, true);

  if (kind === 'reassign') {
    ownerInput = el('input', { class: 'task-rw-input task-rw-owner', placeholder: '新负责人（成员名）', value: saved.owner || '' });
    ownerInput.addEventListener('input', keep);
    wrap.append(ownerInput);
  } else {
    subjectInput = el('input', { class: 'task-rw-input task-rw-subject', value: saved.subject || task.subject || '', placeholder: '新标题' });
    subjectInput.addEventListener('input', keep);
    descInput = el('textarea', { class: 'task-rw-input task-rw-desc', rows: '2',
      placeholder: '新描述（可留空，留空则只改标题）' });
    descInput.value = saved.description || '';
    descInput.addEventListener('input', keep);
    wrap.append(subjectInput, descInput);
  }
  const why = el('input', { class: 'task-rw-input task-rw-why', placeholder: '原因（可选）', value: saved.reason || '' });
  why.addEventListener('input', keep);
  wrap.append(why);

  const row = el('div', { class: 'task-rw-actions' });
  const send = el('button', { class: 'task-op', text: '请 Lead 执行' });
  const cancel = el('button', { class: 'task-op', text: '取消' });
  row.append(send, cancel);
  wrap.append(row);
  const msg = el('div', { class: 'task-rw-msg' });
  wrap.append(msg);

  cancel.addEventListener('click', () => wrap.remove());
  send.addEventListener('click', async () => {
    send.disabled = true;
    let r;
    try {
      r = await api('rewriteTask', {
        missionId: m.missionId,
        kind,
        taskId: task.id,
        // CAS：带上渲染时的 revision。过期就让官方拒绝，不自动重试。
        expectedRevision: Number.isFinite(task.revision) ? task.revision : undefined,
        subject: subjectInput ? subjectInput.value.trim() : undefined,
        description: descInput ? descInput.value.trim() : undefined,
        owner: ownerInput ? ownerInput.value.trim() : undefined,
        reason: why.value.trim() || undefined,
      });
    } catch (e) { r = { ok: false, reason: e.message }; }
    send.disabled = false;
    if (!r || !r.ok) {
      msg.textContent = '未发出：' + ((r && r.reason) || '未知原因');
      msg.classList.add('err');
      return;
    }
    msg.textContent = r.note || '已下达。';
    msg.classList.add('ok');
    if (typeof refresh === 'function') await refresh();
  });

  const host = document.querySelector('#detail');
  if (host) host.append(wrap);
  if (subjectInput) subjectInput.focus(); else if (ownerInput) ownerInput.focus();
}

/**
 * 合同 ↔ 团队任务板对账（S3 中不依赖架构切换的部分）。
 *
 * 第一性原理：为什么只陈述差异、不判定对错
 *
 *   验收条件是否"已被覆盖"需要语义理解，而底层只能做**字面匹配**。
 *   假装能判定对错会误导用户 —— 他可能因此停止检查一件其实没做的事。
 *
 *   所以文案一律是"X 条没有对应任务"，而不是"X 条没做"。
 */
function renderTeamReconcile() {
  const ws = state.workStatus;
  const r = ws && ws.teamReconcile;
  if (!r) return null;
  // 读不到投影：明说是读不到，不是"没有任务"
  if (!r.available) {
    if (!r.reason) return null;
    const warn = el('div', { class: 'rec-warn', text: '无法核对承诺与实际：' + r.reason });
    return warn;
  }
  // 合同没有验收条件时，这块没有对比基准，不显示（噪音）
  if (!r.acceptance || r.acceptance.total === 0) return null;

  const box = el('section', { class: 'rec' });
  const head = el('div', { class: 'rec-head' });
  head.append(el('span', { text: '承诺与实际' }));
  const okCount = r.acceptance.covered;
  const totalCount = r.acceptance.total;
  head.append(el('span', {
    class: 'rec-count' + (r.acceptance.missing.length ? ' rec-count-warn' : ''),
    text: `${okCount}/${totalCount}`,
  }));
  box.append(head);

  for (const a of r.acceptance.missing) {
    const row = el('div', { class: 'rec-row rec-row-missing' });
    row.append(el('span', { class: 'rec-mark', text: '○' }));
    row.append(el('span', { class: 'rec-text', text: a.text }));
    row.append(el('span', { class: 'rec-tag', text: '无对应任务' }));
    box.append(row);
  }

  if (r.orphanTasks && r.orphanTasks.length > 0) {
    box.append(el('div', { class: 'rec-sub', text: '不在合同验收里的任务' }));
    for (const t2 of r.orphanTasks.slice(0, 5)) {
      const row = el('div', { class: 'rec-row' });
      row.append(el('span', { class: 'rec-mark', text: '·' }));
      row.append(el('span', { class: 'rec-text', text: t2.subject || t2.id }));
      row.append(el('span', { class: 'rec-tag', text: TASK_STATUS_LABEL[t2.status] || t2.status }));
      box.append(row);
    }
  }
  return box;
}

function renderDetail() {
  const box = $('detail');
  box.textContent = '';
  box.className = '';
  if (!state.detail) {
    box.className = 'empty';
    // 详情数据坏了（不是"没选 Mission"，也不是"一个都没有"）——
    // 三者必须分开说，否则用户会去做完全无用的事。
    if (state.detailBroken) {
      box.append(el('div', { class: 'empty-lead', text: '这个 Mission 的详情读不出来' }));
      box.append(el('div', { class: 'empty-body',
        text: '数据可能损坏，或者某个字段格式不对。刷新页面或到 Harness 视图查看执行过程。'
          + '（技术细节：' + state.detailBroken + '）' }));
      return;
    }
    // 分两种情况给不同的路标，否则用户会卡在一个无解的指令上。
    //
    // ⚠️ 文案必须**按当前布局**说（2026-11-04 修正）：
    //   早期写的是"先在左边创建" / "从左侧列表点一个" ——
    //   但 dock 模式（右栏 380px）是**单栏**，根本没有左边。
    //   新用户第一眼看到的就是这句，而它指向一个不存在的地方。
    //   现在按 DOCK_MODE 给不同的路标，并直接说出**可点的那一个**。
    if (state.missions.length === 0) {
      // 这句必须与下面的"选择一个 Mission"区分开：
      // 一个是"一个都没有"，一个是"有但没选"，用户需要的下一步完全不同。
      box.append(el('div', { class: 'empty-lead', text: '还没有选中任何 Mission' }));
      box.append(el('div', { class: 'empty-body',
        text: DOCK_MODE
          ? '点上面的「新建 Mission」创建第一个。创建后，你会在这里看到目标、进展和需要你决定的事。'
          : '点左上角的「新建 Mission」创建第一个，或从左侧列表里选一个已有的。' }));
    } else {
      box.append(el('div', { class: 'empty-lead', text: '选择一个 Mission' }));
      box.append(el('div', { class: 'empty-body',
        text: DOCK_MODE
          ? '用上面的下拉框选一个 Mission，就能看到它的目标、进展和需要你决定的事。'
          : '从左侧列表点一个，就能看到它的目标、决策、工作流和产物。' }));
    }
    return;
  }
  const v = state.detail;
  const m = v.mission;

  // 整体兜底：任何**顶层区块**渲染失败，不能让后面全部消失。
  //
  // 第一性原理：第 16 轮踩过的坑
  //   `team.writeScopeWarnings` 缺省时被裸读 `.length`，抛 TypeError →
  //   renderTeamTasks 之后的**整段右栏都不渲染**。
  //   表现是"右栏莫名少了一大半"，控制台之外没有任何提示 —— 比报错更迷惑。
  //
  //   折叠区内部已有局部容错（coll-error），但顶层区块（头部/需要你/进展/
  //   团队成员/对账）没有。一个抛错就吃掉了它后面的所有内容。
  //
  //   这里做的是**最后一个安全网**：逐块渲染，谁出错就换成一行提示，
  //   其余照常。用户看到的是"某一块坏了"，不是"整个右栏空了"。
  const safe = (name, fn) => {
    try {
      const out = fn();
      if (out) box.append(out);
    } catch (err) {
      box.append(el('div', { class: 'block-error',
        text: '「' + name + '」这块没能显示：' + (err && err.message ? err.message : String(err))
          + '（其余部分不受影响）' }));
      // 同时留一条控制台日志，方便排查
      // eslint-disable-next-line no-console
      console.error('[desk] block render failed:', name, err);
    }
  };

  // --- 头部：标题 + 状态 + 目标（§6.2 第 1 块）---
  //
  // 第一性原理：为什么头部必须置顶，且只放三样东西
  //
  //   右栏 380px。用户每次看它，第一个问题都是"这是哪个 Mission、它现在怎么样、
  //   它要完成什么"。这三件事必须在**第一眼**答完。
  //
  //   原实现把头部放在最下面（在"需要你"、"交给团队"、"团队任务"之后），
  //   于是首屏看不到"我在看哪个 Mission"——这正是用户抱怨的开头。
  safe('头部', () => renderMissionHead(m, v));

  // --- L1：需要你处理（最高优先级，永远置顶）---
  //
  // 注意 renderAttention 现在消费后端 rail-order 的分层结果（见该函数注释），
  // 前端不再自己判断"哪些算需要你" —— 两处各自判断会漂移。
  safe('需要你处理', () => renderAttention());

  // --- L2：你离开期间发生了什么 ---
  const sinceBlock = renderSince();
  if (sinceBlock) box.append(sinceBlock);

  // ================================================================
  // 「交给团队」—— 这是整个 Mission Desk 最重要的入口
  //
  // 第一性原理：用户创建 Mission 后**无事可做**，因为 Mission 只能
  // 记录工作、不能启动工作。这一块补上那个缺失的环节。
  //
  // 放在最顶部而不是底部：它是"下一步做什么"的答案，
  // 不该藏在十几屏表单之后。
  // ================================================================
  safe('交代任务', () => renderStartWork(m));


  // --- 团队任务（只有启用 team 投影时才显示）---
  const teamBlock = renderTeamTasks(m);
  if (teamBlock) box.append(teamBlock);

  // --- 合同 ↔ 任务板对账（只有两边都有数据时才有意义）---
  //
  // 第一性原理：这一块回答的是"团队做的事，和你要它做的事，对得上吗"。
  //
  //   上面那块说"团队有 3 个任务在跑"，听起来很努力。
  //   但如果合同要求 3 条验收、任务板只有 1 条对应 ——
  //   团队在忙，只是忙的不是你要的东西。而这个差异**没有任何一处会告诉你**。
  const recBlock = renderTeamReconcile();
  if (recBlock) box.append(recBlock);


  // --- 实时（Harness 的事实）---
  const live = v.live || {};
  const liveBlock = el('div', {});
  if (live.available) {
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '观察到 ' + relativeTime(live.observedAtMs) + '（' + new Date(live.observedAtMs).toLocaleTimeString() + '）',
    }));
    liveBlock.append(el('div', {
      class: 'tiny',
      text: 'Agent 在跑：' + (live.hasRunningAgent ? '是' : '否')
        + ' · 待审批 ' + live.pendingApprovals
        + ' · 待回答 ' + live.pendingQuestions,
    }));
    liveBlock.append(el('div', {
      class: 'tiny muted',
      // 保留"不会撒谎"这个**用户利益**，去掉"Harness/只读不写"这个**实现细节**。
      text: '这些数字直接来自运行时，我们不缓存、不推测，重启后也不会编造。',
    }));
  } else {
    liveBlock.append(el('div', {
      class: 'tiny muted',
      text: '实时状态不可用——没有 Harness 快照。这不代表"没有在跑"，只代表我们现在读不到。',
    }));
  }
  // 术语修正（§6.1）：原来写"实时状态（Harness 拥有，只读）"——
  // "Harness 拥有"是架构术语，用户不知道 Harness 是什么，更不关心谁拥有它。
  // 他只想确认"这数字是真的吗"。所以标题说"现在的运行情况"，
  // 真实性由下面那句人话解释。
  box.append(el('h3', { text: '现在的运行情况' }), liveBlock);

  // --- 目标 ---
  //
  // 第一性原理：Desk 是编辑器，不是只读报表。
  // 标题/目标写错了却改不了，用户唯一的办法是删掉重建——
  // 而 Mission 的事实链是不可删的。所以"能改"不是锦上添花，是**纠错能力**。
  //
  // 边界：这里**不提供**改 status 的入口。状态变更是独立事实，
  // 必须走 updateStatus（顶部选择器），不能混进 update 的 patch。
  // 注意：这里不是「目标」的展示（那在头部），而是**编辑入口**。
  // 标题必须区分开，否则用户会以为页面上有两个目标。
  box.append(el('h2', { text: '编辑标题与目标' }));
  {
    const wrap = el('div', { class: 'row', style: 'gap:6px;align-items:flex-start' });
    const view = el('div', { text: m.intent || '（未填写）', style: 'flex:1' });
    const editBtn = el('button', { text: '改', class: 'tiny' });
    const editor = el('div', { style: 'flex-basis:100%;display:none;gap:6px;flex-wrap:wrap' });
    const titleInput = el('input', { placeholder: 'Mission 标题', style: 'flex:1;min-width:160px', value: m.title || '' });
    const intentInput = el('input', { placeholder: '目标（你的原话）', style: 'flex:2;min-width:200px', value: m.intent || '' });
    const saveBtn = el('button', { text: '保存' });
    const cancelBtn = el('button', { text: '取消' });
    const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });

    editBtn.addEventListener('click', () => {
      editor.style.display = 'flex';
      editBtn.style.display = 'none';
    });
    cancelBtn.addEventListener('click', () => {
      editor.style.display = 'none';
      editBtn.style.display = '';
      msg.textContent = '';
    });
    saveBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const patch = { missionId: m.missionId };
      if (titleInput.value.trim() && titleInput.value.trim() !== (m.title || '')) patch.title = titleInput.value.trim();
      if (intentInput.value.trim() !== (m.intent || '')) patch.intent = intentInput.value.trim();
      if (Object.keys(patch).length === 1) { msg.textContent = '没有改动'; return; }
      saveBtn.disabled = true;
      let r;
      try { r = await api('update', patch); }
      catch (e) { r = { ok: false, reason: e.message }; }
      saveBtn.disabled = false;
      if (r && r.ok) { editor.style.display = 'none'; editBtn.style.display = ''; await refresh(); }
      else { msg.textContent = explainFailure(r); }
    });

    editor.append(titleInput, intentInput, saveBtn, cancelBtn, msg);
    wrap.append(view, editBtn, editor);
    box.append(wrap);
  }

  // --- 边界 ---
  box.append(el('h2', { text: '边界' }));
  if (!m.constraints || m.constraints.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '未声明边界。' }));
  } else {
    const ul = el('ul', {});
    for (const c of m.constraints) {
      ul.append(el('li', { text: c.text + (c.source === 'model' ? '（模型建议）' : '') }));
    }
    box.append(ul);
  }

  // --- 决策 ---
  safe('决策', () => renderDecisions(v.decisions || [], m));

  // ================================================================
  // Shared Context：发现 / 假设 / 证据（2026-11-01）
  //
  // 为什么这三块比"决策"更重要：
  //   决策只记"决定了什么"，记不住"为什么这么决定"。
  //     · Finding    = 我们发现的事实  → 团队积累的实体
  //     · Assumption = 暂时采用的判断  → 未来会爆的地雷
  //     · Evidence   = 凭什么相信      → 可信度的来源
  // ================================================================

  // 发现 / 假设 / 证据 —— 三者结构同构（状态徽章 + 正文 + 元信息 + 状态推进入口），
  // 所以走同一个声明式渲染器。这消除了三份几乎相同的 80 行代码，
  // 也让"再加一类实体"变成加一条配置，而不是复制 80 行。
  box.append(collapsibleSection({
    title: '发现',
    count: null,
    render: () => renderEntitySection({
    title: '发现',
    hint: '还没有记录发现。发现是"我们确认了 X 成立"，与决策（我们选择了 A）不同。',
    items: v.findings || [],
    idKey: 'findingId',
    labelMap: FINDING_LABEL,
    badgeClass: (it) => 'sc-badge st-finding-' + it.status,
    body: (it) => it.text,
    meta: (it) => {
      const out = ['置信 ' + (CONF_LABEL[it.confidence] || it.confidence)];
      if (Number.isFinite(it.foundAtMs)) out.push(relativeTime(it.foundAtMs));
      if ((it.evidenceIds || []).length) out.push(it.evidenceIds.length + ' 条证据');
      return out.join(' · ');
    },
    transitions: [
      { to: 'verified', label: '已验证', hideWhen: (it) => it.status === 'verified' || it.status === 'refuted' },
      { to: 'refuted', label: '已推翻', hideWhen: (it) => it.status === 'refuted' },
    ],
    apiAction: 'updateFindingStatus',
    form: 'finding',
    }),
  }));

  box.append(collapsibleSection({
    title: '假设',
    count: null,
    render: () => renderEntitySection({
    title: '假设',
    hint: '还没有记录假设。假设是"我们暂时这么认为，但还没验证"——它是最容易在三天后爆炸的东西。',
    items: v.assumptions || [],
    idKey: 'assumptionId',
    labelMap: ASSUMPTION_LABEL,
    badgeClass: (it) => 'sc-badge st-assumption-' + it.status,
    body: (it) => it.text,
    meta: (it) => {
      const out = ['置信 ' + (CONF_LABEL[it.confidence] || it.confidence)];
      if (Number.isFinite(it.madeAtMs)) out.push(relativeTime(it.madeAtMs));
      return out.join(' · ');
    },
    transitions: [
      { to: 'holding', label: '仍成立', hideWhen: (it) => it.status === 'holding' },
      { to: 'violated', label: '已推翻', hideWhen: (it) => it.status === 'violated' },
      { to: 'expired', label: '已过期', hideWhen: (it) => it.status === 'expired' },
    ],
    apiAction: 'updateAssumptionStatus',
    form: 'assumption',
    }),
  }));

  box.append(collapsibleSection({
    title: '证据',
    count: null,
    render: () => renderEntitySection({
    title: '证据',
    hint: '还没有证据。证据是"凭什么相信这个结论"——只存引用，不存内容。',
    items: v.evidences || [],
    idKey: 'evidenceId',
    labelMap: EVIDENCE_LABEL,
    badgeClass: () => 'sc-badge sc-badge-kind',
    badgeText: (it) => EVIDENCE_LABEL[it.kind] || it.kind,
    body: (it) => it.ref,
    bodyClass: 'sc-text sc-mono',
    meta: (it) => '支持：' + it.claim,
    transitions: [],
    form: 'evidence',
    }),
  }));

  // ================================================================
  // 折叠区（§6.2 第 6 块）
  //
  // 第一性原理：从这里往下的内容都是**查阅型**的。
  //
  //   用户打开右栏，80% 的时候只想知道三件事：要我拍板什么、事情做到哪了、
  //   谁在做什么。这三件事在上面已经答完了。
  //
  //   而"决策/发现/证据/假设/问题/工作流/产物/Brief/审计"是查阅型的
  //   —— 需要时会去找，不需要时只是在挤压首屏。
  //
  //   所以统一收进折叠区，标题带数量（`交付物 · 1` 比 `交付物` 多告诉
  //   用户"里面有事"），需要时点开。内容懒渲染：不点开就不构造 DOM。
  // ================================================================

  // 未决问题留在明面上：它和"需要你"是同一类事（悬而未决）。
  const qCount = Array.isArray(v.questions) ? v.questions.length : 0;
  box.append(collapsibleSection({
    title: '未决问题',
    count: qCount,
    open: qCount > 0,     // 有问题就应该被看见，不藏
    render: () => renderOpenQuestions(v.questions || [], m),
  }));

  const wsCount = Array.isArray(v.workstreams) ? v.workstreams.length : 0;
  box.append(collapsibleSection({
    title: '工作流',
    count: wsCount,
    render: () => renderWorkstreams(v, m),
  }));

  const trCount = Array.isArray(v.taskRefs) ? v.taskRefs.length : 0;
  box.append(collapsibleSection({
    title: '关联执行',
    count: trCount,
    render: () => renderTaskRefs(v, m),
  }));

  const dlCount = Array.isArray(v.deliverables) ? v.deliverables.length : 0;
  box.append(collapsibleSection({
    title: '交付物',
    count: dlCount,
    render: () => renderDeliverables(v, m),
  }));

  safe('授权目录', () => renderGrants());

  box.append(collapsibleSection({
    title: 'Brief 与诊断',
    count: null,
    render: () => renderBriefAndDiagnostics(v, m),
  }));

  // 团队成员留在明面上（不在折叠区）：它是"谁在做什么"，
  // 属于用户三大问题之一，不该藏起来。
  safe('团队成员', () => renderTeamMembers(m));

  box.append(collapsibleSection({
    title: '最近的干预',
    count: null,
    render: () => renderInterventionHistory(m),
  }));

  // ---- 恢复刷新前打开的内联表单（草稿保护）----
  //
  // 第一性原理：refresh() 重建 DOM 会关掉用户正在填的表单。
  //   如果已经把内容打进输入框，那一瞬间会**全丢**，而且没有任何提示。
  //   这是数据丢失，比"要多点一次"严重得多 —— 用户会开始不信任界面。
  //
  //   所以：打开表单时记下"是哪个表单"，渲染完成后重新打开它，
  //   输入框的值从 state.draft 回填。
  //
  //   只在**同一个 Mission** 内恢复：切到别的 Mission 还强行打开一个
  //   属于旧 Mission 的表单是没有意义的。
  const rs = state.draftRestore;
  if (rs && rs.missionId === m.missionId) {
    if (rs.kind === 'task-rw') {
      const proj = state.projections;
      const team = proj && proj.agentTeam;
      const tasks = team && Array.isArray(team.tasks) ? team.tasks : [];
      const task = tasks.find((x) => x && x.id === rs.taskId);
      if (task) openTaskRewrite(m, task, rs.mode);
    }
  }
}

/**
 * 授权（Grant）面板 —— D10。
 *
 * 第一性原理：为什么这个面板必须存在，且必须显示目录
 *
 *   用户要敢离开屏幕，前提是能回答"这个团队被允许访问哪些目录"。
 *   如果只有一条 Grant 而界面上什么也不显示，那句"我已授权"就只是记忆，
 *   而记忆会在十分钟后消失。
 *
 *   所以这里显示每条的**目录与权限与状态**，撤销也在这里。
 *
 * 但默认折叠：授权是低频动作（建一次用很久），
 * 常驻会挤掉首屏的"需要你 / 进展"。
 */
function renderGrants() {
  const body = el('div', {});
  let loaded = false;

  const load = async () => {
    loaded = true;
    body.textContent = '';
    let r;
    try { r = await api('listGrants'); } catch (e) { r = { ok: false, reason: e.message }; }
    if (!r || !r.ok) {
      body.append(el('div', { class: 'grant-empty', text: '读取授权失败：' + ((r && r.reason) || '未知原因') }));
      return;
    }
    if (r.degraded) {
      body.append(el('div', { class: 'grant-warn',
        text: '部分授权记录无法读取：' + (r.degraded.reason || '格式异常') }));
    }
    if (!r.grants || r.grants.length === 0) {
      body.append(el('div', { class: 'grant-empty',
        text: '还没有授权任何目录。派发前需要先授权一个目录。' }));
    } else {
      for (const g of r.grants) {
        const row = el('div', { class: 'grant-row' + (g.active ? '' : ' grant-row-off') });
        const line = el('div', { class: 'grant-line' });
        line.append(el('span', { class: 'grant-dir', text: g.workspaceDir, title: g.workspaceDir }));
        line.append(el('span', { class: 'grant-access', text: g.access === 'write' ? '读写' : '只读' }));
        if (!g.active) line.append(el('span', { class: 'grant-status', text: '已撤销' }));
        row.append(line);

        if (g.active) {
          const ops = el('div', { class: 'grant-ops' });
          const revoke = el('button', { class: 'task-op', text: '撤销授权' });
          revoke.addEventListener('click', async () => {
            // 撤销是安全动作，必须确认 —— 误点会让正在跑的任务失去授权
            if (!confirm('撤销后，派发到这个目录会被拒绝。确定撤销？')) return;
            revoke.disabled = true;
            let rr;
            try { rr = await api('revokeGrant', { grantId: g.grantId }); }
            catch (e) { rr = { ok: false, reason: e.message }; }
            revoke.disabled = false;
            if (!rr || !rr.ok) { alert('撤销失败：' + ((rr && rr.reason) || '未知原因')); return; }
            await load();
          });
          ops.append(revoke);
          row.append(ops);
        }
        body.append(row);
      }
    }

    // 新建授权：子目录用相对路径（D9：必须位于工作区根之内）
    const form = el('div', { class: 'grant-form' });
    form.append(el('div', { class: 'grant-form-title', text: '授权一个目录' }));
    const sub = el('input', { class: 'task-rw-input',
      placeholder: '子目录（留空 = 工作区根）。例如 work/feature-x' });
    const accessSel = el('select', { class: 'grant-access-sel' });
    for (const [v, label] of [['read', '只读'], ['write', '读写']]) {
      const o = el('option', { value: v, text: label });
      accessSel.append(o);
    }
    const createBtn = el('button', { class: 'task-op', text: '创建授权' });
    const msg = el('div', { class: 'task-rw-msg' });
    createBtn.addEventListener('click', async () => {
      createBtn.disabled = true;
      let cr;
      try {
        cr = await api('createGrant', {
          subdir: sub.value.trim() || undefined,
          access: accessSel.value,
        });
      } catch (e) { cr = { ok: false, reason: e.message }; }
      createBtn.disabled = false;
      if (!cr || !cr.ok) {
        msg.textContent = '创建失败：' + ((cr && cr.reason) || '未知原因');
        msg.className = 'task-rw-msg err';
        return;
      }
      msg.textContent = cr.reused ? '这个目录已有相同授权，未重复创建。' : '已授权。';
      msg.className = 'task-rw-msg ok';
      await load();
    });
    form.append(sub, accessSel, createBtn, msg);
    body.append(form);
  };

  return collapsibleSection({
    title: '授权目录',
    count: null,
    render: () => { load(); return body; },
  });
}

/**
 * 团队成员名册 + 干预操作（S6）。
 *
 * 第一性原理：为什么名册必须带操作，而不是只列名字
 *
 *   右栏放一个"只读的成员列表"是没有价值的 —— office 里已经能看到成员在走动。
 *   名册在这里的唯一意义是：**让我能对某个人做点什么**
 *   （叫它停下、给它补一句话）。
 *
 * 诚实约束（来自 S0 实测 D11）：
 *   我们没有对成员直连的写表面，干预指令要经 Lead 转达。
 *   所以按钮文案写"请 Lead 转达"，并在成功后明确说
 *   "指令已发出，不代表对方已处理" —— 不假装是直连。
 */
function renderTeamMembers(m) {
  const proj = state.projections;
  const team = proj && proj.agentTeam;
  if (!team) return el('div', { class: 'members-empty', text: '' });

  const members = Array.isArray(team.members) ? team.members : [];
  if (members.length === 0) return el('div', { class: 'members-empty', text: '' });

  const box = el('section', { class: 'entity-section members-section' });
  const head = el('div', { class: 'entity-head' });
  head.append(el('h3', { text: '团队成员' }));
  head.append(el('span', { class: 'members-count', text: String(members.length) }));
  box.append(head);

  for (const mem of members) {
    const row = el('div', { class: 'member-row' });

    const line = el('div', { class: 'member-line' });
    line.append(el('span', { class: 'member-name', text: mem.name || mem.id }));
    // phase 是**生命周期**（provisioning/active/failed），不是"在不在跑"。
    // 不能把它显示成"工作中"——那是在 phase 上编造 turn 级事实。
    line.append(el('span', {
      class: 'member-phase',
      'data-phase': mem.phase || 'active',
      text: PHASE_LABEL[mem.phase] || mem.phase || 'active',
    }));
    if (mem.role === 'lead') line.append(el('span', { class: 'member-role', text: 'Lead' }));
    row.append(line);

    // 干预操作：只对非 lead 成员显示（对 Lead 的"中断"没有意义，
    // 它自己就是执行入口；要停整支团队用状态切换）
    if (mem.role !== 'lead' && mem.name) {
      const ops = el('div', { class: 'member-ops' });

      const msgBtn = el('button', { class: 'member-op', text: '转达消息' });
      msgBtn.addEventListener('click', () => openMemberMessage(m, mem.name));
      ops.append(msgBtn);

      const stopBtn = el('button', { class: 'member-op danger', text: '中断它' });
      stopBtn.addEventListener('click', () => interruptMember(m, mem.name, stopBtn));
      ops.append(stopBtn);

      row.append(ops);
    }
    box.append(row);
  }
  return box;
}

const PHASE_LABEL = {
  active: '在册',
  provisioning: '创建中',
  failed: '创建失败',
};

/** 打开一个小的"转达消息"表单（内联，不弹窗——右栏内弹窗会遮住上下文）。 */
function openMemberMessage(m, memberName) {
  const existing = document.querySelector('.member-msg-form');
  if (existing) existing.remove();

  const form = el('div', { class: 'member-msg-form' });
  form.append(el('div', { class: 'member-msg-title', text: '转达给 ' + memberName }));
  const input = el('textarea', { class: 'member-msg-input', rows: '3',
    placeholder: '要转达的原话（会原样发给 Lead，由它转达）' });
  form.append(input);
  const why = el('input', { class: 'member-msg-why', placeholder: '原因（可选，如：它跑偏了）' });
  form.append(why);
  const row = el('div', { class: 'member-msg-actions' });
  const send = el('button', { class: 'member-op', text: '请 Lead 转达' });
  const cancel = el('button', { class: 'member-op', text: '取消' });
  row.append(send, cancel);
  form.append(row);
  const msg = el('div', { class: 'member-msg-result' });
  form.append(msg);
  cancel.addEventListener('click', () => form.remove());
  send.addEventListener('click', async () => {
    const text = input.value.trim();
    if (!text) { msg.textContent = '消息不能为空。'; msg.classList.add('err'); return; }
    send.disabled = true;
    let r;
    try {
      r = await api('interveneMember', {
        missionId: m.missionId, kind: 'message', memberName,
        message: text, reason: why.value.trim() || undefined,
      });
    } catch (e) { r = { ok: false, reason: e.message }; }
    send.disabled = false;
    if (!r || !r.ok) {
      msg.textContent = '未发出：' + ((r && r.reason) || '未知原因');
      msg.classList.add('err');
      return;
    }
    msg.textContent = r.note || '已下达。';
    msg.classList.add('ok');
    input.value = '';
    if (typeof refresh === 'function') await refresh();
  });
  // 用 section 包一层便于定位
  const wrap = el('div', { class: 'entity-section member-msg-wrap' });
  wrap.append(form);
  const host = document.querySelector('#detail');
  if (host) host.append(wrap);
}

/** 中断某成员（经 Lead）。成功后如实说明"不代表已经停下"，并观测几秒。 */
async function interruptMember(m, memberName, btn) {
  btn.disabled = true;
  let r;
  try {
    r = await api('interveneMember', {
      missionId: m.missionId, kind: 'interrupt', memberName,
    });
  } catch (e) { r = { ok: false, reason: e.message }; }
  btn.disabled = false;
  if (!r || !r.ok) { alert('未发出：' + ((r && r.reason) || '未知原因')); return; }
  alert(r.note || '已下达。');

  // 观测：几秒后重拍任务快照，看它还在不在动（S6）。
  //
  // 第一性原理：为什么不直接报"已中断"
  //   官方 interrupt_agent 不改变 phase，"它停了吗"协议层没有答案。
  //   能拿到的只有"任务 revision 还在变吗"。而这个信号只能支持
  //   "确定还在动" 或 "看起来停了"，**不支持"已停止"**。
  //
  //   延迟 5 秒是有意的：立刻检查几乎必然显示"还在动"（指令还没被处理完）。
  if (r.beforeSnapshot) {
    setTimeout(async () => {
      let o;
      try {
        o = await api('observeIntervention', {
          missionId: m.missionId, memberName, before: r.beforeSnapshot,
        });
      } catch (e) { o = null; }
      if (!o || !o.ok) return;
      // 只在"看起来停了"或"还在动"时提示；unknown 不打扰用户
      if (o.state === 'quiet' || o.state === 'still-moving') {
        alert(o.description);
      }
    }, 5000);
  }
  if (typeof refresh === 'function') await refresh();
}

/**
 * 「最近的干预」——回答"刚才我做了什么"。
 *
 * 第一性原理：干预是产品里权力最不对称的动作（点一下停掉整支团队）。
 * 没有这块，用户过十分钟就记不清自己停过什么、为什么停。
 *
 * 隐私：只显示闭集文案（"暂停了团队" / "中断了成员 xyz"），
 * 绝不显示任务正文或消息内容 —— 审计本身不能成为泄露面。
 */
function renderInterventionHistory(m) {
  const box = el('section', { class: 'entity-section' });
  const head = el('div', { class: 'entity-head' });
  head.append(el('h3', { text: '最近的干预' }));
  box.append(head);

  const list = el('div', { class: 'iv-list' });
  box.append(list);
  let loaded = false;

  const load = async () => {
    if (loaded) return;
    loaded = true;
    list.textContent = '';
    let r;
    try {
      r = await api('interventionHistory', { missionId: m.missionId, limit: 10 });
    } catch (e) {
      r = { ok: false, reason: e.message };
    }
    if (!r || !r.ok) {
      list.append(el('div', { class: 'entity-empty', text: '读取干预记录失败：' + ((r && r.reason) || '未知原因') }));
      return;
    }
    if (!r.entries || r.entries.length === 0) {
      list.append(el('div', { class: 'entity-empty', text: '这个 Mission 还没有干预记录。' }));
      return;
    }
    for (const e of r.entries) {
      const row = el('div', { class: 'iv-row' });
      row.append(el('span', { class: 'iv-desc', text: e.description || e.action }));
      const meta = [];
      if (Number.isFinite(e.atMs)) meta.push(relativeTime(e.atMs));
      if (e.reason) meta.push(e.reason);
      if (meta.length) row.append(el('span', { class: 'iv-meta', text: meta.join(' · ') }));
      list.append(row);
    }
  };

  // 折叠加载：默认收起，展开时才请求（右栏首屏被这一块挤掉不值得）
  const toggle = el('button', { class: 'iv-toggle', text: '展开' });
  toggle.addEventListener('click', async () => {
    const open = toggle.textContent === '收起';
    toggle.textContent = open ? '展开' : '收起';
    list.style.display = open ? 'none' : 'block';
    if (!open) await load();
  });
  list.style.display = 'none';
  head.append(toggle);
  return box;
}

// ------------------------------------------------------------------ 数据

/**
 * 刷新前抓一次草稿。
 *
 * 为什么需要主动抓：用户可能刚打完字、还没来得及触发 input 事件
 * （或者用的是程序化赋值），然后点了一个会刷新页面的按钮。
 * 在 refresh 的最开始主动读一次所有已打开表单的值，最稳。
 */
function captureOpenDrafts() {
  // 任务改写表单
  const rw = document.querySelector('.task-rw-form');
  if (rw && state.draftRestore && state.draftRestore.kind === 'task-rw') {
    const key = `task-rw:${state.draftRestore.taskId}:${state.draftRestore.mode}`;
    state.draft[key] = {
      owner: (rw.querySelector('.task-rw-owner') || {}).value || '',
      subject: (rw.querySelector('.task-rw-subject') || {}).value || '',
      description: (rw.querySelector('.task-rw-desc') || {}).value || '',
      reason: (rw.querySelector('.task-rw-why') || {}).value || '',
    };
  }
}

async function refresh() {
  captureOpenDrafts();
  const list = await api('list');
  if (!list.ok) {
    $('list').textContent = '';
    $('list').append(el('div', { class: 'empty', text: '无法读取 Mission：' + list.reason }));
    return;
  }
  state.missions = list.missions || [];
  if (state.selectedId && !state.missions.some((m) => m.missionId === state.selectedId)) {
    state.selectedId = null;
  }
  // dock 模式：没有选中时自动选第一个——右栏应该"打开就有内容"，
  // 不该要求用户先点一下才看到东西。
  if (DOCK_MODE && !state.selectedId && state.missions.length > 0) {
    state.selectedId = state.missions[0].missionId;
  }
  renderList();
  if (state.selectedId) await loadDetail(state.selectedId);
  else renderDetail();
}

bindDockPicker();

async function selectMission(missionId) {
  state.selectedId = missionId;
  state.verified = null;
  state.brief = null;
  renderList();
  await loadDetail(missionId);
}

async function loadDetail(missionId) {
  const r = await api('get', { missionId });
  if (!r.ok) {
    state.detail = null;
    renderDetail();
    return;
  }
  // 展开 view 时也可能抛错（字段是坏数据/getter 抛错）。
  // 不能让它在**赋值**这一步就炸掉整个加载 —— 否则用户看到的是
  // "选择一个 Mission"，仿佛 Mission 不存在。降级成"详情读不到"更诚实。
  try {
    state.detail = { ...r.view, live: r.live };
  } catch (err) {
    state.detail = null;
    state.detailBroken = String((err && err.message) || err);
    renderDetail();
    return;
  }

  // 待办 / 离开期间 / 运行时投影 并行取：三者互不依赖，
  // 串行会让右栏打开慢一拍。
  //
  // ⚠️ 每个都要单独兜底（2026-11-04 由韧性测试发现）：
  //   早期是裸的 `await Promise.all([...])` —— 任一 API 抛错会让**整次加载失败**，
  //   用户看到的是"选择一个 Mission 查看详情"，仿佛 Mission 不存在。
  //   实际只是某个非核心数据取不到。
  //
  //   原则：**降级优于失败**。待办取不到不代表详情不能显示。
  const settle = (p, fallback) => p.catch((e) => ({ ok: false, reason: e && e.message ? e.message : String(e), __fallback: fallback }));
  const [att, since, proj, bound] = await Promise.all([
    settle(api('attention'), null),
    settle(api('sinceLastSeen', { missionId }), null),
    settle(api('sessionProjections'), null),
    settle(api('getBoundSession', { missionId }), null),
  ]);
  state.boundSession = bound && bound.ok ? bound : null;
  // 已绑定会话时，顺手拿一次真实进度（只有绑定过才问，避免无谓调用）
  state.workStatus = null;
  if (state.boundSession && state.boundSession.bound) {
    try {
      const ws = await api('workStatus', { missionId });
      if (ws && ws.ok) state.workStatus = ws;
    } catch { /* 进度拿不到不影响主流程 */ }
  }
  // 有绑定的执行在跑 → 开始自动刷新进度（用户正在等，不能"看着没反应"）
  if (state.boundSession && state.boundSession.bound) {
    startProgressPoll();
  } else {
    stopProgressPoll();
  }
  state.attention = att.ok ? att : { ok: false, items: [], total: 0, available: false };
  state.since = since.ok ? since : { ok: false, entries: [], available: false };
  // 运行时投影：给出结构化的 userQuestions（含 options / multiSelect / plan-review）。
  // 拿不到时如实为 null —— 待办区会回落到 office 快照的纯文本路径。
  state.projections = proj.ok && proj.available ? proj : null;

  renderDetail();

  // Brief 单独取（它可能较大，且失败不应影响主视图）
  const b = await api('getBrief', { missionId });
  state.brief = b.ok ? b.brief : { empty: true };
  const sync = await api('briefSyncState');
  state.syncState = sync.ok ? sync : { synced: false };
  renderDetail();

  // 渲染完成后再记"看过"——记早了会把这次探索本身算进"离开期间"。
  // 不 await：它只是 UI 偏好，失败也不该影响展示。
  api('markSeen', { missionId });
}

// ------------------------------------------------------------------ 交互

$('btnNew').addEventListener('click', () => {
  $('fTitle').value = '';
  $('fIntent').value = '';
  $('fConstraint').value = '';
  $('dlgErr').textContent = '';
  $('dlg').showModal();
  $('fTitle').focus();
});

$('btnCancel').addEventListener('click', () => $('dlg').close());

$('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('fTitle').value.trim();
  const intent = $('fIntent').value.trim();
  const constraintsText = $('fConstraint').value.trim();
  if (!title || !intent) { $('dlgErr').textContent = '标题与目标都必须填写。'; return; }

  const payload = { title, intent };
  if (constraintsText) {
    payload.constraints = [{ id: 'con-1', text: constraintsText, source: 'user' }];
  }
  const r = await api('create', payload);
  if (!r.ok) { $('dlgErr').textContent = r.reason; return; }

  $('dlg').close();
  state.selectedId = r.missionId;
  await refresh();
});

// -------------------------------------------------- 进度自动刷新
//
// 第一性原理：用户点了「交给团队」之后会盯着屏幕等。
// 如果进度不自己变，他会以为"没反应"——这正是最初被抱怨的那个症状。
//
// 但不能无脑轮询：
//   · 全局每 3 秒刷一次 = 白烧 CPU，且大多数时候没有变化
//   · 有 Agent 任务在跑时才轮询
//   · 页面不可见时停（用户切走了就没必要刷）
//   · 连续多次没有变化就退避
//
// 只刷「交给团队」那一块的数字，**不整页重绘**——
// 整页重绘会让用户正在输入的文本框失焦。

const PROGRESS_POLL_MS = 4000;
let progressTimer = null;
let progressIdleTicks = 0;
// 防止 setInterval + async 重入（见 startProgressPoll 里的说明）
let progressBusy = false;

function stopProgressPoll() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  progressIdleTicks = 0;
}

function startProgressPoll() {
  stopProgressPoll();
  progressTimer = setInterval(async () => {
    // ⚠️ 防重入（2026-11-02 复查发现）。
    //
    //   setInterval + async 有天然缺陷：**如果一次请求比间隔慢，
    //   下一次会照常启动**，于是多个请求并发堆积。
    //   实测在 120ms 的慢请求 + 50ms 间隔下最大并发能到 3。
    //
    //   在真机上这意味着 IPC 排队、内存峰值、以及"看到先后乱序的结果"
    //   （后发的请求先回来 → 进度回退）。
    //
    //   加一个 in-flight 标记：上一次没回来就跳过这一跳。
    if (progressBusy) return;
    progressBusy = true;
    try {
      await pollProgressOnce();
    } finally {
      progressBusy = false;
    }
  }, PROGRESS_POLL_MS);
}

/** 单次轮询。抽出来是为了让 startProgressPoll 里的防重入逻辑保持简单。 */
async function pollProgressOnce() {
  {
    // 页面隐藏 → 不刷
    if (document.hidden) return;
    const id = state.selectedId;
    if (!id) { stopProgressPoll(); return; }
    const bound = state.boundSession;
    if (!bound || !bound.bound) { stopProgressPoll(); return; }

    let ws = null;
    try {
      ws = await api('workStatus', { missionId: id });
    } catch { return; }
    if (!ws || !ws.ok) return;

    // ⚠️ 需求发出后用户可能已经切走了（2026-11-02 复查发现）。
    //
    //   这个 await 可能耗时几百毫秒。如果期间用户点了另一个 Mission，
    //   state.selectedId 已经变了，而这里仍然会把**旧 Mission 的进度**
    //   写进 state.workStatus 并重绘 —— 于是新 Mission 的卡片上
    //   显示的是上一个 Mission 的"已执行 N 轮"。
    //
    //   判定：请求发出时的 id 与当前选中不一致 → 结果作废，直接丢弃。
    if (state.selectedId !== id) {
      return;
    }

    const prev = state.workStatus;
    const changed = !prev
      || prev.turns !== ws.turns
      || prev.steps !== ws.steps
      || prev.lastResponsePreview !== ws.lastResponsePreview
      || prev.hasResponse !== ws.hasResponse;

    state.workStatus = ws;

    if (changed) {
      progressIdleTicks = 0;
      // 只重绘 start-work 区块，不整页重绘（避免抢焦点）
      const oldBox = document.querySelector('.start-work');
      if (oldBox && state.detail && state.detail.mission) {
        const fresh = renderStartWork(state.detail.mission);
        oldBox.replaceWith(fresh);
      }
    } else {
      progressIdleTicks += 1;
      // 连续 15 次（≈60 秒）没变化 → 退避到停止，
      // 等用户下次交互再重启。避免长时间空转。
      if (progressIdleTicks >= 15) stopProgressPoll();
    }
  }
}

// 页面重新可见时，如果有绑定的会话就恢复轮询
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.boundSession && state.boundSession.bound) {
    startProgressPoll();
  }
});

// 启动
refresh();
</script>
