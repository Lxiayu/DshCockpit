<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Mission Desk</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* Mission Desk —— P1 的第一个用户可见界面。
   *
   * 设计原则（来自 docs/design/mission-desk.md 与 domain-model §2.1.1）：
   *
   *   1. **Active / Focused / Running 三个轴必须视觉上分开**。
   *      用户最容易被误导的地方就是把"我在看这个"当成"这个在跑"。
   *      → 卡片上的 status 徽章（Active）与 running 圆点（Running）不放在一起，
   *        且 running 必须带"x 秒前观察到"。
   *
   *   2. **多个 active 是常态，不是异常**。
   *      → 不做"当前项目"这种单数表述；列表默认显示全部 active。
   *      超过 10 个时给**轻量提示**（软上限），绝不阻止创建。
   *
   *   3. **实时状态不可用时明说**（不是显示"未运行"）。
   *      → 没有 Harness 快照时显示"实时状态不可用"，而不是一个看起来确定的灰点。
   *
   *   4. **Brief 是可见的**，因为它就是 Agent 下次会读到的东西。
   *      用户应该能直接看到"我的项目记忆长什么样"。
   */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-app); color: var(--text-1); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; font-size: 13px; line-height: 1.55; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-1); flex: 0 0 auto; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  .muted { color: var(--text-3); }
  .tiny { font-size: 11px; }

  button { border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 7px; padding: 6px 12px; background: var(--bg-hover); }
  button:hover, button:focus-visible { background: var(--border-2); outline: none; }
  button.primary { background: var(--acc); color: var(--on-acc); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  main { display: flex; gap: 0; flex: 1 1 auto; min-height: 0; }
  #list { flex: 0 0 320px; border-right: 1px solid var(--border-1); overflow: auto; padding: 10px; }
  #detail { flex: 1 1 auto; overflow: auto; padding: 16px; min-width: 0; }

  /* ---------------------------------------------------------------- dock 模式
     右栏宽度只有 380px，不能沿用"左列表 + 右详情"的双栏。
     切到单列：顶部一个 Mission 选择器，下面全是详情。
     同一个文件两种布局，避免维护两份 UI（那必然漂移）。 */
  body.dock main { flex-direction: column; overflow: auto; }
  /* dock 里列表卡片整个隐藏：顶部下拉已经承担了选择职责。
     之前只隐藏 .row 不隐藏 .card，于是选中项会以一张带边框的卡片
     在详情上方重复出现一次（真机截图抓到的）。 */
  /* dock 里 #list 整个让位给 detail：
     顶部下拉已经承担选择职责，列表区的任何内容（卡片/空状态引导）
     都与 detail 的对应内容重复。真机截图抓到过"从这里开始"和
     "还没有选中任何 Mission"同时出现两遍的情况。 */
  body.dock #list { display: none; }
  body.dock #detail { flex: 1 1 auto; padding: 12px 14px; overflow: visible; }
  body.dock h2 { margin-top: 12px; }
  /* dock 里 header 的 h1 与选择器的 "MISSION DESK" 标签重复。
     保留 h1（它是页面标识），去掉选择器里那行小标题。 */
  body.dock #dockPicker .dock-head { display: none; }
  /* 顶部选择器：dock 模式下唯一需要的"列表" */
  #dockPicker { display: none; }
  body.dock #dockPicker { display: block; flex: 0 0 auto;
    border-bottom: 1px solid var(--border-1); padding: 8px 10px; }
  /* 注意：这里原来写的是 var(--bg-2) —— 但 --bg-2 在 theme.css 里
     **根本不存在**，所以永远回退到深色 #22252c。浅色主题下变成深底深字，
     几乎看不见（浅色截图抓到的）。所有 token 必须先在 theme.css 定义。 */
  #dockPicker select { width: 100%; background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  #dockPicker .dock-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #dockPicker .dock-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-3); }

  /* 卡片：status 与 running 分开呈现 */
  .card { border: 1px solid var(--border-1); border-radius: 9px; padding: 10px 11px; margin-bottom: 8px; cursor: pointer; background: var(--bg-panel); }
  .card:hover { border-color: var(--border-2); }
  .card.sel { border-color: var(--acc); }
  .card .title { font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  .card .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Mission 自身状态（我们拥有的） */
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--bg-hover); color: var(--text-2); letter-spacing: .02em; }
  .badge.active { background: var(--att-info-bg); color: var(--att-info-fg); }
  .badge.paused { background: var(--att-warn-bg); color: var(--att-warn-fg); }
  .badge.completed { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .badge.abandoned { background: var(--att-idle-bg); color: var(--att-idle-fg); }

  /* Harness 的事实（只读，必须带时间） */
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); flex: 0 0 7px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--att-ok-bg); }
  .dot.unknown { background: transparent; border: 1px solid var(--text-4); }

  /* ==================================================================
     视觉层级（P4 深度打磨）
     ------------------------------------------------------------------
     第一性原理：用户说"不要只是简单的几个框和按钮"——
     要的不是花哨，是**视觉重量承载语义层级**。

     三级重量：
       L1 需要行动（待办）    最深底 + 左侧强调条 + 最高对比
       L2 情境（快照/时间线）  中等，卡片底
       L3 参考（决策/问题等）  最轻，仅分隔线

     所有颜色一律走 token —— 这页原来有 37 处硬编码色，
     浅色模式下浅蓝字配白底几乎不可见。
     ================================================================== */

  /* --- L1: 需要你处理 ------------------------------------------------ */
  .att { border-radius: 10px; margin: 0 0 10px; overflow: hidden; border: 1px solid var(--border-1); }
  .att.att-present { border-color: var(--att-bad-line); background: var(--att-bad-bg); }
  .att.att-clear { background: var(--bg-panel); }
  .att-head {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 11px; font-size: 12px; font-weight: 650; letter-spacing: .01em;
  }
  .att.att-present .att-head { color: var(--att-bad-fg); }
  .att.att-clear .att-head { color: var(--att-ok-fg); }
  .att-count {
    margin-left: auto; font-size: 10px; font-weight: 600; padding: 1px 7px;
    border-radius: 999px; background: var(--att-idle-bg); color: var(--att-idle-fg);
  }
  .att.att-present .att-count { background: var(--att-bad-strong); color: var(--att-bad-fg); }
  .att-clear-msg { padding: 0 11px 10px; font-size: 11.5px; color: var(--text-3); line-height: 1.55; }

  /* 待办卡片：风险用左侧竖条表达，不用整块染色（整块会抢走全部注意力） */
  .att-item {
    display: flex; flex-direction: column; gap: 4px;
    padding: 9px 11px 10px 13px;
    position: relative;
    transition: background .12s var(--ease);
  }
  .att-item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--att-idle-fg);
  }
  .att-item[data-risk="high"]::before { background: var(--bad); }
  .att-item[data-risk="medium"]::before { background: var(--warn); }
  .att-item[data-risk="low"]::before { background: var(--att-idle-fg); }
  /* 项之间靠极淡的分隔线（比区块间的线更淡），因为它们是同一张卡内的条目 */
  .att-item + .att-item { box-shadow: inset 0 1px 0 var(--border-1); }
  .att-item:hover { background: var(--bg-hover); }
  .att-item-line { display: flex; align-items: baseline; gap: 6px; }
  .att-item-kind {
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; flex: 0 0 auto;
  }
  .att-item[data-kind="approval"] .att-item-kind { background: var(--att-bad-bg); color: var(--att-bad-fg); }
  .att-item[data-kind="question"] .att-item-kind { background: var(--att-info-bg); color: var(--att-info-fg); }
  .att-overflow { font-size: 10.5px; color: var(--text-3); padding: 6px 0 2px;
    border-top: 1px solid var(--border-1); margin-top: 4px; }
  .att-item-text { font-size: 12px; color: var(--text-1); line-height: 1.45; overflow-wrap: anywhere; }
  /* 元信息（工具名/风险/时间）是**要读的**，所以不能用 --text-4（最弱层）。
     真机对比度实测：--text-4 在深色是 2.89:1、浅色 2.57:1，都低于 AA 4.5:1。
     --text-3 达标（深 5.6 / 浅 4.9）。 */
  .att-item-meta { font-size: 10.5px; color: var(--text-3); }
  .att-item-actions { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  /* 结构化选项：这是一组"选一个"的按钮，不是一串并列动作。
     用换行 + 一致的宽度暗示它们互斥。 */
  .att-options { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-bottom: 2px; }
  .att-options .att-btn { text-align: left; width: 100%; padding: 5px 10px; }
  .att-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border-2); background: var(--bg-hover); color: var(--text-2);
    transition: background .15s var(--ease), color .15s var(--ease);
  }
  .att-btn:hover { background: var(--bg-overlay); color: var(--text-1); }
  .att-btn.danger { border-color: var(--att-bad-line); color: var(--att-bad-fg); }
  .att-btn.primary { background: var(--acc); border-color: transparent; color: var(--on-acc); }
  .att-btn.primary:hover { background: var(--acc-hover); }

  /* --- 第二层：团队执行提醒 -------------------------------------------
     第一性原理：这一层**不能长得像待办**。
     如果它也用红框，用户会学会无视红色，第一层就失效了。

     所以：中性底、更小的字、无边框、用左侧细线表达"仅供参考"。 */
  .att-reminders { border-top: 1px solid var(--border-1); padding: 8px 11px 9px; background: var(--bg-panel); }
  .att.att-clear .att-reminders { border-top: 0; padding-top: 0; }
  .att-rem-head {
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-4); margin-bottom: 5px;
  }
  .att-rem { padding: 4px 0 4px 9px; position: relative; }
  .att-rem::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
    border-radius: 1px; background: var(--att-idle-fg);
  }
  .att-rem[data-tone="info"]::before { background: var(--info); }
  .att-rem[data-tone="warn"]::before { background: var(--warn); }
  .att-rem-title { font-size: 11.5px; color: var(--text-2); line-height: 1.45; }
  .att-rem-detail { font-size: 10.5px; color: var(--text-3); line-height: 1.5; margin-top: 2px; }

  /* --- 「交给团队」 ---------------------------------------------------
     这是整个 Desk 最重要的入口，视觉上必须最突出：
     强调色边框 + 比其它区块更大的输入框。
     其它区块都是"参考资料"，这一块是"开始工作"。 */
  /* 折叠态：只是**一行**轻量入口，不占首屏。
     展开态才用原来的强调底色 —— 用户点开时他已经明确要派活，
     那时用强视觉是对的；平时用强视觉等于天天喊"来派活"，
     而用户大多数时候是来看进展的。 */
  .start-work { margin: 0 0 10px; }
  .start-work.open { padding: 11px 12px; border-radius: 10px;
    background: var(--acc-soft); border: 1px solid var(--acc); }
  .start-work-trigger { display: flex; }
  .start-work-open { width: 100%; font-size: 12px; padding: 7px 10px;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    background: transparent; color: var(--text-2);
    border: 1px dashed var(--border-1); transition: color .12s, border-color .12s; }
  .start-work-open:hover { color: var(--text-1); border-color: var(--text-3); }
  .start-work-close { margin-left: auto; font-size: 10.5px; padding: 1px 7px;
    border-radius: 5px; cursor: pointer; font-family: inherit;
    background: transparent; color: var(--text-3); border: 1px solid var(--border-1); }
  .start-work-head { display: flex; align-items: center; }
  .start-work-head { font-size: 12.5px; font-weight: 700; color: var(--text-1); margin-bottom: 3px; }
  .start-work-hint { font-size: 10.5px; color: var(--text-2); line-height: 1.5; margin-bottom: 7px; }
  .start-work-row { margin-bottom: 7px; }
  .start-work-input {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 46px;
    background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-2); border-radius: 8px;
    padding: 7px 9px; font-size: 12px; line-height: 1.5; font-family: inherit;
  }
  .start-work-input:focus { outline: none; border-color: var(--acc); }
  .start-work-actions { display: flex; gap: 6px; }
  .start-work-btn {
    background: var(--acc); color: var(--on-acc); border: 0; border-radius: 8px;
    padding: 7px 16px; font-size: 12px; font-weight: 650; cursor: pointer;
  }
  .start-work-btn:hover { background: var(--acc-hover); }
  .start-work-btn:disabled { opacity: .6; cursor: default; }
  .start-work-msg { font-size: 10.5px; line-height: 1.5; margin-top: 6px; color: var(--text-3); }
  .start-work-msg.ok { color: var(--att-ok-fg); }
  .start-work-msg.err { color: var(--att-bad-fg); }
  .start-work-link {
    display: block; width: 100%; text-align: left; margin-top: 8px;
    background: transparent; border: 0; border-top: 1px solid var(--border-1);
    padding: 7px 0 0; font-size: 11px; color: var(--acc); cursor: pointer;
  }
  .start-work-link:hover { color: var(--acc-hover); }
  .start-work-progress { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border-1); }
  .start-work-progress-line { font-size: 11.5px; color: var(--text-2); font-weight: 600; }
  .start-work-progress-hint { font-size: 10px; color: var(--text-3); line-height: 1.45; margin-top: 2px; }
  /* Agent 的回复：视觉上要比"进度数字"重，因为那是用户真正关心的内容 */
  .start-work-response { margin-top: 7px; padding: 7px 9px; border-radius: 7px;
    background: var(--bg-input); border: 1px solid var(--border-2); }
  .start-work-response-label { font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 3px; }
  .start-work-response-body { font-size: 11.5px; color: var(--text-1); line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .start-work-response-prompt { font-size: 10px; color: var(--text-3); margin-top: 4px;
    line-height: 1.45; }
  .start-work-harvest {
    margin-top: 7px; background: transparent; border: 1px solid var(--border-2);
    border-radius: 6px; padding: 4px 10px; font-size: 10.5px; color: var(--text-2);
    cursor: pointer;
  }
  .start-work-harvest:hover { border-color: var(--acc); color: var(--acc); }
  .start-work-harvest:disabled { opacity: .6; cursor: default; }
  .start-work-harvest-msg { font-size: 10px; color: var(--text-3); line-height: 1.5; margin-top: 4px; }
  .start-work-harvest-msg.ok { color: var(--att-ok-fg); }
  .start-work-harvest-msg.err { color: var(--att-bad-fg); }
  .start-work-skip-list { margin: 3px 0 0; padding-left: 16px; }
  .start-work-skip-list li { font-size: 9.5px; color: var(--text-3); line-height: 1.45; }
  .start-work-response-note { font-size: 9.5px; color: var(--text-4); margin-top: 4px;
    line-height: 1.4; font-style: italic; }

  /* --- plan-review 折叠视图 ------------------------------------------
     380px 放不下完整计划 markdown。所以：默认 4 行 + 展开。
     不弹窗、不跳页 —— 用户正在看任务，不该被踢走。 */
  .plan-review { width: 100%; margin: 2px 0 6px; border-radius: 8px;
    border: 1px solid var(--border-1); background: var(--bg-input); overflow: hidden; }
  .plan-review-head { font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-3); padding: 6px 9px 0; }
  .plan-review-body {
    margin: 0; padding: 4px 9px 6px; font-family: var(--mono); font-size: 10.5px;
    line-height: 1.55; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 120px; overflow-y: auto;
  }
  .plan-review-body.expanded { max-height: 320px; }
  .plan-review-toggle {
    width: 100%; text-align: left; padding: 5px 9px; cursor: pointer;
    font-size: 10.5px; color: var(--acc); background: transparent;
    border: 0; border-top: 1px solid var(--border-1);
  }
  .plan-review-toggle:hover { background: var(--bg-hover); }
  .plan-review-truncated { font-size: 10px; color: var(--att-warn-fg); background: var(--att-warn-bg);
    padding: 5px 9px; line-height: 1.5; }
  .plan-review-empty { font-size: 10.5px; color: var(--text-3); padding: 4px 9px 7px; line-height: 1.5; }

  /* --- 团队任务（agentTeam 投影）-------------------------------------
     层级：比"待办"轻（那是需要行动的），比"参考资料"重（那是当前在跑的）。
     所以：有卡片底，但无强调色。 */
  .team { margin: 0 0 10px; padding: 10px 11px; border-radius: 10px;
    background: var(--bg-panel); border: 1px solid var(--border-1); }
  .team-head { display: flex; align-items: center; gap: 6px; font-size: 12px;
    font-weight: 650; color: var(--text-1); margin-bottom: 7px; }
  .team-count { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px;
    background: var(--att-idle-bg); color: var(--att-idle-fg); }
  /* 进展统计：3/7 一眼看出规模；阻塞单独标色（琥珀，不是红—— */
  /* 阻塞不是"你该处理的事"，它是在等别的任务，用红会让红色贬值） */
  .team-progress { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px;
    background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .team-blocked-count { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px;
    background: var(--att-warn-bg); color: var(--att-warn-fg); }
  .team-empty { font-size: 11.5px; color: var(--text-3); }
  .team-warn { font-size: 10.5px; color: var(--att-warn-fg); background: var(--att-warn-bg);
    border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; line-height: 1.5; }
  .team-task { padding: 6px 0; }
  .team-task + .team-task { box-shadow: inset 0 1px 0 var(--border-1); }
  .team-task-line { display: flex; align-items: baseline; gap: 7px; }
  .team-task-status { font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
    padding: 1.5px 6px; border-radius: 4px; flex: 0 0 auto; }
  .st-task-pending { background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .st-task-in_progress { background: var(--att-info-bg); color: var(--att-info-fg); }
  .st-task-completed { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .st-task-deleted { background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .team-task-subject { font-size: 12.5px; color: var(--text-1); line-height: 1.5;
    overflow-wrap: anywhere; }
  .team-task-meta { font-size: 10.5px; color: var(--text-3); margin-top: 3px; padding-left: 2px; }
  /* ---- 承诺与实际（对账）----
     这一块的语气必须中性：它陈述差异，不指控团队。
     所以不用红色，用琥珀 —— 红是"出事了"，琥珀是"值得你看一眼"。 */
  .rec { display: block; margin-top: 10px; padding: 9px 11px; border-radius: 9px;
    background: var(--att-warn-bg); border: 1px solid var(--att-warn-fg); }
  .rec-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .rec-head span:first-child { flex: 1; font-size: 11.5px; font-weight: 600;
    color: var(--att-warn-fg); }
  .rec-count { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px;
    background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .rec-count-warn { background: var(--att-warn-bg); color: var(--att-warn-fg); }
  .rec-row { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
  .rec-mark { flex: none; font-size: 9px; color: var(--text-3); }
  .rec-text { flex: 1; font-size: 11.5px; color: var(--text-1);
    overflow-wrap: anywhere; }
  .rec-tag { flex: none; font-size: 10px; color: var(--text-3); }
  .rec-sub { font-size: 10.5px; color: var(--text-3); margin-top: 6px; }
  .rec-warn { font-size: 10.5px; color: var(--att-warn-fg); margin-top: 8px;
    line-height: 1.5; }
  /* ---- 派发结果持久条 ----
     派发是最重要的动作，结果必须留得住（alert 关掉就没了）。
     用中性色而不是绿色：绿色会被读成"成功了"，而 unconfirmed 不是成功。 */
  .last-dispatch { display: flex; align-items: baseline; gap: 8px;
    margin: 8px 0; padding: 7px 10px; border-radius: 8px;
    background: var(--bg-input); border: 1px solid var(--border-1); }
  .last-dispatch-text { flex: 1; font-size: 11.5px; color: var(--text-2);
    line-height: 1.5; overflow-wrap: anywhere; }
  .last-dispatch-when { flex: none; font-size: 10px; color: var(--text-3); }
  .last-dispatch-err { border-color: var(--att-warn-fg); background: var(--att-warn-bg); }
  .last-dispatch-err .last-dispatch-text { color: var(--att-warn-fg); }
  /* ---- 派发面板（D3 结构化任务书）----
     与 .mhead 同样的坑：站内通用规则会让容器变成 flex，
     显式写 block 才能让标签在输入框上方而不是压在一起。 */
  .dispatch { display: block; width: 100%; box-sizing: border-box; }
  .dispatch-title { margin: 0 0 8px; font-size: 12.5px; color: var(--text-2); }
  .dp-field { display: block; margin-bottom: 10px; }
  .dp-label { display: block; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
  .dp-hint { display: block; font-size: 10.5px; color: var(--text-3);
    line-height: 1.5; margin-bottom: 5px; }
  .dp-warn { color: var(--att-warn-fg); }
  .dp-input, .dp-select { display: block; width: 100%; box-sizing: border-box;
    background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 6px;
    padding: 5px 7px; font-size: 12px; font-family: inherit; margin-bottom: 5px; }
  .dp-input { resize: vertical; }
  .dp-acc-row { display: flex; gap: 4px; align-items: flex-start; flex-wrap: wrap; }
  .dp-acc-row .dp-input { flex: 1 1 100%; margin-bottom: 3px; }
  .dp-acc-row .dp-select { flex: 0 0 84px; margin-bottom: 3px; }
  .dp-del { flex: 0 0 auto; font-size: 13px; padding: 2px 7px; border-radius: 5px;
    cursor: pointer; background: transparent; color: var(--text-3);
    border: 1px solid var(--border-1); }
  .dp-add { font-size: 11px; padding: 3px 9px; border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--text-2);
    border: 1px dashed var(--border-1); font-family: inherit; margin-top: 2px; }
  .dp-actions { display: flex; gap: 6px; margin-top: 8px; }
  .dp-submit { font-size: 12px; padding: 6px 14px; border-radius: 7px; cursor: pointer;
    background: var(--acc); color: var(--on-acc); border: 0; font-family: inherit; }
  .dp-submit:disabled { opacity: .5; cursor: default; }
  .dp-msg { font-size: 11px; margin-top: 6px; line-height: 1.5; }
  .dp-msg.ok { color: var(--text-2); }
  .dp-msg.err { color: var(--att-warn-fg); }
  /* ---- 授权目录（D10）----
     用户要敢离开屏幕，前提是能回答"团队被允许访问哪些目录"。
     所以目录必须**完整显示**（超长省略 + title 提示），不藏。 */
  .grant-row { padding: 6px 0; border-top: 1px solid var(--border-1); }
  .grant-row:first-of-type { border-top: 0; }
  .grant-row-off { opacity: .55; }
  .grant-line { display: flex; align-items: center; gap: 6px; }
  .grant-dir { flex: 1; font-size: 11.5px; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left; }
  .grant-access { flex: none; font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .grant-status { flex: none; font-size: 10px; color: var(--text-3); }
  .grant-ops { display: flex; gap: 6px; margin-top: 4px; }
  .grant-empty, .grant-warn { font-size: 11px; padding: 4px 0; }
  .grant-empty { color: var(--text-3); }
  .grant-warn { color: var(--att-warn-fg); }
  .grant-form { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-1); }
  .grant-form-title { font-size: 11.5px; color: var(--text-2); margin-bottom: 5px; }
  .grant-access-sel { display: block; width: 100%; margin-bottom: 5px;
    background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 6px;
    padding: 5px 7px; font-size: 12px; font-family: inherit; }
  /* ---- 区块渲染失败提示 ----
     一块坏了只显示这一行，其余照常 —— 不能让整页白屏。
     用琥珀不用红：红是"出事了"，琥珀是"这块没能显示"。 */
  .block-error { margin: 8px 0; padding: 7px 10px; border-radius: 8px;
    background: var(--att-warn-bg); border: 1px solid var(--att-warn-fg);
    color: var(--att-warn-fg); font-size: 11px; line-height: 1.5;
    overflow-wrap: anywhere; }
  /* ---- 诊断面板 ----
     人话在前、原始数据在后并默认收起。
     直接弹 JSON 等于让用户在排查问题时先做一次解析工作。 */
  .diag-panel { margin-top: 10px; padding: 9px 11px; border-radius: 9px;
    background: var(--bg-input); border: 1px solid var(--border-1); }
  .diag-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .diag-head span:first-child { flex: 1; font-size: 11.5px; font-weight: 600;
    color: var(--text-2); }
  .diag-close, .diag-toggle { font-size: 10.5px; padding: 2px 8px; border-radius: 5px;
    cursor: pointer; font-family: inherit;
    background: transparent; color: var(--text-3); border: 1px solid var(--border-1); }
  .diag-line { font-size: 11.5px; color: var(--text-1); line-height: 1.6;
    overflow-wrap: anywhere; }
  .diag-toggle { margin-top: 6px; }
  .diag-raw { margin: 6px 0 0; padding: 8px; border-radius: 6px;
    background: var(--bg-panel); color: var(--text-2);
    font-size: 10.5px; line-height: 1.5; overflow: auto; max-height: 240px;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  /* ---- 折叠区（§6.2 第 6 块）----
     查阅型内容默认关掉，把首屏留给"需要你 / 进展 / 团队"。
     标题带数量，让用户知道值不值得点开。 */
  /* 任务级干预（S6）：按钮与表单都内联在任务行下，保留上下文 */
  .team-task-ops { display: flex; gap: 6px; margin-top: 5px; }
  .task-op { font-size: 10.5px; padding: 2px 8px; border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--text-3);
    border: 1px solid var(--border-1); font-family: inherit; }
  .task-op:hover { color: var(--text-1); border-color: var(--text-3); }
  .task-op:disabled { opacity: .5; cursor: default; }
  .task-rw-form { margin-top: 6px; padding: 8px 0; border-top: 1px solid var(--border-1); }
  .task-rw-title { font-size: 11.5px; color: var(--text-2); margin-bottom: 6px;
    overflow-wrap: anywhere; }
  .task-rw-input { display: block; width: 100%; box-sizing: border-box;
    background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 6px;
    padding: 5px 7px; font-size: 12px; font-family: inherit; margin-bottom: 5px; }
  .task-rw-desc { resize: vertical; min-height: 44px; }
  .task-rw-actions { display: flex; gap: 6px; }
  .task-rw-msg { font-size: 11px; margin-top: 5px; line-height: 1.5; }
  .task-rw-msg.ok { color: var(--text-2); }
  .task-rw-msg.err { color: var(--att-warn-fg); }
  .coll { margin-top: 6px; border-top: 1px solid var(--border-1); }
  .coll-head { display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 8px 0; background: transparent; border: 0; cursor: pointer;
    font-family: inherit; text-align: left; }
  .coll-head:hover .coll-title { color: var(--text-1); }
  .coll-caret { flex: none; font-size: 9px; color: var(--text-3); width: 10px; }
  .coll-title { flex: 1; font-size: 12px; color: var(--text-2); }
  .coll-count { flex: none; font-size: 10px; font-weight: 600; padding: 0 6px;
    border-radius: 999px; background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .coll-count-zero { opacity: .5; }
  .coll-body { padding-bottom: 8px; }
  .coll-error { font-size: 10.5px; color: var(--att-warn-fg); background: var(--att-warn-bg);
    padding: 5px 8px; border-radius: 6px; }
  /* ---- 头部（§6.2 第 1 块）----
     只放三样：标题 / 状态徽标 / 目标一行。
     首屏 380px 里，这三样回答"我在看什么、它怎么样、它要干什么"。 */
  /* width:100% 是必须的：详情区是 flex 容器，不写就会被按内容压缩，
     实测被压到 94px，导致目标文字折成三行（截图验证）。 */
  /* display:block 是必须的：站内某条通用规则会让 header 变成 flex，
     于是子元素横排、目标块被压到 94px（截图 + 计算样式确认）。
     显式写成 block，让它按行堆叠。 */
  .mhead { display: block; width: 100%; box-sizing: border-box; padding: 10px 0 8px;
    border-bottom: 1px solid var(--border-1); margin-bottom: 8px; }
  .mhead-line1 { display: flex; align-items: center; gap: 8px; }
  /* 标题单行：首屏 380px 里，两行标题会挤掉"需要你"的位置。
     超长用省略号，完整标题通过 title 属性（hover 可见）。
     这不是隐藏信息——列表里也是同一个标题，用户点进来前就见过。 */
  .mhead-title { flex: 1; margin: 0; font-size: 14px; font-weight: 600;
    color: var(--text-1); line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mhead-badge { flex: none; font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    cursor: pointer; border: 1px solid transparent; font-family: inherit; }
  /* 状态色语义（§6.3）：绿=已验证/正常，琥珀=等你，蓝=进行中，灰=已结束
     红色只给高风险与阻塞 —— 状态本身不用红，否则红色贬值。
     **必须用语义 token**：直接写 rgba/#hex 会在浅色主题里变成浅底浅字
     （test/theme-tokens.test.js 机械校验这条，本轮被它抓到）。 */
  .mhead-badge.mh-active { background: var(--att-info-bg); color: var(--att-info-fg);
    border-color: var(--att-info-fg); }
  .mhead-badge.mh-paused { background: var(--att-warn-bg); color: var(--att-warn-fg);
    border-color: var(--att-warn-fg); }
  .mhead-badge.mh-completed { background: var(--att-ok-bg); color: var(--att-ok-fg);
    border-color: var(--att-ok-fg); }
  .mhead-badge.mh-abandoned { background: var(--att-idle-bg); color: var(--att-idle-fg);
    border-color: var(--border-1); }
  .mhead-status-menu { position: absolute; right: 14px; z-index: 40; margin-top: 4px;
    background: var(--bg-panel); border: 1px solid var(--border-1); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); padding: 4px; min-width: 104px; }
  .mhead-status-opt { display: block; width: 100%; text-align: left; font-size: 12px;
    padding: 5px 9px; border-radius: 5px; background: transparent; color: var(--text-1);
    border: 0; cursor: pointer; font-family: inherit; }
  .mhead-status-opt:hover { background: var(--bg-input); }
  /* 目标块独占一行（在标题行下面）。
     早期实现让它在标题行内与徽标抢空间，结果被挤到右侧折成三行 ——
     在 380px 里，标题、徽标、目标三者不可能同一行。 */
  .mhead-intent { margin-top: 5px; display: block; font-size: 12.5px;
    color: var(--text-2); line-height: 1.5; overflow-wrap: anywhere; }
  .mhead-intent-label { font-size: 10.5px; color: var(--text-3); margin-right: 6px; }
  .mhead-intent-text { color: var(--text-2); }
  /* 目标最多两行，超出省略：首屏不能让一句话吃掉半屏 */
  .mhead-intent-text { display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  /* ---- 团队成员名册（S6）----
     名册在这里的意义不是"再看一遍成员"，而是**让我能对某个人做点什么**。
     所以操作按钮与名字同行，不藏在二级菜单里。 */
  .members-section .members-count { font-size: 10.5px; color: var(--text-3); margin-left: auto; }
  .member-row { padding: 6px 0; border-top: 1px solid var(--border-1); }
  .member-row:first-of-type { border-top: 0; }
  .member-line { display: flex; align-items: center; gap: 6px; }
  .member-name { font-size: 12.5px; color: var(--text-1); }
  .member-phase { font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: var(--bg-input); color: var(--text-3); }
  /* phase 是**生命周期**，不是"在不在跑" —— 用中性色，不用绿色假装在工作 */
  .member-phase[data-phase="failed"] { color: var(--att-warn-fg); }
  .member-role { font-size: 10px; color: var(--text-3); }
  .member-ops { display: flex; gap: 6px; margin-top: 5px; padding-left: 0; }
  .member-op { font-size: 11px; padding: 3px 8px; border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--text-2);
    border: 1px solid var(--border-1); }
  .member-op:hover { color: var(--text-1); border-color: var(--text-3); }
  .member-op.danger { color: var(--att-warn-fg); border-color: var(--att-warn-fg); }
  .member-op:disabled { opacity: .5; cursor: default; }
  .member-msg-wrap { padding-top: 4px; }
  .member-msg-form { padding: 8px 0; }
  .member-msg-title { font-size: 11.5px; color: var(--text-2); margin-bottom: 5px; }
  .member-msg-input, .member-msg-why { width: 100%; box-sizing: border-box;
    background: var(--bg-input); color: var(--text-1);
    border: 1px solid var(--border-1); border-radius: 6px;
    padding: 5px 7px; font-size: 12px; font-family: inherit; }
  .member-msg-input { resize: vertical; min-height: 54px; }
  .member-msg-why { margin-top: 5px; }
  .member-msg-actions { display: flex; gap: 6px; margin-top: 6px; }
  .member-msg-result { font-size: 11px; margin-top: 5px; line-height: 1.5; }
  .member-msg-result.ok { color: var(--text-2); }
  .member-msg-result.err { color: var(--att-warn-fg); }
  /* ---- 干预历史（S6）---- */
  .iv-toggle { font-size: 11px; padding: 2px 8px; border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--text-3); border: 1px solid var(--border-1); }
  .iv-list { margin-top: 6px; }
  .iv-row { display: flex; justify-content: space-between; gap: 8px;
    padding: 4px 0; border-top: 1px solid var(--border-1); font-size: 11.5px; }
  .iv-row:first-child { border-top: 0; }
  .iv-desc { color: var(--text-1); }
  .iv-meta { color: var(--text-3); font-size: 10.5px; white-space: nowrap; }
  /* 被阻塞：用琥珀色，与"待办红"区分——它不是要你处理，是在等人 */
  .team-blocked { margin-top: 4px; padding: 5px 8px; border-radius: 6px;
    background: var(--att-warn-bg); }
  .team-blocked-line { font-size: 10.5px; color: var(--att-warn-fg); line-height: 1.5; }
  .team-blocked-list { margin: 3px 0 0; padding-left: 16px; }
  .team-blocked-list li { font-size: 10.5px; color: var(--att-warn-fg); line-height: 1.5; }
  /* 写入范围冲突：只提示"可能"，绝不写"已锁定" */
  .team-scope-warn { margin-top: 4px; font-size: 10.5px; color: var(--text-3); line-height: 1.5; }

  /* --- L2: 离开期间发生了什么（时间线）------------------------------- */
  .tl { margin: 0 0 10px; padding: 10px 11px; border-radius: 10px; background: var(--bg-panel); border: 1px solid var(--border-1); }
  .tl-head { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 650; color: var(--text-1); margin-bottom: 7px; }
  .tl-when { font-size: 10.5px; color: var(--text-4); font-weight: 400; margin-left: auto; }
  .tl-list { list-style: none; margin: 0; padding: 0 0 0 11px; border-left: 1px solid var(--tl-line); }
  .tl-list li { position: relative; padding: 3px 0 3px 9px; font-size: 11.5px; color: var(--tl-fg); line-height: 1.5; }
  .tl-list li::before {
    content: ''; position: absolute; left: -14px; top: 9px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--tl-line);
  }
  .tl-list li[data-tone="ok"]::before { background: var(--ok); }
  .tl-list li[data-tone="warn"]::before { background: var(--warn); }
  .tl-list li[data-tone="info"]::before { background: var(--info); }
  .tl-tag { font-size: 9.5px; color: var(--tl-time); margin-right: 5px; }
  .tl-more { font-size: 10.5px; color: var(--text-4); padding: 5px 0 0 11px; }

  /* --- L3: 参考区块（可折叠）---------------------------------------- */
  /* --- Shared Context 条目（发现/假设/证据）--------------------------
     与"待办"的区别：待办是需要行动，这些是**参考资料**。
     所以视觉更轻：无边框、无底色，只有状态徽标 + 文字。
     第三层（参考）就该是这个重量。 */
  .sc-list { list-style: none; margin: 0; padding: 0; }
  .sc-item { padding: 7px 0; }
  .sc-line { display: flex; align-items: baseline; gap: 7px; }
  .sc-text { font-size: 12.5px; color: var(--text-1); line-height: 1.5; overflow-wrap: anywhere; }
  .sc-mono { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
  .sc-badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
    padding: 1.5px 6px; border-radius: 4px; flex: 0 0 auto;
  }
  .sc-badge-kind { background: var(--acc-soft); color: var(--acc); }
  .sc-meta { font-size: 10.5px; color: var(--text-3); margin-top: 3px; padding-left: 2px; }
  /* 状态色只上徽标，不染整行——整行染色会抢走"待办"的注意力 */
  .st-finding-unverified, .st-assumption-unverified { background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .st-finding-verified, .st-assumption-holding { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .st-finding-refuted, .st-assumption-violated, .st-assumption-expired { background: var(--att-bad-bg); color: var(--att-bad-fg); }

  /* Linear 原则：「no separators — only background hover state」。
     区块之间靠**留白**分组，不靠横线。留 14px 的呼吸。
     原来每个 .sec 都有 border-top，结果整页像一张表单。 */
  .sec { margin-top: 14px; }
  .sec > summary {
    display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
    padding: 9px 2px; font-size: 12px; font-weight: 620; color: var(--text-2);
    user-select: none;
  }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary::after {
    content: '▸'; margin-left: auto; font-size: 10px; color: var(--text-4);
    transition: transform .15s var(--ease);
  }
  .sec[open] > summary::after { transform: rotate(90deg); }
  .sec > summary:hover { color: var(--text-1); }
  .sec-n { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px;
    background: var(--att-idle-bg); color: var(--att-idle-fg); }
  .sec-body { padding: 0 2px 10px; }

  .empty { color: var(--text-3); padding: 24px 8px; text-align: center; }
  /* P4 空状态：不是"占位文案"，是**起点**。
     所以标题要突出（这是第一步），正文要有信息量（解释这是什么），
     按钮要唯一（不要给用户一堆选择）。 */
  .empty-lead { color: var(--text-1); font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .empty-body { max-width: 420px; margin: 0 auto 14px; line-height: 1.6; font-size: 12px; }
  .empty button.primary {
    background: var(--acc); color: var(--on-acc); border: 0; border-radius: 8px;
    padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .empty button.primary:hover { background: var(--acc-hover); }
  .soft-hint { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--att-warn-bg); color: var(--att-warn-fg); font-size: 11px; }

  /* ==================================================================
     排版层级（P4 UI 打磨）
     ------------------------------------------------------------------
     第一性原理（来自 Linear 设计系统）：
       「Hierarchy is enforced through scale and weight, never color.」

     之前的问题：标题/正文/元信息全靠 --text-1/2/3/4 四级颜色区分，
     字号只差 0.5-1px。结果看起来"全是白字"，单调。

     改法：
       · 标签（h2）= 11px / 650 / UPPERCASE / tracking .07em —— 形状上有识别度
       · 内容        = 13px / 450 / --text-1
       · 元信息      = 11px / 400 / --text-3
       · 数字用 tabular-nums，等宽对齐不跳动
     ================================================================== */
  h2 {
    font-size: 11px; font-weight: 650; margin: 20px 0 9px;
    color: var(--text-3); letter-spacing: .07em; text-transform: uppercase;
  }
  h3 { font-size: 12px; font-weight: 600; margin: 14px 0 6px; color: var(--text-2); }
  /* 数字等宽：计数变化时不左右跳 */
  .num, .att-count, .sec-n { font-variant-numeric: tabular-nums; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 3px 0; overflow-wrap: anywhere; }

  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; }
  .kv dt { color: var(--text-3); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }

  pre#briefText { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg-panel); border: 1px solid var(--border-1); border-radius: 9px; padding: 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; margin: 0; }
  .deliv { border: 1px solid var(--border-1); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; font-size: 12px; }
  .deliv .status { font-size: 10px; padding: 1px 7px; border-radius: 999px; }
  .st-unchanged { background: var(--att-ok-bg); color: var(--att-ok-fg); }
  .st-modified { background: var(--att-warn-bg); color: var(--att-warn-fg); }
  .st-missing { background: var(--att-bad-bg); color: var(--att-bad-fg); }
  .st-invalid, .st-unreadable { background: var(--att-idle-bg); color: var(--att-idle-fg); }

  dialog { border: 1px solid var(--border-2); border-radius: 11px; background: var(--bg-panel); color: var(--text-1); padding: 16px; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--text-2); }
  dialog input, dialog textarea { width: 100%; background: var(--bg-input); color: var(--text-1); border: 1px solid var(--border-1); border-radius: 7px; padding: 7px 9px; font: inherit; }
  dialog textarea { min-height: 64px; resize: vertical; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .err { color: var(--att-bad-fg); font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>Mission Desk</h1>
  <span id="counts" class="muted tiny"></span>
  <button id="btnNew" class="primary">新建 Mission</button>
</header>

<main>
  <!-- dock 模式的选择器：右栏没有空间放列表，用一个下拉替代。
       必须放在 #list **外面** —— renderList() 会 `$('list').textContent = ''`
       清空整个列表容器，放在里面会被一起清掉（真机验收抓到的）。 -->
  <div id="dockPicker">
    <div class="dock-head">
      <span class="dock-title">Mission Desk</span>
    </div>
    <select id="dockSelect" aria-label="选择 Mission"></select>
  </div>
  <aside id="list"></aside>
  <section id="detail" class="empty">选择一个 Mission 查看详情</section>
</main>

<dialog id="dlg">
  <form id="newForm" method="dialog">
    <strong>新建 Mission</strong>
    <label for="fTitle">标题</label>
    <input id="fTitle" required maxlength="200" placeholder="例如：把产品转成 Agent-first 工作空间" />
    <label for="fIntent">目标（你的原话，不会被模型改写）</label>
    <textarea id="fIntent" required placeholder="一句话说明这个项目要达成什么"></textarea>
    <label for="fConstraint">边界（可留空；用户确认过的不许越界）</label>
    <input id="fConstraint" maxlength="300" placeholder="例如：不许改 office 业务代码" />
    <div class="err" id="dlgErr"></div>
    <div class="dlg-actions">
      <button type="button" id="btnCancel">取消</button>
      <button type="submit" class="primary" id="btnCreate">创建</button>
    </div>
  </form>
</dialog>

<script>
// dock 模式：右栏（380px）用单列布局。同一个文件两种布局，
// 避免维护两份 UI（那必然漂移）。
const DOCK_MODE = new URLSearchParams(location.search).get('dock') === '1';
if (DOCK_MODE) document.body.classList.add('dock');

'use strict';

// 这个页面只做三件事：调 IPC、渲染、把"不确定"如实呈现。
// 所有业务语义都在主进程（src/ipc-mission.js → src/mission/**）。

const api = (action, payload) => window.dshShell.mission(action, payload);

// P4：错误提示的分级（S2）。
//
// 第一性原理：不是所有错误都该"人话化"，但**都不该只给 code**。
//
//   · 用户能处理的（参数填错、文件不存在）→ 给可执行建议
//   · 用户不能处理的（内部状态、窗口没接上）→ 一句人话 + **保留 code**
//
// 关键是**不能丢掉 code**——那是排查的唯一线索。所以格式是
// 「人话（代码 XXX）」，而不是二选一。
// 所有用户可见的错误都必须经 explainFailure —— 不要直接 alert(r.reason)。
//
// 第一性原理：为什么
//   r.reason 是**给开发者看的**（可能含 code、字段名、内部术语）。
//   explainFailure 做两件事：
//     ① 查 ERROR_HINTS 给一句人话 + 一条**可执行**的建议
//     ② 兜底时也保证不是一串技术黑话
//
//   本项目已经踩过"错误提示只给 code"的坑（P4 的错误分级就是为此加的）。
//   但代码里仍有 5 处直接 alert(r.reason) 绕过了它 —— 那些地方用户
//   看到的是技术原文，而且 alert 一关就没了。
const ERROR_HINTS = {
  MISSION_ID_REQUIRED: '没有选中 Mission',
  WORKSTREAM_ID_REQUIRED: '先创建一个工作流',
  MISSION_PATCH_EMPTY: '没有改动',
  DELIVERABLE_INVALID: '产物路径不对（文件不存在，或不在工作区里）',
  DECISION_INVALID: '决策内容不完整（决定和理由都要填）',
  QUESTION_INVALID: '问题内容不完整',
  STATUS_INVALID: '状态值不对',
  TASK_REF_STATUS_FORBIDDEN: '任务状态由 Harness 拥有，Mission 不保存它',
  DESK_UNAVAILABLE: 'Mission Desk 窗口还没接上',
  DESK_OPEN_FAILED: '打开窗口失败',
  MISSION_APPEND_FAILED: '写入失败（磁盘可能满了或没有权限）',
  UNKNOWN_ACTION: '这个操作还没有实现',
};

/** 把一次失败翻译成「人话（代码）」。永远保留 code。 */
function explainFailure(r) {
  const code = (r && (r.code || (r.reason && /^[A-Z_]{3,}$/.test(r.reason) ? r.reason : null))) || null;
  const hint = code && ERROR_HINTS[code];
  if (hint) return `${hint}（${code}）`;
  // 没有映射时：如果 reason 本身像一句话就直接用，否则回退到通用文案
  const reason = r && r.reason;
  if (typeof reason === 'string' && reason.length > 0 && !/^[A-Z_]{3,}$/.test(reason)) {
    return code ? `${reason}（${code}）` : reason;
  }
  return code ? `操作失败（${code}）` : '操作失败，请重试';
}

const state = {
  // 折叠区的展开状态，按标题记住。
  //
  // 第一性原理：为什么折叠状态必须跨刷新保留
  //
  //   右栏刷新很频繁（任何表单提交都会触发）。如果折叠状态是纯局部的，
  //   那么用户展开「交付物」查看内容 → 随手记一条决策 → 交付物**自动合上**。
  //   他必须重新展开 —— 而他甚至不知道是谁合上的。
  //
  //   折叠状态是**用户的意图**（"我现在想看这个"），不是渲染产物。
  //   用户的意图不该被刷新抹掉。
  //
  //   注意：这是**会话内**记忆，不落盘。理由是它属于"此刻的浏览状态"，
  //   重启后从头开始是合理的。
  collapsed: {},
  // 内联表单的草稿（正在填但还没提交的内容）。
  //
  // 第一性原理：为什么必须保护它
  //
  //   refresh() 会重建整个详情区 DOM。如果用户正在「任务改写」表单里打字，
  //   而此时任意一个操作触发了刷新，表单会消失、内容全丢——
  //   他刚打的几十个字没了，而且没有任何提示。
  //
  //   这是**数据丢失**，比"要点两次"严重得多。用户会开始不信任这个界面。
  //
  //   结构：{ key: { kind, args, values: {...} } }
  //     key 标识是哪个表单（不同任务/不同成员各自独立）
  draft: {},
  // 草稿对应的展开动作，刷新后用它把表单重新打开
  draftRestore: null,
  missions: [],
  selectedId: null,
  detail: null,
  brief: null,
  verified: null,
  syncState: null,
  attention: null,
  since: null,
  projections: null,
  boundSession: null,
  workStatus: null,
  liveAvailable: false,
};

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

/** 把 observedAtMs 渲染成"x 秒前"，而不是一个绝对时间戳。
 *  理由：用户关心的是"这个信息有多新"，不是"哪一刻"。

 *  注意：**没有时间戳就返回 null**，调用方必须显示"不可用"，
 *  绝不能退化成"未运行"。 */
function relativeTime(observedAtMs) {
  if (!Number.isFinite(observedAtMs)) return null;
  const deltaSec = Math.max(0, Math.round((Date.now() - observedAtMs) / 1000));
  if (deltaSec < 5) return '刚刚';
  if (deltaSec < 60) return deltaSec + ' 秒前';
  const m = Math.floor(deltaSec / 60);
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  return h + ' 小时前';
}

// ------------------------------------------------------------------ 渲染

// dock 模式：下拉切换 Mission。复用与列表点击同一条路径。
function bindDockPicker() {
  const select = $('dockSelect');
  if (!select) return;
  select.addEventListener('change', async () => {
    const id = select.value;
    if (!id || id === state.selectedId) return;
    state.selectedId = id;
    renderList();
    await loadDetail(id);
  });
}

function renderList() {
  const box = $('list');
  box.textContent = '';
  const active = state.missions.filter((m) => m.status === 'active');

  // dock 模式：用下拉替代列表
  const select = $('dockSelect');
  if (select) {
    select.textContent = '';
    if (state.missions.length === 0) {
      select.append(el('option', { value: '', text: '（还没有 Mission）' }));
    } else {
      for (const m of state.missions) {
        const opt = el('option', { value: m.missionId, text: m.title || m.missionId });
        if (state.selectedId === m.missionId) opt.selected = true;
        select.append(opt);
      }
    }
  }

  if (state.missions.length === 0) {
    // 空状态不是"占位文案"。新用户看到的第一屏应该是**明确的第一步**，
    // 而不是一句被动的"还没有"。
    //
    // 设计原则（P4 §5）：
    //   ❌ 显示"暂无数据" → 用户不知道该做什么
    //   ✅ 告诉用户下一步做什么，且**只提示最关键的那一个动作**
    box.append(el('div', { class: 'empty-lead', text: '从这里开始' }));
    box.append(el('div', { class: 'empty-body',
      text: '一个 Mission 就是一件你想让 AI 团队做成的事。给它一个标题和目标，之后所有会话、决策、产物都挂在它下面 —— 关掉再打开也不会丢。' }));
    const cta = el('button', { class: 'primary', text: '创建第一个 Mission' });
    cta.addEventListener('click', () => {
      // 复用已有的新建流程，不重复实现
      const openBtn = [...document.querySelectorAll('button')]
        .find((b) => b.textContent && b.textContent.includes('新建 Mission'));
      if (openBtn) openBtn.click();
    });
    box.append(cta);
    $('counts').textContent = '';
    return;
  }

  // 软上限提示：**只提示，不阻止**（domain-model §2.1.1）
  $('counts').textContent =
    '进行中 ' + active.length + ' / 共 ' + state.missions.length;

  for (const m of state.missions) {
    const row = el('div', { class: 'row' });
    row.append(el('span', { class: 'badge ' + m.status, text: m.status }));

    // Running 是 Harness 的事实，必须与 status 分开显示且带时间
    const live = m.live || {};
    if (live.available) {
      const t = relativeTime(live.observedAtMs);
      const dot = el('span', { class: 'dot' + (live.hasRunningAgent ? ' on' : '') });
      row.append(el('span', { class: 'live' }, [dot, document.createTextNode(
        live.hasRunningAgent ? 'Agent 在跑 · ' + t : '无 Agent · ' + t)]));
    } else {
      // 关键：不可用时明说，不显示灰点假装"未运行"
      const dot = el('span', { class: 'dot unknown' });
      row.append(el('span', { class: 'live' }, [dot, document.createTextNode('实时状态不可用')]));
    }
    if (live.awaitingUser) {
      row.append(el('span', { class: 'badge', text: '等你决定' }));
    }

    const card = el('div', {
      class: 'card' + (m.missionId === state.selectedId ? ' sel' : ''),
      role: 'button',
      tabindex: '0',
    }, [el('div', { class: 'title', text: m.title }), row]);

    card.addEventListener('click', () => selectMission(m.missionId));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectMission(m.missionId); }
    });
    box.append(card);
  }

  if (active.length > 10) {
    // 软提示（不是硬限制）：建议整理，但绝不阻止
    box.append(el('div', {
      class: 'soft-hint',
      text: '你有 ' + active.length + ' 个进行中的 Mission。考虑归档一些？这只是提醒，不影响创建。',
    }));
  }
}

// ---------------------------------------------------------------- 待办区（L1）
//
// 第一性原理：待办不是"多一个区块"，是**排序机制**。
//
//   做成普通区块 = 又多了一个要用户自己找的地方。
//   正确做法：有 todo 时它占最顶部并压缩其他区块的视觉重量；
//   没有 todo 时那一行变成"团队运行正常"——**这句本身就是有价值的信号**。
//
//   两个硬约束：
//     · 零待办时也要占位（否则用户不确定"是真的没有还是加载失败"）
//     · 每张卡必须能直接处理（只显示不能点 = 用户还得去别处找）

const RISK_LABEL = { high: '高', medium: '中', low: '低' };
const FINDING_LABEL = { unverified: '待验证', verified: '已验证', refuted: '已推翻' };
const ASSUMPTION_LABEL = { unverified: '未验证', holding: '仍成立', violated: '已推翻', expired: '已过期' };
const CONF_LABEL = { low: '低', medium: '中', high: '高' };
const EVIDENCE_LABEL = { file: '文件', commit: '提交', url: '链接', command: '命令', observation: '观察' };
const KIND_LABEL = { approval: '审批', question: '提问' };

/**
 * 决策列表 + 就地记录表单。
 *
 * 为什么单独一个函数而不走 renderEntitySection：
 *   · 决策多一个必填的「理由」（rationale）——那正是"不丢决策"的核心
 *   · 决策的 accepted/proposed 区分有治理语义，不能混进通用徽章
 *   · 决策没有状态推进按钮（不要"提议→接受"的就地切换，
 *     那会让用户误以为模型可以自己拍板）
 *
 * 共同点（列表 + 空态 + 表单 + 失败提示）仍然复用 el()/explainFailure。
 */
/**
 * 未决问题：列表 + 就地回答 + 就地提问。
 *
 * 第一性原理：只能答不能问，等于这一节的内容全部来自外部（模型/他人），
 * 用户自己无法把脑子里的疑问放进去。
 *
 * 它与 renderDecisions 是配对的：
 *   决策 = 已经想清楚的；未决问题 = 还没想清楚的。
 * 两者都是 Shared Context 的入口，只做一半等于只记结论不记悬念。
 */
function renderOpenQuestions(questions, m) {
  const open = questions.filter((q) => q.status === 'open');
  const box = el('div', { class: 'entity-section' });
  box.append(el('h2', { text: '未决问题' }));

  if (open.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '没有未决问题。' }));
  } else {
    const ul = el('ul', {});
    for (const q of open) {
      const li = el('li', {});
      li.append(el('div', { text: q.text }));
      const wrap = el('div', { class: 'row', style: 'margin-top:4px' });
      const input = el('input', { placeholder: '回答…', style: 'flex:1;min-width:120px' });
      const btn = el('button', { text: '回答' });
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        let r;
        try {
          r = await api('answerQuestion', {
            questionId: q.questionId, answer: input.value, missionId: m.missionId,
          });
        } catch (e) { r = { ok: false, reason: e.message }; }
        btn.disabled = false;
        if (!r || !r.ok) { alert(explainFailure(r || {})); return; }
        await refresh();
      });
      wrap.append(input, btn);
      li.append(wrap);
      ul.append(li);
    }
    box.append(ul);
  }

  // 就地提问
  const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
  const qInput = el('input', { placeholder: '有什么还没想清楚的…', style: 'flex:1;min-width:180px' });
  const askBtn = el('button', { text: '记下这个问题' });
  const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
  askBtn.addEventListener('click', async () => {
    msg.textContent = '';
    if (!qInput.value.trim()) { msg.textContent = '请填写问题内容'; return; }
    askBtn.disabled = true;
    let r;
    try { r = await api('openQuestion', { missionId: m.missionId, text: qInput.value.trim() }); }
    catch (e) { r = { ok: false, reason: e.message }; }
    askBtn.disabled = false;
    if (r && r.ok) { qInput.value = ''; await refresh(); }
    else { msg.textContent = explainFailure(r); }
  });
  wrap.append(qInput, askBtn, msg);
  box.append(wrap);
  return box;
}


/**
 * 工作流：列表 + 就地状态切换 + 新建。
 *
 * 第一性原理：阻塞是高频动作，必须能**就地**标记——
 * 再开一个编辑弹窗会让用户放弃标记，于是状态永远不更新。
 */
function renderWorkstreams(v, m) {
  const box = el('div', { class: 'entity-section' });
    box.append(el('h2', { text: '工作流' }));
    if (!v.workstreams || v.workstreams.length === 0) {
      box.append(el('div', { class: 'muted tiny', text: '还没有工作流。' }));
    } else {
      const ul = el('ul', {});
      for (const w of v.workstreams) {
        const li = el('li', {});
        const row = el('div', { class: 'row', style: 'gap:6px;align-items:center' });
        row.append(el('span', { text: '[' + w.status + '] ' + w.title, style: 'flex:1' }));
        // 状态切换：阻塞是一个高频动作，必须能就地标记，
        // 而不是"再开一个编辑弹窗"。
        for (const next of ['active', 'blocked', 'done'].filter((x) => x !== w.status)) {
          const b = el('button', {
            text: next === 'active' ? '进行中' : (next === 'blocked' ? '阻塞' : '完成'),
            class: 'tiny',
          });
          b.addEventListener('click', async () => {
            b.disabled = true;
            const r = await api('updateWorkstreamStatus', {
              missionId: m.missionId, workstreamId: w.workstreamId, to: next,
            });
            b.disabled = false;
            if (r && r.ok) await refresh();
            else alert(explainFailure(r));
          });
          row.append(b);
        }
        li.append(row);
        ul.append(li);
      }
      box.append(ul);
    }
    {
      // 新建工作流（就地表单）
      const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
      const title = el('input', { placeholder: '新工作流名称…', style: 'flex:1;min-width:160px' });
      const btn = el('button', { text: '新建工作流' });
      const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
      btn.addEventListener('click', async () => {
        msg.textContent = '';
        if (!title.value.trim()) { msg.textContent = '请填写名称'; return; }
        btn.disabled = true;
        let r;
        try { r = await api('addWorkstream', { missionId: m.missionId, title: title.value.trim() }); }
        catch (e) { r = { ok: false, reason: e.message }; }
        btn.disabled = false;
        if (r && r.ok) { title.value = ''; await refresh(); }
        else { msg.textContent = explainFailure(r); }
      });
      wrap.append(title, btn, msg);
      box.append(wrap);
    }
  return box;
}

/**
 * 关联的执行（TaskRef）：Mission 与 Harness 之间**唯一**的连接点。
 *
 * 边界：这里只显示"哪次执行属于哪个工作流"，**不显示任务状态**。
 * 任务状态归 Harness；Mission 再存一份就是两个事实作者（铁律 1）。
 */
function renderTaskRefs(v, m) {
  const box = el('div', { class: 'entity-section' });
    box.append(el('h2', { text: '关联的执行' }));
    const refs = v.taskRefs || [];
    if (refs.length === 0) {
      box.append(el('div', { class: 'muted tiny', text: '还没有关联任何执行。' }));
    } else {
      const ul = el('ul', {});
      for (const t of refs) {
        const li = el('li', {});
        const ws = (v.workstreams || []).find((w) => w.workstreamId === t.workstreamId);
        li.append(el('div', { text: (t.summary || '（无摘要）') }));
        li.append(el('div', {
          class: 'muted tiny',
          // harnessRef 是派生句柄，不是 sessionId —— 单独标出来，
          // 让读的人知道点这里也反查不到原始会话。
          text: `属于工作流：${ws ? ws.title : t.workstreamId} · 句柄 ${t.harnessRef}`,
        }));
        ul.append(li);
      }
      box.append(ul);
    }
    {
      // 关联一次执行（就地表单）
      const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
      const wsSel = el('select', { style: 'flex:1;min-width:120px' });
      for (const w of (v.workstreams || [])) {
        wsSel.append(el('option', { value: w.workstreamId, text: w.title }));
      }
      const summary = el('input', { placeholder: '这次执行做了什么…', style: 'flex:2;min-width:160px' });
      const btn = el('button', { text: '关联执行' });
      const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
      btn.addEventListener('click', async () => {
        msg.textContent = '';
        const workstreamId = wsSel.value;
        if (!workstreamId) { msg.textContent = '请先新建一个工作流'; return; }
        if (!summary.value.trim()) { msg.textContent = '请填写摘要 —— 不然下次看到这个句柄不知道它是什么'; return; }
        btn.disabled = true;
        let r;
        try {
          r = await api('linkTaskRef', {
            missionId: m.missionId,
            workstreamId,
            // 这里本来该由 Harness 提供真实 sessionId；离线/无 runtime 时
            // 用一个明确的占位值，并让用户在摘要里写清楚。
            // 绝不伪造一个"看起来像真的" sessionId —— 那会让人以为能反查。
            sessionId: state.linkSessionId || 'manual-link',
            summary: summary.value.trim(),
          });
        } catch (e) { r = { ok: false, reason: e.message }; }
        btn.disabled = false;
        if (r && r.ok) { summary.value = ''; await refresh(); }
        else { msg.textContent = explainFailure(r); }
      });
      wrap.append(wsSel, summary, btn, msg);
      box.append(wrap);
    }
  return box;
}

/**
 * 产物：已登记的交付物 + 校验状态 + 登记表单。
 *
 * 只存相对路径 + digest；绝对路径是隐私边界。
 */
function renderDeliverables(v, m) {
  const box = el('div', { class: 'entity-section' });
    box.append(el('h2', { text: '产物' }));
    const ver = state.verified;
    if (!v.deliverables || v.deliverables.length === 0) {
      box.append(el('div', { class: 'muted tiny', text: '还没有登记产物。' }));
    } else {
      for (const d of v.deliverables) {
        const res = ver && ver.results ? ver.results.find((x) => x.deliverableId === d.deliverableId) : null;
        const status = res ? res.status : 'unchecked';
        const box2 = el('div', { class: 'deliv' });
        const row = el('div', { class: 'row' });
        row.append(el('span', { text: d.label }));
        row.append(el('span', { class: 'status st-' + status, text: status }));
        box2.append(row);
        box2.append(el('div', { class: 'muted tiny', text: d.relPath + ' · sha256:' + String(d.digest).slice(0, 12) + '…' }));
        if (res && res.status === 'modified') {
          box2.append(el('div', { class: 'tiny', text: '内容已变化（登记时 ' + String(res.expected).slice(0, 8) + '… → 现在 ' + String(res.actual).slice(0, 8) + '…）' }));
        }
        if (res && res.status === 'missing') {
          box2.append(el('div', { class: 'tiny', text: '文件已不存在：' + res.reason }));
        }
        box.append(box2);
      }
      const verifyBtn = el('button', { text: '校验产物是否仍是当时那一版' });
      verifyBtn.addEventListener('click', async () => {
        const r = await api('verifyDeliverables', { missionId: m.missionId });
        if (!r.ok) { alert(explainFailure(r)); return; }
        state.verified = r;
        renderDetail();
      });
      box.append(verifyBtn);
    }

    {
      // 登记产物。关键设计：registerDeliverable 会**真的读文件算 sha256**，
      // 所以"登记成功"本身就证明文件存在。用户填一个不存在的路径会被拒绝——
      // 这比"只存一个路径字符串"强得多（V3「产物是真实文件」的机械保证）。
      const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
      const label = el('input', { placeholder: '产物名称…', style: 'flex:1;min-width:120px' });
      const rel = el('input', { placeholder: '相对工作区的路径，如 docs/report.md', style: 'flex:2;min-width:180px' });
      const btn = el('button', { text: '登记产物' });
      const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
      btn.addEventListener('click', async () => {
        msg.textContent = '';
        if (!label.value.trim()) { msg.textContent = '请填写产物名称'; return; }
        if (!rel.value.trim()) { msg.textContent = '请填写相对路径'; return; }
        btn.disabled = true;
        let r;
        try {
          r = await api('registerDeliverable', {
            missionId: m.missionId,
            label: label.value.trim(),
            relPath: rel.value.trim(),
          });
        } catch (e) { r = { ok: false, reason: e.message }; }
        btn.disabled = false;
        if (r && r.ok) { label.value = ''; rel.value = ''; await refresh(); }
        else {
          // 失败原因很有信息量：文件不存在 / 是目录 / 路径越界
          msg.textContent = explainFailure(r);
        }
      });
      wrap.append(label, rel, btn, msg);
      box.append(wrap);
    }
  return box;
}

/**
 * Brief 预览/同步 + 诊断信息。
 *
 * Brief 是"下次会话 Agent 会读到的东西"——它必须可见，
 * 否则用户不知道跨会话到底传了什么过去。
 */
function renderBriefAndDiagnostics(v, m) {
  const box = el('div', { class: 'entity-section' });
    box.append(el('h2', { text: 'Mission Brief（下次会话 Agent 会读到这个）' }));
    if (!state.brief) {
      box.append(el('div', { class: 'muted tiny', text: '正在生成…' }));
    } else if (state.brief.empty) {
      box.append(el('div', { class: 'muted tiny', text: 'Brief 为空。' }));
    } else {
      box.append(el('div', {
        class: 'tiny muted',
        text: state.brief.bytes + ' 字节'
          + (state.brief.truncated ? ' · 已截断（省略了 ' + JSON.stringify(state.brief.dropped) + '）' : ' · 未截断'),
      }));
      box.append(el('pre', { id: 'briefText', text: state.brief.text }));

      // ---- 同步到 AGENTS.md（这一步让 Brief 真正生效）----
      // 为什么需要用户主动点：它会写入用户工作区里的 AGENTS.md 文件。
      // 自动写用户文件是越界行为——即使内容是"有用的"。
      const syncRow = el('div', { class: 'row', style: 'margin-top:10px' });

      const syncState = state.syncState || { synced: false };
      if (syncState.synced && syncState.missionId === m.missionId) {
        syncRow.append(el('span', { class: 'badge active', text: '已同步到 AGENTS.md' }));
        const unBtn = el('button', { text: '撤销同步' });
        unBtn.addEventListener('click', async () => {
          const r = await api('unsyncBrief');
          if (!r.ok) { alert(explainFailure(r)); return; }
          state.syncState = { synced: false };
          renderDetail();
        });
        syncRow.append(unBtn);
      } else {
        const btn = el('button', { class: 'primary', text: '同步到 AGENTS.md' });
        btn.addEventListener('click', async () => {
          const r = await api('syncBrief', { missionId: m.missionId });
          if (!r.ok) { alert(explainFailure(r)); return; }
          const st = await api('briefSyncState');
          state.syncState = st.ok ? st : { synced: false };
          renderDetail();
        });
        syncRow.append(btn);
        syncRow.append(el('span', {
          class: 'tiny muted',
          text: '写入工作区的 AGENTS.md，下次会话 Agent 会自动读到。不会覆盖你手写的内容。',
        }));
      }
      box.append(syncRow);
    }

    // --- 诊断 ---
    const diagBtn = el('button', { text: '诊断（日志健康 / 备份 / 迁移）' });
    diagBtn.style.marginTop = '18px';
    diagBtn.addEventListener('click', async () => {
      const r = await api('diagnostics');
      if (!r.ok) { alert(explainFailure(r)); return; }
      // 不再把原始 JSON 甩给用户（2026-11-04）。
      //
      // 第一性原理：诊断信息是给"排查问题"用的，而用户排查问题时
      // 需要的是"哪里不对"，不是一段需要自己解析的 JSON。
      // 现在：先用人话总结，原始数据折叠在下面供需要时查看。
      showDiagnostics(r);
    });
    box.append(diagBtn);
  return box;
}

/**
 * 诊断结果的展示：人话在前，原始数据在后。
 *
 * 第一性原理：为什么不能直接把 JSON 弹出来
 *
 *   用户点"诊断"是因为**他觉得出了问题**。这时他要的是"哪里不对"，
 *   而不是一段需要自己解析的 JSON。原文仍然保留（排查时有用），
 *   但必须放在人话之后、且默认收起。
 */
function showDiagnostics(r) {
  const d = r && r.report ? r.report : r;
  const wrap = el('div', { class: 'diag-panel' });

  const head = el('div', { class: 'diag-head' });
  head.append(el('span', { text: '诊断结果' }));
  const close = el('button', { class: 'diag-close', text: '关闭' });
  close.addEventListener('click', () => wrap.remove());
  head.append(close);
  wrap.append(head);

  // 人话总结：只挑几个用户能理解的信号
  const healthy = d && d.healthy;
  const lines = [];
  if (healthy === true) lines.push('✓ 事件日志健康');
  else if (healthy === false) lines.push('✗ 事件日志有问题（见下方原始数据）');
  if (d && Number.isFinite(d.eventCount)) lines.push('事件数：' + d.eventCount);
  if (d && Array.isArray(d.badLines) && d.badLines.length) lines.push('损坏行：' + d.badLines.length);
  if (d && Array.isArray(d.gaps) && d.gaps.length) lines.push('缺口：' + d.gaps.length);
  if (lines.length === 0) lines.push('（没有可读的健康信号，见原始数据）');
  for (const ln of lines) wrap.append(el('div', { class: 'diag-line', text: ln }));

  // 原始数据：默认收起
  const toggle = el('button', { class: 'diag-toggle', text: '查看原始数据' });
  const raw = el('pre', { class: 'diag-raw', text: JSON.stringify(r, null, 2) });
  raw.style.display = 'none';
  toggle.addEventListener('click', () => {
    const open = raw.style.display !== 'none';
    raw.style.display = open ? 'none' : 'block';
    toggle.textContent = open ? '查看原始数据' : '收起原始数据';
  });
  wrap.append(toggle, raw);

  const host = document.getElementById('detail');
  if (host) host.append(wrap);
}

function renderDecisions(decisions, m) {
  const box = el('div', { class: 'entity-section' });
  box.append(el('h2', { text: '决策（含理由）' }));

  if (decisions.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: '还没有记录决策。' }));
  } else {
    const ul = el('ul', {});
    for (const d of decisions) {
      const li = el('li', {});
      const head = el('div', {
        text: d.text + (d.status === 'superseded'
          ? '（已被 ' + (d.supersededBy || '?') + ' 取代）' : ''),
      });
      // proposed 与 accepted 必须分得清，否则"模型提议"会被误读成"已经拍板"
      head.append(el('span', {
        class: 'tiny',
        style: d.status === 'accepted'
          ? 'margin-left:6px;color:var(--att-ok-fg)'
          : 'margin-left:6px;color:var(--att-warn-fg)',
        text: d.status === 'accepted' ? '已接受'
          : (d.status === 'proposed' ? '提议中' : d.status),
      }));
      li.append(head);
      li.append(el('div', { class: 'muted tiny', text: '为什么：' + d.rationale }));
      ul.append(li);
    }
    box.append(ul);
  }

  // 就地记录：决定 + 为什么（理由必填）
  //
  // 第一性原理：表单不该常驻。
  //
  //   记录决策是**低频动作**（一个 Mission 通常几条），而一个常驻的两输入框
  //   占掉约 70px。在 380px 右栏里，这等于把"进展"挤下去一截。
  //   所以：有决策时（说明用户在用这个功能）直接展开；没有时收成一行。
  const formToggle = el('button', { class: 'coll-head', style: 'padding:6px 0' });
  formToggle.append(el('span', { class: 'coll-caret', text: decisions.length ? '▾' : '▸' }));
  formToggle.append(el('span', { class: 'coll-title', text: '记录一条决策' }));
  box.append(formToggle);

  // 这个折叠用的是 'flex' 而非 block，所以它不能直接套 collapsibleSection。
  // 但**状态记忆必须一致**（2026-11-04 由探针发现）：
  //   用户展开"记录一条决策"→ 提交 → 刷新 → 表单又合上了。
  //   与其它折叠区行为不一致，用户会觉得"这里坏了"。
  const COLLAPSE_KEY = '决策表单';
  const remembered = state.collapsed[COLLAPSE_KEY];
  const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
  wrap.style.display = (remembered === undefined ? decisions.length > 0 : remembered) ? 'flex' : 'none';
  formToggle.querySelector('.coll-caret').textContent = wrap.style.display === 'none' ? '▸' : '▾';
  formToggle.addEventListener('click', () => {
    const open = wrap.style.display !== 'none';
    wrap.style.display = open ? 'none' : 'flex';
    formToggle.querySelector('.coll-caret').textContent = open ? '▸' : '▾';
    state.collapsed[COLLAPSE_KEY] = !open;
  });
  const txt = el('input', { placeholder: '决定了什么…', style: 'flex:1;min-width:150px' });
  const why = el('input', { placeholder: '为什么（必填）…', style: 'flex:1;min-width:150px' });
  const btn = el('button', { text: '记录决策' });
  const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });
  btn.addEventListener('click', async () => {
    msg.textContent = '';
    if (!txt.value.trim()) { msg.textContent = '请填写决定内容'; return; }
    if (!why.value.trim()) {
      msg.textContent = '请填写理由 —— 没有理由的决策正是压缩会毁掉的东西';
      return;
    }
    btn.disabled = true;
    let r;
    try {
      r = await api('recordDecision', {
        missionId: m.missionId,
        text: txt.value.trim(),
        rationale: why.value.trim(),
        // 用户在 UI 里点"记录决策" = 用户自己拍的板
        status: 'accepted',
        decidedBy: 'user',
      });
    } catch (e) { r = { ok: false, reason: e.message }; }
    btn.disabled = false;
    if (r && r.ok) { txt.value = ''; why.value = ''; await refresh(); }
    else { msg.textContent = explainFailure(r); }
  });
  wrap.append(txt, why, btn, msg);
  box.append(wrap);
  return box;
}


/**
 * 通用的「结构化实体」区块渲染器。
 *
 * 第一性原理：发现 / 假设 / 证据三者结构同构——
 *   状态徽章 + 正文 + 元信息 + 状态推进入口 + 就地记录表单
 *
 * 之前是**三份几乎相同的 80 行代码**（共 219 行）。这违反高内聚：
 *   · 加一类实体就要复制 80 行
 *   · 改一处样式要改三处（实际已经漂移过：假设有 3 个状态转移，发现只有 2 个）
 *
 * 现在把差异做成**参数**，共性做成实现。
 *
 * 配置项：
 *   title        区块标题
 *   hint         空态文案
 *   items        实体数组
 *   idKey        主键字段名
 *   labelMap     状态 → 中文标签
 *   badgeClass   状态 → 徽章 class
 *   badgeText    可选：徽章文字（默认用 labelMap[status]）
 *   body         正文取值
 *   bodyClass    可选：正文额外 class
 *   meta         元信息一行
 *   transitions  状态推进按钮 [{ to, label, hideWhen }]
 *   apiAction    状态推进调用的 action（transitions 非空时必需）
 *   form         就地记录表单的形态：'finding' | 'assumption' | 'evidence'
 */
function renderEntitySection(cfg) {
  const items = Array.isArray(cfg.items) ? cfg.items : [];
  const box = el('div', { class: 'entity-section' });
  box.append(el('h2', { text: cfg.title }));

  if (items.length === 0) {
    box.append(el('div', { class: 'muted tiny', text: cfg.hint }));
  } else {
    const ul = el('ul', { class: 'sc-list' });
    for (const it of items) {
      const li = el('li', { class: 'sc-item' });
      const line = el('div', { class: 'sc-line' });
      line.append(el('span', {
        class: cfg.badgeClass(it),
        text: cfg.badgeText ? cfg.badgeText(it) : (cfg.labelMap[it.status] || it.status),
      }));
      line.append(el('span', { class: cfg.bodyClass || 'sc-text', text: cfg.body(it) }));
      li.append(line);

      const metaText = cfg.meta(it);
      if (metaText) li.append(el('div', { class: 'sc-meta', text: metaText }));

      // 状态推进：只显示当前状态允许转移的
      const transitions = (cfg.transitions || []).filter((t) => !t.hideWhen || !t.hideWhen(it));
      if (transitions.length > 0 && cfg.apiAction) {
        const acts = el('div', { class: 'row', style: 'margin-top:5px;gap:6px' });
        for (const t of transitions) {
          const btn = el('button', { class: 'att-btn', text: t.label });
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            let r;
            try {
              r = await api(cfg.apiAction, { [cfg.idKey]: it[cfg.idKey], to: t.to });
            } catch (e) { r = { ok: false, reason: e.message }; }
            btn.disabled = false;
            if (!r || !r.ok) { alert(explainFailure(r || {})); return; }
            await refresh();
          });
          acts.append(btn);
        }
        li.append(acts);
      }
      ul.append(li);
    }
    box.append(ul);
  }

  if (cfg.form) box.append(renderEntityForm(cfg));
  return box;
}

/**
 * 就地记录表单。
 *
 * 三种实体字段不同，所以这里是**唯一的差异点**（其它都走 renderEntitySection）。
 * 保持一个 switch 而不是三个函数，因为它们共享"输入 → 校验 → 提交 → 刷新"
 * 这条主流程，只有字段定义不同。
 */
function renderEntityForm(cfg) {
  const wrap = el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:6px' });
  const msg = el('div', { class: 'muted tiny', style: 'flex-basis:100%' });

  const submit = async (action, payload, label) => {
    msg.textContent = '';
    let r;
    try { r = await api(action, payload); } catch (e) { r = { ok: false, reason: e.message }; }
    if (!r || !r.ok) { msg.textContent = explainFailure(r || {}); return; }
    await refresh();
  };

  if (cfg.form === 'finding') {
    const text = el('input', { placeholder: '发现了什么事实…', style: 'flex:1;min-width:150px' });
    const conf = el('select', {});
    for (const [v, l] of [['low', '低'], ['medium', '中'], ['high', '高']]) {
      conf.append(el('option', { value: v, text: l }));
    }
    conf.value = 'medium';
    const btn = el('button', { text: '记录发现' });
    btn.addEventListener('click', async () => {
      const t = text.value.trim();
      if (!t) { msg.textContent = '请填写发现内容'; return; }
      btn.disabled = true;
      await submit('recordFinding', { missionId: state.detail.mission.missionId, text: t, confidence: conf.value });
      btn.disabled = false;
        text.value = '';
    });
    wrap.append(text, conf, btn);
  } else if (cfg.form === 'assumption') {
    const text = el('input', { placeholder: '我们暂时假设…', style: 'flex:1;min-width:150px' });
    const verify = el('input', { placeholder: '怎么验证它仍成立（可留空）', style: 'flex:1;min-width:150px' });
    const btn = el('button', { text: '记录假设' });
    btn.addEventListener('click', async () => {
      const t = text.value.trim();
      if (!t) { msg.textContent = '请填写假设内容'; return; }
      btn.disabled = true;
      const payload = { missionId: state.detail.mission.missionId, text: t };
      const v = verify.value.trim();
      if (v) payload.verification = v;
      await submit('recordAssumption', payload);
      btn.disabled = false;
      text.value = ''; verify.value = '';
    });
    wrap.append(text, verify, btn);
  } else if (cfg.form === 'evidence') {
    const kind = el('select', {});
    for (const [v, l] of [['commit', '提交'], ['file', '文件'], ['url', '链接'], ['command', '命令'], ['observation', '观察']]) {
      kind.append(el('option', { value: v, text: l }));
    }
    const ref = el('input', { placeholder: '引用（相对路径/commit/URL）', style: 'flex:1;min-width:130px' });
    const claim = el('input', { placeholder: '它支持什么结论（必填）', style: 'flex:1;min-width:130px' });
    const btn = el('button', { text: '记录证据' });
    btn.addEventListener('click', async () => {
      const rv = ref.value.trim();
      const cv = claim.value.trim();
      if (!rv || !cv) { msg.textContent = '引用和结论都要填'; return; }
      btn.disabled = true;
      await submit('recordEvidence', { missionId: state.detail.mission.missionId, kind: kind.value, ref: rv, claim: cv });
      btn.disabled = false;
      ref.value = ''; claim.value = '';
    });
    wrap.append(kind, ref, claim, btn);
  }

  wrap.append(msg);
  return wrap;
}


function renderAttention() {
  const a = state.attention;
  const wrap = el('div', { class: 'att' });
  if (!a) return wrap;

  // ---------------------------------------------------------------------
  // 消费后端 rail-order 的分层结果（S7）。
  //
  // 第一性原理：为什么"哪些算需要你"只能有**一个**判断处
  //
  //   后端 src/mission/rail-order.js 已经做了严格分层并配了 13 条测试：
  //     decision（approval/question/plan-review/conflict）→ 阻塞团队
  //     reminder（inbox/permission-risk/blocked/stale-owner）→ 不阻塞
  //   前端如果也判断一遍，两边规则迟早漂移，而漂移的表现是
  //   "某个审批被悄悄归到提醒里"——用户不会发现，团队会一直卡着。
  //
  //   所以前端只做**呈现**：拿 header 的计数与 tone 决定外观，
  //   拿 visible 决定首屏放哪几条，拿 overflow 决定要不要提示"还有 N 条"。
  // ---------------------------------------------------------------------
  const rail = a.rail || null;

  if (!a.available) {
    wrap.className = 'att att-clear';
    wrap.append(el('div', { class: 'att-head' }, [
      el('span', { text: '○ 待办状态未知' }),
    ]));
    wrap.append(el('div', { class: 'att-clear-msg',
      text: '运行时还没连上，所以现在无法确认有没有需要你处理的事。这不是"没有待办"。' }));
    return wrap;
  }

  const total = a.total || 0;

  // 一致性守卫：attention 说"没有待办"，但 live 说"有 1 个待审批"——
  // 这时**不能**显示"团队运行正常"，那是在撒谎。
  // 真机截图抓到过这种矛盾（测试 fixture 造出来的，但也可能真的发生：
  // 两条数据路径一条读 pendingItems 一条读计数）。
  const live = (state.detail && state.detail.live) || {};
  const livePending = (Number(live.pendingApprovals) || 0) + (Number(live.pendingQuestions) || 0);
  if (total === 0 && livePending > 0) {
    wrap.className = 'att att-clear';
    wrap.append(el('div', { class: 'att-head' }, [
      el('span', { text: '○ 待办数据不一致' }),
    ]));
    wrap.append(el('div', { class: 'att-clear-msg',
      text: '运行时报告有 ' + livePending + ' 件事等你处理，但明细还没拿到。'
        + '这不是"没有待办"——请到办公室里查看收件箱。' }));
    return wrap;
  }

  // ---------------------------------------------------------------
  // 两层分类（GPT 第三轮建议，我核对后采纳）
  //
  // 第一性原理：待办不能只有一个红框。
  //   · 所有东西都标红 → 用户学会无视红色 → 红色失效
  //   · 必须区分"必须你决定"和"只是提醒你看看"
  //
  // 第一层「需要你决策」：approval / question / plan-review
  //   这些**阻塞团队**，不回答就进行不下去 → 红框
  // 第二层「团队执行提醒」：排队输入 / 权限风险
  //   这些**不阻塞**，只是用户看不见会误判 → 中性框，可折叠
  //
  // 关键：第二层**没有数据就不显示**，不编造提醒。
  // ---------------------------------------------------------------
  const reminders = collectReminders();

  if (total === 0) {
    wrap.className = 'att att-clear';
    if (reminders.length === 0) {
      // 零待办也要占位——这是"你可以放心离开"的信号
      wrap.append(el('div', { class: 'att-head' }, [
        el('span', { text: '✓ 团队运行正常' }),
      ]));
      wrap.append(el('div', { class: 'att-clear-msg',
        text: '没有需要你处理的事。有新情况时会出现在这里。' }));
      return wrap;
    }
    // 没有待决策事项，但有执行提醒 —— 仍然要说"不用你决策"
    wrap.append(el('div', { class: 'att-head' }, [
      el('span', { text: '✓ 没有需要你决策的事' }),
    ]));
    wrap.append(el('div', { class: 'att-clear-msg',
      text: '团队在正常推进。下面只是执行状态提醒，不需要你处理。' }));
    appendReminders(wrap, reminders);
    return wrap;
  }

  wrap.className = 'att att-present';
  // 计数取后端的 header.decisionCount（"阻塞团队"的条数），
  // 不是 a.total（"所有待办"的条数）—— 两者差在提醒类。
  // 徽标上放的是"要你拍板几件事"，放错会让人以为有 9 件事要决策。
  const decisionCount = rail && rail.header && Number.isFinite(rail.header.decisionCount)
    ? rail.header.decisionCount : total;
  wrap.append(el('div', { class: 'att-head' }, [
    el('span', { text: '⚠ 需要你决策' }),
    el('span', { class: 'att-count', text: String(decisionCount) }),
  ]));

  for (const item of a.items || []) {
    const risk = item.risk || 'medium';
    const kind = item.kind || 'question';
    const row = el('div', { class: 'att-item', 'data-risk': risk, 'data-kind': kind });

    const line = el('div', { class: 'att-item-line' });
    line.append(el('span', { class: 'att-item-kind', text: KIND_LABEL[kind] || kind }));
    line.append(el('span', { class: 'att-item-text', text: item.summary || '（没有摘要）' }));
    row.append(line);

    const meta = [];
    if (item.toolName) meta.push(item.toolName);
    meta.push('风险 ' + (RISK_LABEL[risk] || risk));
    if (Number.isFinite(item.createdAtMs)) meta.push(relativeTime(item.createdAtMs));
    row.append(el('div', { class: 'att-item-meta', text: meta.join(' · ') }));

    // 操作：审批有两个选择，提问要输入答案
    const actions = el('div', { class: 'att-item-actions' });
    if (kind === 'approval') {
      const deny = el('button', { class: 'att-btn danger', text: '拒绝' });
      deny.addEventListener('click', () => answerPending(item, 'denied'));
      const allow = el('button', { class: 'att-btn primary', text: '允许' });
      allow.addEventListener('click', () => answerPending(item, 'granted'));
      actions.append(deny, allow);
    } else {
      // 提问：优先用运行时投影给出的**结构化选项**，拿不到才回落自由文本。
      //
      // 第一性原理：官方 ask_user_question 本来就带 `options`，
      // 做成文本框等于把"选一个"降级成"自己打字"——用户既不知道
      // 有哪些合法答案，也容易答出 Agent 无法解析的内容。
      //
      // 数据来源：session/projections 的 userQuestions.active[]（0.2.1 新增）。
      // 这是**只读**的；回答仍走 office:pending（已验证可用）。
      const struct = findStructuredQuestion(item);
      if (struct && struct.options.length > 0) {
        // ---- plan-review：先把计划内容露出来，再给选项 ----
        //
        // 第一性原理：plan-review 的 `detail` 是**计划的完整 markdown**。
        // 官方 Web UI 的做法是放进右侧栏独立 Tab（ctx.sidebarRight），
        // 但 380px 放不下整篇。
        //
        // 所以：**默认折叠**（只露前几行），点开展开在侧栏内滚动。
        // 不做弹窗、不跳页——用户正在看任务，不该被踢走。
        if (struct.intent && struct.intent.kind === 'plan-review') {
          actions.append(renderPlanReview(struct, item));
        }
        const opts = el('div', { class: 'att-options' });
        for (const opt of struct.options) {
          const btn = el('button', { class: 'att-btn', text: opt.label });
          // plan-review 的判定不能靠选项顺序（官方文档明确 named rather than
          // positional），所以这里只把 label 作为答案值，判定交给运行时。
          btn.addEventListener('click', () => answerPending(item, opt.label));
          opts.append(btn);
        }
        actions.append(opts);
        // 仍给自定义输入：官方 AskUserQuestionItem 允许自由输入
        const input = el('input', { placeholder: '或自定义回答…', style: 'flex:1;min-width:0' });
        const send = el('button', { class: 'att-btn', text: '发送' });
        send.addEventListener('click', () => {
          const v = input.value.trim();
          if (v) answerPending(item, v);
        });
        actions.append(input, send);
      } else {
        const input = el('input', { placeholder: '输入回答…', style: 'flex:1;min-width:0' });
        const send = el('button', { class: 'att-btn primary', text: '回答' });
        send.addEventListener('click', () => {
          const v = input.value.trim();
          if (v) answerPending(item, v);
        });
        actions.append(input, send);
      }
    }
    row.append(actions);
    wrap.append(row);
  }

  // 首屏放不下的决策项：**必须说出还有几条**。
  //
  // 第一性原理：静默截断是最危险的一种"省略"。
  //   如果后端只给前 3 条而前端不说"还有 4 条"，用户会以为就这些，
  //   于是漏掉真正紧急的那条（它按风险排序可能就在后面）。
  //   所以这里把 overflow 明确写出来。
  if (rail && rail.overflow && rail.overflow.decisions > 0) {
    wrap.append(el('div', { class: 'att-overflow',
      text: `还有 ${rail.overflow.decisions} 项待处理（按风险排序，展开可看全部）` }));
  }

  // 第一层之后才放第二层：用户先看到必须处理的，再看提醒。
  appendReminders(wrap, reminders);
  return wrap;
}

/**
 * 收集「团队执行提醒」——**只有真实数据源**，没有就不返回。
 *
 * 当前只有两个真实来源（都来自 session/projections）：
 *   1. inbox 排队输入：用户交代了但 agent 还没处理 → 用户会误以为没收到
 *   2. permissions 是 danger-full-access → 执行风险提示
 *
 * 刻意**不做**的（没有数据源，做了就是编造）：
 *   · TeamTask blockedBy：要启用 team profile，本轮不做
 *   · writeScopeWarnings：同上
 *   · "长时间无进展"：需要心跳+事件+任务的综合判断，本轮不做
 */
function collectReminders() {
  const out = [];
  const proj = state.projections;
  if (!proj) return out;

  const inbox = proj.inbox;
  if (inbox && (inbox.nextTurnCount > 0 || inbox.nextStepCount > 0)) {
    const parts = [];
    if (inbox.nextTurnCount > 0) parts.push(inbox.nextTurnCount + ' 条下一轮输入');
    if (inbox.nextStepCount > 0) parts.push(inbox.nextStepCount + ' 条下一步输入');
