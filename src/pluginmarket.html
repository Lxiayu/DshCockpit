<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>插件市场</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14171c; color: #e6edf3;
    font: 13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  #head { padding: 10px 12px; border-bottom: 1px solid #2d333b; display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; background: #1c2128; color: #e6edf3; border: 1px solid #2d333b;
    border-radius: 8px; padding: 7px 10px; font: inherit; outline: none; }
  #q:focus { border-color: #2563eb; }
  #list { overflow-y: auto; max-height: 430px; padding: 4px 12px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid #2d333b; }
  .item .info { flex: 1; }
  .item .name { font-weight: 600; }
  .item .meta { color: #8b949e; font-size: 11px; margin-top: 2px; }
  .item .desc { color: #8b949e; font-size: 12px; margin-top: 3px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  button.danger { background: #f85149; }
  button:disabled { opacity: .5; cursor: default; }
  button.mini { padding: 3px 10px; font-size: 11px; margin-top: 6px; }
  #status { padding: 8px 12px; color: #8b949e; font-size: 12px; white-space: pre-wrap; }
  #status.err { color: #f85149; }
  #status.ok { color: #3fb950; }
  #empty { color: #8b949e; padding: 20px 0; text-align: center; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #8b949e;
    border-top-color: #e6edf3; border-radius: 50%; margin-right: 8px; vertical-align: -1px;
    animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #op-tail { color: #8b949e; font-size: 11px; margin-top: 3px; max-width: 520px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="head">
  <input id="q" placeholder="" />
  <button id="btn-close">✕</button>
</div>
<div id="status"></div>
<div id="list"></div>
<script>
  const qEl = document.getElementById('q');
  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const btnClose = document.getElementById('btn-close');
  const L = {
    zh: { ph: '搜索插件（名称/描述，回车）…', loading: '正在搜索…', empty: '没有找到插件', install: '安装', remove: '卸载',
          close: '关闭', error: '操作失败：',
          btnInstalling: '安装中…', btnRemoving: '卸载中…',
          opInstall: '正在安装 {name}…', opRemove: '正在卸载 {name}…',
          stageResolve: '阶段：解析依赖', stageDownload: '阶段：下载', stageInstall: '阶段：安装依赖', stageCleanup: '阶段：清理残留…',
          busy: '另一个插件操作正在进行，请稍候…',
          installed: '✅ 已安装 {name}，运行时已自动重启；webUI 刷新后插件生效。若界面未刷新：',
          removed: '✅ 已卸载 {name}，运行时已自动重启。',
          installFailed: '❌ 安装失败：', removeFailed: '❌ 卸载失败：',
          restartNow: '立即重启运行时', restarting: '运行时重启中…' },
    en: { ph: 'Search plugins (Enter)…', loading: 'Searching…', empty: 'No plugins found', install: 'Install', remove: 'Remove',
          close: 'Close', error: 'Error: ',
          btnInstalling: 'Installing…', btnRemoving: 'Removing…',
          opInstall: 'Installing {name}…', opRemove: 'Removing {name}…',
          stageResolve: 'Stage: resolving', stageDownload: 'Stage: downloading', stageInstall: 'Stage: installing deps', stageCleanup: 'Stage: cleaning up…',
          busy: 'Another plugin operation is in progress; try again shortly…',
          installed: '✅ {name} installed; the runtime restarted automatically and the plugin applies once the webUI refreshes. If it did not:',
          removed: '✅ {name} removed; the runtime restarted automatically.',
          installFailed: '❌ Install failed: ', removeFailed: '❌ Remove failed: ',
          restartNow: 'Restart runtime now', restarting: 'Runtime restarting…' },
  };
  const STAGE_KEYS = { resolve: 'stageResolve', download: 'stageDownload', install: 'stageInstall', cleanup: 'stageCleanup' };
  let lang = 'zh';
  let acting = false;          // one plugin op at a time (mirrors the main-process guard)
  let pendingResearch = false; // search typed while an op runs; runs after it settles
  let opStage = '';
  let opStartedAt = 0;
  let opLabelEl = null;
  let opTailEl = null;
  let elapsedTimer = null;
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function fmt(s, vars) { return String(s).replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : '')); }
  btnClose.textContent = '✕';
  btnClose.title = L[lang].close;
  // live progress from the main process (stage inference + last output line)
  if (window.dshMarket.onProgress) {
    window.dshMarket.onProgress((info) => {
      if (!acting || !info) return;
      if (info.stage && STAGE_KEYS[info.stage]) opStage = L[lang][STAGE_KEYS[info.stage]];
      if (opTailEl && info.tail) opTailEl.textContent = info.tail;
      renderOpLabel();
    });
  }
  (async () => {
    try { const s = await window.dshMarket.getSettings(); lang = s.resolvedLanguage === 'en' ? 'en' : 'zh'; } catch {}
    qEl.placeholder = L[lang].ph;
    qEl.focus();
    await search('');
  })();
  async function search(keyword) {
    if (acting) { pendingResearch = true; return; } // never re-render buttons mid-op
    statusEl.textContent = L[lang].loading;
    statusEl.className = '';
    try {
      const r = await window.dshMarket.search(keyword || '');
      if (!r.ok) { statusEl.textContent = L[lang].error + r.reason; statusEl.className = 'err'; return; }
      render(r.plugins || []);
      statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = L[lang].error + e.message;
      statusEl.className = 'err';
    }
  }
  function renderOpLabel() {
    if (!opLabelEl) return;
    const base = fmt(actingInstall ? L[lang].opInstall : L[lang].opRemove, { name: actingName });
    const st = opStage ? ' · ' + opStage : '';
    opLabelEl.textContent = `${base}${st}（${Math.round((Date.now() - opStartedAt) / 1000)}s）`;
  }
  let actingInstall = false;
  let actingName = '';
  async function act(p, btn) {
    if (acting) return;
    acting = true;
    actingInstall = !p.installed;
    actingName = p.fullName;
    // disable every action button — a second concurrent install would corrupt
    // the web profile (the main-process guard rejects it too)
    listEl.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    btn.textContent = actingInstall ? L[lang].btnInstalling : L[lang].btnRemoving;
    statusEl.className = '';
    statusEl.innerHTML = '<span class="spin"></span><span id="op-label"></span><div id="op-tail"></div>';
    opLabelEl = document.getElementById('op-label');
    opTailEl = document.getElementById('op-tail');
    opStage = '';
    opStartedAt = Date.now();
    renderOpLabel();
    elapsedTimer = setInterval(renderOpLabel, 1_000);
    let r;
    try {
      r = await window.dshMarket.action(actingInstall ? 'install' : 'remove', p.fullName);
    } catch (e) {
      r = { ok: false, reason: e.message };
    }
    clearInterval(elapsedTimer);
    elapsedTimer = null;
    opLabelEl = opTailEl = null;
    if (r && r.ok) {
      statusEl.className = 'ok';
      statusEl.textContent = fmt(actingInstall ? L[lang].installed : L[lang].removed, { name: p.fullName });
      // manual fallback for "webUI did not refresh" (the runtime already
      // auto-restarted; this is idempotent and harmless)
      if (actingInstall) {
        const rb = document.createElement('button');
        rb.className = 'mini';
        rb.textContent = L[lang].restartNow;
        rb.addEventListener('click', async () => {
          rb.disabled = true;
          rb.textContent = L[lang].restarting;
          try { await window.dshMarket.restartRuntime(); } catch { /* main logs it */ }
        });
        statusEl.appendChild(document.createElement('br'));
        statusEl.appendChild(rb);
      }
    } else {
      const reason = r && r.code === 'busy' ? L[lang].busy : (r && r.reason) || '';
      statusEl.className = 'err';
      statusEl.textContent = (actingInstall ? L[lang].installFailed : L[lang].removeFailed) + reason;
    }
    acting = false;
    pendingResearch = false;
    await search(qEl.value); // re-render with fresh installed flags (re-enables buttons)
  }
  function render(plugins) {
    listEl.innerHTML = '';
    if (!plugins.length) {
      const d = document.createElement('div');
      d.id = 'empty';
      d.textContent = L[lang].empty;
      listEl.appendChild(d);
      return;
    }
    for (const p of plugins) {
      const item = document.createElement('div');
      item.className = 'item';
      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `<div class="name">${esc(p.fullName)}</div><div class="meta">★${esc(p.stars)} · ${esc(p.updated)}</div><div class="desc">${esc(p.description)}</div>`;
      const btn = document.createElement('button');
      btn.textContent = p.installed ? L[lang].remove : L[lang].install;
      if (p.installed) btn.classList.add('danger');
      btn.addEventListener('click', () => act(p, btn));
      item.appendChild(info);
      item.appendChild(btn);
      listEl.appendChild(item);
    }
  }
  let timer = null;
  qEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => search(qEl.value), 350);
  });
  qEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); search(qEl.value); }
    if (e.key === 'Escape') window.dshMarket.close();
  });
  btnClose.addEventListener('click', () => window.dshMarket.close());
</script>
</body>
</html>
