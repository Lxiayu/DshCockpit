# electron-builder configuration — portable ZIP distribution (industry standard
# for large Windows OSS, e.g. MaaAssistantArknights ships MAA-*-win-x64.zip).
# The release artifact is a zip: extract it anywhere and double-click
# "DshCockpit.exe" at its root. No installer, no admin, no NSIS compression
# stalls. Users can also run from source (npm start, see README).
appId: com.dshcockpit.app
productName: DshCockpit
directories:
  output: dist
  buildResources: resources
files:
  - "!**/*.map"
  - "!test/**/*"
  - "!.trial/**"
  - "!dist/**/*"
  - "!vendor/**/*"
asar: true
compression: normal
# Bundled runtime seed -> resources/runtime/<version> (install-and-use, no first-run download)
extraResources:
  - from: vendor/runtime
    to: runtime
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - target: zip
      arch:
        - x64
  icon: resources/icon.png
  artifactName: DshCockpit-${version}-win-${arch}.${ext}
# NSIS installer intentionally NOT used as the default (solid-compressing the
# 268MB runtime of small files stalls); can be built on demand with:
#   node scripts/build.js --win nsis
mac:
  target:
    # Universal single package (arm64+x64 merged). One package covers all Macs,
    # so CI only needs one macos-latest (Apple Silicon) runner — no Intel
    # runner (macos-13) queue stalls. No native modules in this app, so the
    # universal merge is just electron binaries (stable, ~330MB dmg).
    - target: zip
      arch:
        - universal
    - target: dmg
      arch:
        - universal
  icon: resources/icon.png
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Unsigned distribution (no Apple Developer ID yet). identity:null skips
  # code signing; hardenedRuntime MUST be false when unsigned, otherwise the
  # app may fail to launch. Users get a Gatekeeper prompt on first open — see
  # README "macOS 安装" for the one-time override. Flip to signing+notarization
  # later by setting CSC_LINK/CSC_KEY_PASSWORD/APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
  # APPLE_TEAM_ID env vars and removing the two lines below.
  identity: null
  hardenedRuntime: false
  artifactName: DshCockpit-${version}-mac-${arch}.${ext}
# Publish feed for electron-updater. Publishing uses env vars so the config
# never needs editing: set DSH_REPO_OWNER / DSH_REPO_NAME / GH_TOKEN and run
# `npm run publish:win`. Until then the shell fails silently on update checks.
publish:
  provider: github
  owner: ${env.DSH_REPO_OWNER}
  repo: ${env.DSH_REPO_NAME}
