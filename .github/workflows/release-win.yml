# Build & publish Windows x64 artifacts on tag push or manual run.
# Two distribution tracks (v0.3.0 D2/D5):
#   NSIS installer (.exe)  — PRIMARY: double-click install, per-user no UAC,
#                            in-app auto-update via electron-updater
#                            (latest.yml + .exe.blockmap differential).
#   Portable zip           — green/escape hatch, extract & double-click.
# Both share the same pruned bundled runtime seed. Unsigned for now; swap in
# CSC_LINK etc. for Authenticode later.
name: release-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 2026-09-26: 发布流水线不再用单元测试门禁 —— 见 CHANGELOG/提交说明：
  # 像素/抠像类用例依赖 Pillow 等 runner 侧工具链，Windows runner 上还出现过
  # 挂死（>30min）。测试改由 upstream-compat 工作流定时跑并邮件汇报结果；
  # 发布只保留构建 + 产物闸门（verify-dist / e2e-smoke）。
  build:
    name: build x64 win
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-26: 资产复现链/台账类测试要读 git 历史，浅克隆会全红
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Single source of truth for the bundled runtime: package.json
      # "runtimeVersion". Never "latest from registry" — a DeepSeek rc.9/rc.10
      # must NOT change what this release bundles.
      # D5: the packaged app-update.yml must point at the REAL GitHub repo
      # (build.js otherwise falls back to owner "local", which would make the
      # in-app updater 404 forever).
      - name: Set updater feed coordinates
        shell: bash
        run: |
          echo "DSH_REPO_OWNER=${{ github.repository_owner }}" >> "$GITHUB_ENV"
          echo "DSH_REPO_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Resolve runtime version
        id: rtv
        shell: bash
        run: echo "runtime_version=$(node -p "require('./package.json').runtimeVersion")" >> "$GITHUB_OUTPUT"

      # Cache the FINAL installed+validated seed (not just the npm download
      # cache): cold build installs once per OS/arch/version, warm builds skip
      # npm install entirely. Key is OS+arch+version scoped so a mac arm64 rc.8
      # seed (sharp/node-pty natives) never collides with Windows x64 rc.8 or
      # mac arm64 rc.7. v2 = manual cache-schema bump (see scripts/).
      - name: Cache bundled runtime
        uses: actions/cache@v4
        with:
          path: vendor/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rtv.outputs.runtime_version }}-v2

      # arborist reify of the dsh runtime (sharp etc.) can exceed Node's
      # default ~2GB V8 heap on CI — raise it for this step only; the packaging
      # step must not inherit it.
      - name: Prepare bundled runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/prepare-runtime.js --version ${{ steps.rtv.outputs.runtime_version }}

      - run: node scripts/build.js --win --x64 --publish never

      # A2 artifact-level gate: cold-boot the packaged exe from the extracted
      # zip layout, wait for the boot URL line, probe HTTP 200 — a red step
      # blocks the artifact upload.
      - name: E2E smoke (portable artifact)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/e2e-app | Out-Null
          $zip = (Get-ChildItem dist -Filter 'DshCockpit-*-win-x64.zip' | Select-Object -First 1).FullName
          tar -xf $zip -C dist/e2e-app
          $exe = (Get-ChildItem dist/e2e-app -Recurse -Filter DshCockpit.exe | Select-Object -First 1).FullName
          node scripts/e2e-smoke.js --expect-feed --app $exe --timeout 240000

      # SHA256SUMS for the release page (integrity check before running).
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '^(DshCockpit-.*\.(zip|exe|blockmap)|latest\.yml)$' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS-win.txt
          Get-Content dist/SHA256SUMS-win.txt

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          if-no-files-found: error
          path: |
            dist/DshCockpit-*-win-x64.zip
            dist/DshCockpit-*-win-x64.exe
            dist/DshCockpit-*-win-x64.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS-win.txt

  release:
    name: publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-26: 资产复现链/台账类测试要读 git 历史，浅克隆会全红
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body.md
          files: |
            artifacts/DshCockpit-*-win-x64.zip
            artifacts/DshCockpit-*-win-x64.exe
            artifacts/DshCockpit-*-win-x64.exe.blockmap
            artifacts/latest.yml
            artifacts/SHA256SUMS-win.txt
