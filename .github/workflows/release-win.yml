# Build & publish a Windows x64 portable .zip on tag push or manual run.
# Portable zip (no installer, no admin) — extract and double-click
# DshCockpit.exe. Unsigned for now; swap in CSC_LINK etc. for Authenticode later.
name: release-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build x64 win
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Reuse the ~256MB bundled dsh runtime across runs when the seed script
      # is unchanged. Key is platform-scoped (runtime-win-*) so it never
      # collides with the mac workflow's cache (sharp binary differs per OS).
      - name: Cache bundled runtime
        uses: actions/cache@v4
        with:
          path: vendor/runtime
          key: runtime-win-${{ hashFiles('scripts/prepare-runtime.js') }}

      - run: node scripts/prepare-runtime.js

      - run: node scripts/build.js --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          if-no-files-found: error
          path: |
            dist/DshCockpit-*-win-x64.zip

  release:
    name: publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body.md
          files: |
            artifacts/DshCockpit-*-win-x64.zip
