# Build & publish an arm64 macOS .dmg/.zip on tag push or manual run.
# arm64-only: the bundled dsh runtime ships arch-specific native modules
# (sharp), so universal merge fails. Single macos-latest (Apple Silicon)
# runner — no Intel runner queue stalls. Unsigned for now; swap in
# CSC_LINK / APPLE_* secrets later.
name: release-mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Reuse the ~256MB bundled dsh runtime across runs when the seed script
      # is unchanged — prepare-runtime.js skips the download if vendor/runtime
      # already exists, cutting CI time sharply on repeat runs.
      - name: Cache bundled runtime
        uses: actions/cache@v4
        with:
          path: vendor/runtime
          key: runtime-${{ hashFiles('scripts/prepare-runtime.js') }}

      - run: node scripts/prepare-runtime.js

      - run: node scripts/build.js --mac --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          if-no-files-found: error
          path: |
            dist/DshCockpit-*-mac-arm64.dmg
            dist/DshCockpit-*-mac-arm64.zip

  release:
    name: publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/DshCockpit-*-mac-arm64.dmg
            artifacts/DshCockpit-*-mac-arm64.zip
