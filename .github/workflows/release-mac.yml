# Build & publish macOS .dmg/.zip for both arm64 and x64 on tag push or manual run.
# Two parallel runners: macos-latest (Apple Silicon) for arm64, macos-13 (Intel)
# for x64 — each installs an arch-matching dsh runtime (the sharp native binary
# differs per arch, so a universal merge is not viable). Unsigned for now; swap
# in CSC_LINK / APPLE_* secrets later for signing + notarization.
#
# release depends only on arm64 so the Release goes live the moment the fast
# arm64 build finishes; the x64 build (macos-13 queue can stall) attaches its
# artifacts independently via upload-x64 without blocking the Release.
name: release-mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    name: build arm64 mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Single source of truth for the bundled runtime: package.json
      # "runtimeVersion". Never "latest from registry" — a DeepSeek rc.9/rc.10
      # must NOT change what this release bundles.
      # D5: the packaged app-update.yml must point at the REAL GitHub repo
      # (build.js otherwise falls back to owner "local", which would make the
      # in-app updater 404 forever).
      - name: Set updater feed coordinates
        run: |
          echo "DSH_REPO_OWNER=${{ github.repository_owner }}" >> "$GITHUB_ENV"
          echo "DSH_REPO_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Resolve runtime version
        id: rtv
        shell: bash
        run: echo "runtime_version=$(node -p "require('./package.json').runtimeVersion")" >> "$GITHUB_OUTPUT"

      # Cache the FINAL installed+validated seed (not just the npm download
      # cache): cold build installs once per OS/arch/version, warm builds skip
      # npm install entirely. v2 = manual cache-schema bump (see scripts/).
      - name: Cache bundled runtime
        uses: actions/cache@v4
        with:
          path: vendor/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rtv.outputs.runtime_version }}-v2

      # NODE_OPTIONS is scoped to this step only (npm cold install on the arm64
      # runner can exceed Node's default ~2GB heap; the packaging step does not
      # need it and must not inherit it).
      - name: Prepare bundled runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/prepare-runtime.js --version ${{ steps.rtv.outputs.runtime_version }}

      - run: node scripts/build.js --mac --arm64 --publish never

      # A2 artifact-level gate: cold-boot the packaged app, wait for the boot
      # URL line, probe HTTP 200 — a red step blocks the artifact upload.
      - name: E2E smoke (packaged artifact)
        run: node scripts/e2e-smoke.js --expect-feed --app dist/mac-arm64/DshCockpit.app/Contents/MacOS/DshCockpit --timeout 180000

      # D2 slim track: same shell, no bundled runtime seed (~100MB-class zip).
      # No E2E here — identical shell code already gated by the full artifact.
      - name: Build slim variant
        run: node scripts/build.js --mac --arm64 --slim dir

      - name: Generate SHA256SUMS
        run: |
          cd dist
          shasum -a 256 DshCockpit-*-mac-arm64*.zip DshCockpit-*-mac-arm64.dmg latest-mac.yml > SHA256SUMS-mac-arm64.txt 2>/dev/null || \
          shasum -a 256 DshCockpit-*-mac-arm64*.zip > SHA256SUMS-mac-arm64.txt
          cat SHA256SUMS-mac-arm64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          if-no-files-found: error
          path: |
            dist/DshCockpit-*-mac-arm64.dmg
            dist/DshCockpit-*-mac-arm64.zip
            dist/DshCockpit-*-slim-mac-arm64.zip
            dist/latest-mac.yml
            dist/SHA256SUMS-mac-arm64.txt

  build-x64:
    name: build x64 mac
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # D5: the packaged app-update.yml must point at the REAL GitHub repo
      # (build.js otherwise falls back to owner "local", which would make the
      # in-app updater 404 forever).
      - name: Set updater feed coordinates
        run: |
          echo "DSH_REPO_OWNER=${{ github.repository_owner }}" >> "$GITHUB_ENV"
          echo "DSH_REPO_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Resolve runtime version
        id: rtv
        shell: bash
        run: echo "runtime_version=$(node -p "require('./package.json').runtimeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache bundled runtime
        uses: actions/cache@v4
        with:
          path: vendor/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rtv.outputs.runtime_version }}-v2

      - name: Prepare bundled runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/prepare-runtime.js --version ${{ steps.rtv.outputs.runtime_version }}

      - run: node scripts/build.js --mac --x64 --publish never

      - name: E2E smoke (packaged artifact)
        run: node scripts/e2e-smoke.js --expect-feed --app dist/mac-x64/DshCockpit.app/Contents/MacOS/DshCockpit --timeout 180000

      - name: Build slim variant
        run: node scripts/build.js --mac --x64 --slim dir

      - name: Generate SHA256SUMS
        run: |
          cd dist
          shasum -a 256 DshCockpit-*-mac-x64*.zip DshCockpit-*-mac-x64.dmg > SHA256SUMS-mac-x64.txt
          cat SHA256SUMS-mac-x64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          if-no-files-found: error
          path: |
            dist/DshCockpit-*-mac-x64.dmg
            dist/DshCockpit-*-mac-x64.zip
            dist/DshCockpit-*-slim-mac-x64.zip
            dist/SHA256SUMS-mac-x64.txt

  release:
    name: publish to GitHub Releases
    needs: [build-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body.md
          files: |
            artifacts/DshCockpit-*-mac-arm64.dmg
            artifacts/DshCockpit-*-mac-arm64.zip
            artifacts/DshCockpit-*-slim-mac-arm64.zip
            artifacts/latest-mac.yml
            artifacts/SHA256SUMS-mac-arm64.txt

  upload-x64:
    name: attach x64 build to release
    needs: [build-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-x64
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DshCockpit-*-mac-x64.dmg
            artifacts/DshCockpit-*-mac-x64.zip
            artifacts/DshCockpit-*-slim-mac-x64.zip
            artifacts/SHA256SUMS-mac-x64.txt
