# R2 upstream compatibility pipeline: verify a @deepseek-ai/dsh release
# installs and boots on win + mac, then aggregate the verdicts into the repo's
# public compat artifacts (docs/compat/) via a PR — "who declared compat
# first" is a user decision moment, so this runs on demand and daily.
#
# Outputs (created by scripts/upstream-compat-report.js):
#   docs/compat/compat-status.json   ledger read by the app + badge generator
#   docs/compat/badge.json           shields.io endpoint payload for the README badge
#   docs/compat/<date>-<version>.md  human-readable report with failure summaries
#   docs/compat/discussion-body.md   GitHub Discussion announcement template
name: upstream-compat

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Specific @deepseek-ai/dsh version (empty = resolve dist-tag below)'
        required: false
        default: ''
      resolve_tag:
        description: 'Dist-tag to resolve when no explicit version is given'
        required: false
        default: 'next'
  schedule:
    - cron: '0 3 * * *' # daily drill: catch upstream rc releases within hours

permissions:
  contents: write
  pull-requests: write

jobs:
  # Daily green/red signal for the unit suite on both platforms. Deliberately
  # NOT a dependency of `report`: a red test run must not stop the compat
  # ledger from being recorded.
  test:
    name: unit tests (${{ matrix.os }})
    # 2026-09-26: informational — a red unit suite must not turn the daily run
    # red (that is what spammed failure mails). The outcome is reported in the
    # notify mail / run summary instead. Time-boxed: a hanging test must not
    # hold the scheduled pipeline open (Windows runners hung >30min once).
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-26: 资产复现链/台账类测试要读 git 历史，浅克隆会全红
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Python deps for asset tests (pillow/numpy)
        shell: bash
        timeout-minutes: 8
        run: python -m pip install --quiet --no-input pillow numpy

      - run: npm test

  smoke:
    name: smoke ${{ matrix.os }}
    # 2026-09-26: informational for the same reason — the per-platform verdict
    # is recorded by `report` and mailed by `notify`; the run itself stays green.
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not hide the other's verdict
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-26: 资产复现链/台账类测试要读 git 历史，浅克隆会全红
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # arborist reify of the dsh runtime can exceed Node's default heap on CI
      # NOTE (2026-09-16): no continue-on-error here anymore. The smoke script
      # writes its result JSON before EVERY exit path (emit() precedes exit 1/2),
      # so letting the step fail red is safe: the report job below runs on
      # !cancelled() and still records the verdict into the ledger + PR.
      - name: Run compat smoke
        id: smoke
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          node scripts/upstream-compat-smoke.js
          ${{ github.event.inputs.upstream_version && format('--version {0}', github.event.inputs.upstream_version) || '' }}
          --resolve-tag ${{ github.event.inputs.resolve_tag || 'next' }}
          --out compat-result-${{ matrix.os }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-result-${{ matrix.os }}
          if-no-files-found: error
          path: compat-result-${{ matrix.os }}.json

  report:
    name: aggregate & open PR
    needs: smoke
    # !cancelled(): even when a smoke leg failed red, the ledger must record
    # whatever verdicts WERE produced — a missing artifact becomes visible in
    # the verdict step below instead of silently skipping the report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-26: 资产复现链/台账类测试要读 git 历史，浅克隆会全红
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the report script requires prod deps (semver); this job never
      # installed them before 2026-09-16 — hidden because the daily runs
      # died earlier at smoke resolution for 24 days
      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          path: .compat-artifacts

      # flatten artifact dirs so loadResults() sees plain *.json files
      - name: Flatten artifacts
        run: |
          mkdir -p .compat-flat
          find .compat-artifacts -name 'compat-result-*.json' -exec cp {} .compat-flat/ \;

      - name: Build compat artifacts
        run: node scripts/upstream-compat-report.js --in .compat-flat --out docs/compat

      # The aggregate verdict must be HONEST: the workflow goes red when the
      # run found upstream incompatibility OR when a platform's verdict is
      # missing (a swallowed smoke crash). Judges the RAW result JSONs from
      # .compat-flat — create-pull-request resets the working tree after
      # committing, so the ledger file is NOT a reliable source post-PR.
      - name: Verdict (red on incompatible or incomplete run)
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const names = fs.readdirSync(".compat-flat").filter((n) => n.endsWith(".json"));
            const byPlatform = {};
            for (const n of names) {
              const r = JSON.parse(fs.readFileSync(".compat-flat/" + n, "utf8"));
              if (r && r.schema === 1) byPlatform[r.platform || "unknown"] = !!r.ok;
            }
            const want = ["darwin-arm64", "win32-x64"];
            const missing = want.filter((p) => !(p in byPlatform));
            const failed = Object.entries(byPlatform).filter(([, ok]) => !ok).map(([p]) => p);
            const first = names.length ? JSON.parse(fs.readFileSync(".compat-flat/" + names[0], "utf8")) : null;
            const version = first && first.version ? first.version : "?";
            // 2026-09-26: this step used to exit 1 on incompatibility, which made the
            // DAILY run red and spammed failure mails. The verdict is DATA, not a
            // pipeline failure: record it, render a summary, and let the notify job
            // mail it. Nothing exits non-zero here anymore.
            const lines = names.map((n) => {
              const r = JSON.parse(fs.readFileSync(".compat-flat/" + n, "utf8"));
              const p = r.platform || "unknown";
              const reasons = (r.reasons || r.errors || []).slice(0, 4).join("; ");
              return { platform: p, ok: !!r.ok, reasons };
            });
            const status = (missing.length || failed.length) ? "NEEDS ATTENTION" : "all green";
            const md = [
              "# 上游兼容验证结果（@deepseek-ai/dsh " + version + "）",
              "",
              "- 结论：**" + status + "**",
              "- 平台结果：" + (lines.map((l) => l.platform + "=" + (l.ok ? "pass" : "FAIL")).join(", ") || "(无)"),
              (missing.length ? "- 缺结果的平台：" + missing.join(", ") : ""),
              (failed.length ? "- 未通过的平台：" + failed.join(", ") : ""),
              "",
              ...lines.filter((l) => l.reasons).map((l) => "- " + l.platform + "：" + l.reasons),
              "",
              "- 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            ].filter((x) => x !== "").join("\n");
            fs.writeFileSync("compat-summary.md", md);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            console.log("[verdict] " + version + " " + status + " :: " + JSON.stringify(lines));
          '

      # !cancelled(): the ledger PR must be recorded even when the verdict
      # above went red (incompatibility IS the data we want on record).
      - name: Create Pull Request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: compat/auto-report
          delete-branch: true
          title: 'chore(compat): upstream verification report'
          body-path: docs/compat/discussion-body.md
          commit-message: 'chore(compat): record upstream compatibility run'

      # Optional announcement: set the repo variable COMPAT_DISCUSSION_CATEGORY_ID
      # to enable; the body template is generated next to the report.
      - name: Publish Discussion
        if: ${{ !cancelled() && vars.COMPAT_DISCUSSION_CATEGORY_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPAT_DISCUSSION_CATEGORY_ID: ${{ vars.COMPAT_DISCUSSION_CATEGORY_ID }}
        run: |
          gh api graphql -f query='mutation($repo:String!,$cat:ID!,$title:String!,$body:String!){
            createDiscussion(input:{repositoryId:$repo,categoryId:$cat,title:$title,body:$body}){
              discussion{ url }
            }
          }' -f repo="${{ github.repository_id }}" -f cat="$COMPAT_DISCUSSION_CATEGORY_ID" \
             -f title="$(head -1 docs/compat/discussion-body.md | tr -d '*')" \
             -f body="$(cat docs/compat/discussion-body.md)" || \
          echo "::warning::discussion publish failed (check category id)"


  # 2026-09-26: upstream verdicts are delivered by e-mail instead of failing the
  # daily run. Add these repo secrets to enable delivery (Settings → Secrets):
  #   SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, MAIL_TO
  # Without them the job only warns and the verdict stays in the run summary.
  notify:
    name: e-mail the upstream verdict
    needs: [test, smoke, report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      UNIT_TEST_RESULT: ${{ needs.test.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: .compat-artifacts

      - name: Compose verdict mail
        run: |
          mkdir -p .compat-flat
          find .compat-artifacts -name 'compat-result-*.json' -exec cp {} .compat-flat/ \;
          node -e '
            const fs = require("fs");
            const names = fs.readdirSync(".compat-flat").filter((n) => n.endsWith(".json"));
            const rows = names.map((n) => JSON.parse(fs.readFileSync(".compat-flat/" + n, "utf8")));
            const version = rows.find((r) => r && r.version)?.version || "(unknown)";
            const bad = rows.filter((r) => !r.ok).map((r) => r.platform || "unknown");
            const missing = ["darwin-arm64", "win32-x64"].filter((p) => !rows.some((r) => (r.platform || "") === p));
            const ok = rows.length > 0 && bad.length === 0 && missing.length === 0;
            const subject = `[DshCockpit] 上游兼容验证：${version} ${ok ? "全部通过 ✅" : "需要关注 ⚠️"}`;
            const body = [
              `上游版本：${version}`,
              `结论：${ok ? "全部通过" : "需要关注"}`,
              `单元测试（win/mac）：${process.env.UNIT_TEST_RESULT}`,
              "",
              "平台明细：",
              ...rows.map((r) => `- ${r.platform || "unknown"}：${r.ok ? "pass" : "FAIL"}` + ((r.reasons || []).length ? ` — ${(r.reasons || []).slice(0, 3).join("; ")}` : "")),
              missing.length ? `- 缺结果：${missing.join(", ")}` : "",
              "",
              `运行日志：${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              "",
              "（这封邮件由 upstream-compat 工作流自动发送；判红不再触发失败邮件。）",
            ].filter(Boolean).join("\n");
            fs.writeFileSync("mail-subject.txt", subject);
            fs.writeFileSync("mail-body.txt", body);
            console.log(subject);
          '

      - name: Send verdict mail
        if: ${{ env.SMTP_SERVER != '' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || '587' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: ${{ 'DshCockpit 上游兼容验证结果' }}
          to: ${{ env.MAIL_TO }}
          from: ${{ env.SMTP_USERNAME }}
          body: file://mail-body.txt

      - name: No mail configured (warn only)
        if: ${{ env.SMTP_SERVER == '' || env.MAIL_TO == '' }}
        run: echo "::warning::SMTP_SERVER/MAIL_TO 未配置，跳过邮件；结论已写入本次运行 Summary。"
