name: Bug 报告
description: 提交一个 Bug，帮助改进 DshCockpit
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢反馈！
        请尽量填写以下信息，方便我们快速定位问题。
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 你使用的 DshCockpit 版本（设置页「关于」中可查看，如 v0.2.5）
      placeholder: v0.2.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Windows 10
        - Windows 11
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 发生了什么？预期行为是什么？
      placeholder: 请详细描述问题现象
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何稳定复现这个 Bug？
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 发现 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有报错日志、控制台输出或截图，请附上（可稍后补充）
      render: shell
